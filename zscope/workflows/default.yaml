name: default
mode: default
description: Full fresh scan from configured or discovered entry functions.
steps:
  - id: discover_entries
    scope: session
    handler: discover_entries
    action: classify API, communication, thread, and other user-input entries when requested
  - id: collect_candidates
    scope: entry
    agent: active_discovery
    action: register deterministic and active-discovery candidates in the Candidate Ledger
  - id: validate_candidates
    scope: entry
    agent: validator_agent
    action: validate registered candidates and close their ledger lifecycle
  - id: persist_report
    scope: entry
    action: write final JSON/Markdown report and snapshot final_report_file
