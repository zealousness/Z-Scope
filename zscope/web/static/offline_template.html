<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Z-SCOPE 离线审计页面</title>
<style>
:root {
  --bg: #0b1220;
  --panel: #111827;
  --panel-soft: #0f172a;
  --border: #1f2937;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --primary: #38bdf8;
  --success: #22c55e;
  --error: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top, #111827 0%, #0b1220 55%); color: var(--text); overflow: hidden; }
header { padding: 12px 16px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border); display:flex; gap:12px; align-items:center; flex-wrap:wrap; height: 58px; }
button { background: #0284c7; border: 0; border-radius: 8px; color: white; padding: 8px 12px; cursor: pointer; font-weight: 600; }
small { color: var(--muted); }
main { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px; height: calc(100vh - 58px); }
.panel { background: rgba(17, 24, 39, 0.95); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 16px 16px 0; }
.panel-body { padding: 16px; flex: 1; overflow-y: auto; }
.hint { color: var(--muted); font-size: 12px; }
.issue { border: 1px solid #374151; border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all .15s ease; background: #111827; }
.issue:hover { border-color: #4b5563; }
.issue.active { border-color: var(--primary); background: #1e293b; }
.search-wrap { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.search { width: 100%; background: #0b1220; color: var(--text); border: 1px solid #374151; border-radius: 8px; padding: 8px; }
select.search { cursor: pointer; }
.grid-layout { display: flex; flex-direction: column; gap: 16px; height: 100%; }
.block-top { flex: 1; background: #1e1e1e; border-radius: 10px; border: 1px solid #374151; display: flex; flex-direction: column; overflow: hidden; }
.block-top-header { padding: 12px; border-bottom: 1px solid #374151; background: rgba(255,255,255,0.05); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.block-middle { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 35%; }
.block-card { background: var(--panel-soft); border-radius: 10px; border: 1px solid #374151; padding: 16px; overflow-y: auto; }
.block-bottom { background: var(--panel-soft); border-radius: 10px; border: 1px solid #374151; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; border: 1px solid currentColor; }
.badge-error { color: var(--error); }
.badge-warning { color: var(--warning); }
.badge-info { color: var(--info); }
.badge-success { color: var(--success); }
.badge-ghost { color: var(--muted); }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
input, select, textarea { width: 100%; background: #0b1220; color: var(--text); border: 1px solid #374151; border-radius: 8px; padding: 8px; font-family: inherit; }
textarea { min-height: 80px; resize: vertical; }
pre { margin: 0; padding: 16px; font-size: 13px; font-family: 'Fira Code', monospace; white-space: pre-wrap; word-break: break-word; }
.block-top pre { flex: 1; overflow-y: auto; }
.sec-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.text-success { color: var(--success); }
@media (max-width: 1200px) { main { grid-template-columns: 1fr; height: auto; overflow: auto; } body { overflow: auto; } .block-middle { grid-template-columns: 1fr; height: auto; } .block-top { min-height: 300px; } }
</style>
</head>
<body>
<script id="zscope-offline-state" type="application/json">__ZCOPE_OFFLINE_STATE__</script>
<header>
  <button id="savePageBtn">保存当前离线页面</button>
  <button id="defaultViewBtn" type="button">Default</button>
  <button id="needsReviewViewBtn" type="button">With needs_review</button>
  <small>离线模式支持筛选、查看详情并编辑 validation_status / 人工反驳说明（user_rebuttal）；validator 的 validation_reasoning 为只读结论。</small>
</header>
<main>
  <section class="panel">
    <div class="panel-header">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0; font-size:14px; text-transform:uppercase; color:var(--muted);">审计发现</h3>
        <span id="filterHint" class="hint">显示 0 / 0</span>
      </div>
      <div class="search-wrap">
        <input id="filterInput" class="search" placeholder="模糊匹配筛选" />
        <select id="filterField" class="search">
          <option value="all">全部字段</option>
          <option value="function">函数名</option>
          <option value="location">位置</option>
          <option value="category">类别</option>
          <option value="subcategory">子类</option>
          <option value="description">描述</option>
          <option value="impact_level">影响等级</option>
          <option value="validation_status">验证状态</option>
        </select>
      </div>
    </div>
    <div class="panel-body" id="issueList"></div>
  </section>

  <section class="panel" style="background: transparent; border: none; padding: 0; overflow: hidden;">
    <div id="selectedView" class="grid-layout" style="display: none;">
      <!-- Block 1: Info & Code Snippet -->
      <div class="block-top">
        <div class="block-top-header">
          <div style="font-family:monospace; color:var(--muted); font-size:13px;" id="loc"></div>
          <div style="display:flex; gap:8px;">
            <span class="badge badge-ghost" id="subcat"></span>
            <span class="badge" id="sev"></span>
          </div>
        </div>
        <pre><code id="snippet"></code></pre>
      </div>

      <!-- Block 2 & 3: Reasoning & Fix -->
      <div class="block-middle">
        <div class="block-card">
          <div class="sec-title" style="color:var(--primary);">✨ AI 推理链 (Reasoning)</div>
          <div style="font-size:13px; line-height:1.6; color:#d1d5db; white-space:pre-wrap;" id="reasoning"></div>
          <div style="border-top:1px solid #374151; margin-top:12px; padding-top:12px;">
            <label>规则 / 验证证据</label>
            <div style="font-size:12px; line-height:1.6; color:#d1d5db; white-space:pre-wrap;" id="evidenceDetails"></div>
          </div>
        </div>
        <div class="block-card" style="border-left: 4px solid var(--border);" id="detailsCard">
          <div class="sec-title" style="color:white;">漏洞详情</div>
          <label>根本原因</label>
          <div style="font-size:13px; margin-bottom:12px;" id="rootCause"></div>
          <label>修复建议</label>
          <div style="font-size:13px;" class="text-success" id="fix"></div>
        </div>
      </div>

      <!-- Block 4: Validation -->
      <div class="block-bottom">
        <div style="display:flex; align-items:center; gap:12px;">
          <h3 style="margin:0; font-size:14px;">验证结果</h3>
          <select id="status" style="width:auto; padding:4px 8px;">
            <option value="validated">validated</option>
            <option value="needs_review">needs_review</option>
            <option value="uncertain">uncertain</option>
            <option value="unvalidated">unvalidated</option>
            <option value="pending">pending</option>
            <option value="rejected">rejected</option>
          </select>
          <span style="font-size:12px; color:var(--muted);">此处修改将保存在离线 HTML 内</span>
        </div>
        <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);">Validator 验证说明（只读）</label>
        <textarea id="reason" readonly placeholder="Validator 未提供验证说明" style="background:rgba(148,163,184,0.08);"></textarea>
        <div id="llmExplanationWrap" style="display:none; margin-top:8px;">
          <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);">决策解释（LLM 补充，只读）</label>
          <div id="llmExplanation" style="font-size:13px; line-height:1.6; color:#d1d5db; white-space:pre-wrap; background:rgba(148,163,184,0.08); border-radius:6px; padding:8px;"></div>
        </div>
        <div id="promotionReviewWrap" style="display:none; margin-top:8px;">
          <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);">未晋级为 validated 的原因（只读）</label>
          <div id="promotionReview" style="font-size:13px; line-height:1.6; color:#d1d5db; white-space:pre-wrap; background:rgba(148,163,184,0.08); border-radius:6px; padding:8px;"></div>
        </div>
        <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-top:8px;">人工反驳 / 复核说明</label>
        <textarea id="rebuttal" placeholder="填写人工验证依据，例如：为什么确认为真阳性 / 为什么拒绝 / 还需要检查哪些路径（支持多行文本）"></textarea>
      </div>
    </div>
    <div id="emptyView" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; opacity:0.3;">
      <h2 style="font-weight:normal;">请从左侧选择一条审计发现</h2>
    </div>
  </section>
</main>
<script>
(() => {
  function decodeBase64Utf8(base64Text) {
    const binary = atob(base64Text);
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function encodeBase64Utf8(plainText) {
    const bytes = new TextEncoder().encode(plainText);
    let binary = '';
    bytes.forEach(b => {
      binary += String.fromCharCode(b);
    });
    return btoa(binary);
  }

  function bytesToBase64(bytes) {
    let binary = '';
    const chunkSize = 0x8000;
    for (let offset = 0; offset < bytes.length; offset += chunkSize) {
      const chunk = bytes.subarray(offset, offset + chunkSize);
      binary += String.fromCharCode(...chunk);
    }
    return btoa(binary);
  }

  function base64ToBytes(base64Text) {
    const binary = atob(base64Text);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  async function compressOfflineText(plainText) {
    if (typeof CompressionStream !== 'undefined') {
      const stream = new Blob([plainText]).stream().pipeThrough(new CompressionStream('gzip'));
      const buffer = await new Response(stream).arrayBuffer();
      return `gzip-base64:${bytesToBase64(new Uint8Array(buffer))}`;
    }
    return `base64:${encodeBase64Utf8(plainText)}`;
  }

  async function decompressOfflineText(encodedText) {
    const text = String(encodedText || '');
    if (text.startsWith('gzip-base64:')) {
      const bytes = base64ToBytes(text.slice('gzip-base64:'.length));
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('当前浏览器不支持 gzip 离线数据解压');
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }
    if (text.startsWith('base64:')) {
      return decodeBase64Utf8(text.slice('base64:'.length));
    }
    return text;
  }

  function parseOfflineState(rawText) {
    const trimmed = String(rawText || '').trim();
    if (!trimmed) {
      return {};
    }
    if (trimmed.startsWith('base64:')) {
      const decoded = decodeBase64Utf8(trimmed.slice('base64:'.length));
      return JSON.parse(decoded);
    }
    return JSON.parse(trimmed);
  }

  function offlineIssueKey(issue, fallback = '') {
    if (!issue || typeof issue !== 'object') {
      return `issue:${fallback}`;
    }
    const stable = issue.dedup_key || issue.stable_fingerprint || issue.fingerprint;
    if (stable) {
      return String(stable);
    }
    const identity = [
      issue.id || '',
      issue.function || issue.func_name || '',
      issue.location || issue.file || issue.file_path || '',
      issue.subcategory || issue.defect_class || issue.category || '',
    ].map(part => String(part).replace(/\s+/g, ' ').trim());
    const key = identity.join('|');
    return identity.some(Boolean) ? key : `issue:${fallback}`;
  }

  function stripRuntimeFields(issue) {
    if (!issue || typeof issue !== 'object') {
      return issue;
    }
    const { uid, _offline_id, ...rest } = issue;
    return { ...rest };
  }

  function hydrateOfflineState(rawState) {
    const hydrated = rawState && typeof rawState === 'object' ? rawState : {};
    hydrated.reportViews = hydrated.reportViews || {};
    hydrated.reportView = hydrated.reportView || 'default';
    hydrated.issueSummaries = hydrated.issueSummaries && typeof hydrated.issueSummaries === 'object'
      ? hydrated.issueSummaries
      : {};
    hydrated.issueChunks = hydrated.issueChunks && typeof hydrated.issueChunks === 'object'
      ? hydrated.issueChunks
      : {};
    if (Object.keys(hydrated.issueSummaries).length) {
      Object.entries(hydrated.reportViews).forEach(([, view]) => {
        if (!view || typeof view !== 'object' || !Array.isArray(view.issueRefs)) {
          return;
        }
        view.issues = view.issueRefs
          .map(ref => hydrated.issueSummaries[ref])
          .filter(issue => issue && typeof issue === 'object');
      });
      if (!Array.isArray(hydrated.findings) || !hydrated.findings.length) {
        const selectedView = hydrated.reportViews[hydrated.reportView] || {};
        const refs = Array.isArray(hydrated.currentIssueRefs)
          ? hydrated.currentIssueRefs
          : (Array.isArray(selectedView.issueRefs) ? selectedView.issueRefs : []);
        hydrated.findings = refs
          .map(ref => hydrated.issueSummaries[ref])
          .filter(issue => issue && typeof issue === 'object');
      }
    }
    const store = hydrated.issueStore && typeof hydrated.issueStore === 'object' ? hydrated.issueStore : null;
    if (store) {
      Object.entries(hydrated.reportViews).forEach(([, view]) => {
        if (!view || typeof view !== 'object' || !Array.isArray(view.issueRefs)) {
          return;
        }
        view.issues = view.issueRefs
          .map(ref => store[ref])
          .filter(issue => issue && typeof issue === 'object');
      });
      if (!Array.isArray(hydrated.findings) || !hydrated.findings.length) {
        const selectedView = hydrated.reportViews[hydrated.reportView] || {};
        const refs = Array.isArray(hydrated.currentIssueRefs)
          ? hydrated.currentIssueRefs
          : (Array.isArray(selectedView.issueRefs) ? selectedView.issueRefs : []);
        hydrated.findings = refs
          .map(ref => store[ref])
          .filter(issue => issue && typeof issue === 'object');
      }
    }
    if (!Array.isArray(hydrated.findings) || !hydrated.findings.length) {
      const selectedView = hydrated.reportViews[hydrated.reportView] || {};
      if (Array.isArray(selectedView.issues)) {
        hydrated.findings = selectedView.issues;
      }
    }
    hydrated.findings = Array.isArray(hydrated.findings) ? hydrated.findings : [];
    hydrated.findings.forEach((issue, index) => {
      if (!issue || typeof issue !== 'object') {
        return;
      }
      const key = issue._offline_id || offlineIssueKey(issue, `current:${index}`);
      issue._offline_id = key;
      hydrated.issueSummaries[key] = hydrated.issueSummaries[key] || issue;
    });
    return hydrated;
  }

  async function dehydrateOfflineState(source) {
    const issueSummaries = {};
    const issueChunks = { ...(source.issueChunks || {}) };
    const addIssue = async (issue, fallback) => {
      if (!issue || typeof issue !== 'object') {
        return null;
      }
      const key = issue._offline_id || offlineIssueKey(issue, fallback);
      issue._offline_id = key;
      const summary = stripRuntimeFields(issue);
      summary._offline_id = key;
      summary._detail_lazy = true;
      delete summary.code_snippet;
      delete summary.reasoning;
      delete summary.reasoning_process;
      delete summary.evidence_pack;
      delete summary.positive_evidence;
      delete summary.negative_evidence;
      delete summary.related_needs_review_observations;
      issueSummaries[key] = { ...(source.issueSummaries ? source.issueSummaries[key] : {}), ...summary };
      if (!issueChunks[key] && Object.keys(issue).length > Object.keys(summary).length) {
        const detail = stripRuntimeFields(issue);
        detail._offline_id = key;
        issueChunks[key] = await compressOfflineText(JSON.stringify(detail));
      }
      return key;
    };
    const reportViews = {};
    for (const [name, view] of Object.entries(source.reportViews || {})) {
      if (!view || typeof view !== 'object') {
        continue;
      }
      const refs = [];
      if (Array.isArray(view.issues)) {
        for (let index = 0; index < view.issues.length; index += 1) {
          const ref = await addIssue(view.issues[index], `${name}:${index}`);
          if (ref) refs.push(ref);
        }
      } else if (Array.isArray(view.issueRefs)) {
        refs.push(...view.issueRefs);
        view.issueRefs.forEach(ref => {
          const summary = source.issueSummaries && source.issueSummaries[ref];
          if (summary) {
            issueSummaries[ref] = summary;
          }
        });
      }
      reportViews[name] = {
        label: view.label || name,
        description: view.description || '',
        issue_count: view.issue_count ?? refs.length,
        included_needs_review_count: view.included_needs_review_count || 0,
        independent_needs_review_count: view.independent_needs_review_count || 0,
        attached_needs_review_count: view.attached_needs_review_count || 0,
        issueRefs: refs,
      };
    }
    const currentIssueRefs = [];
    const currentFindings = Array.isArray(source.findings) ? source.findings : [];
    for (let index = 0; index < currentFindings.length; index += 1) {
      const ref = await addIssue(currentFindings[index], `${source.reportView || 'current'}:${index}`);
      if (ref) currentIssueRefs.push(ref);
    }
    if (!reportViews[source.reportView]) {
      reportViews[source.reportView] = {
        label: source.reportView || 'Current',
        description: 'Current offline view.',
        issue_count: currentIssueRefs.length,
        included_needs_review_count: 0,
        independent_needs_review_count: 0,
        attached_needs_review_count: 0,
        issueRefs: currentIssueRefs,
      };
    } else if (!Array.isArray(reportViews[source.reportView].issueRefs) || !reportViews[source.reportView].issueRefs.length) {
      reportViews[source.reportView].issueRefs = currentIssueRefs;
      reportViews[source.reportView].issue_count = currentIssueRefs.length;
    }
    return {
      schemaVersion: 3,
      reportSummary: source.reportSummary || {},
      reportViews,
      reportView: source.reportView || 'default',
      viewSummary: source.viewSummary || {},
      currentIssueRefs,
      issueSummaries,
      issueChunks,
      exportedAt: new Date().toISOString(),
    };
  }

  const stateScript = document.getElementById('zscope-offline-state');
  const state = hydrateOfflineState(parseOfflineState(stateScript ? stateScript.textContent : '{}'));
  let currentIndex = -1;
  let filteredIndexes = state.findings.map((_, i) => i);

  const listEl = document.getElementById('issueList');
  const filterInputEl = document.getElementById('filterInput');
  const filterFieldEl = document.getElementById('filterField');
  const filterHintEl = document.getElementById('filterHint');
  const locEl = document.getElementById('loc');
  const subcatEl = document.getElementById('subcat');
  const sevEl = document.getElementById('sev');
  const statusEl = document.getElementById('status');
  const reasonEl = document.getElementById('reason');
  const llmExplanationEl = document.getElementById('llmExplanation');
  const llmExplanationWrapEl = document.getElementById('llmExplanationWrap');
  const promotionReviewEl = document.getElementById('promotionReview');
  const promotionReviewWrapEl = document.getElementById('promotionReviewWrap');
  const rebuttalEl = document.getElementById('rebuttal');
  const snippetEl = document.getElementById('snippet');
  const reasoningEl = document.getElementById('reasoning');
  const evidenceDetailsEl = document.getElementById('evidenceDetails');
  const rootCauseEl = document.getElementById('rootCause');
  const fixEl = document.getElementById('fix');
  const detailsCardEl = document.getElementById('detailsCard');
  const selectedViewEl = document.getElementById('selectedView');
  const emptyViewEl = document.getElementById('emptyView');
  const defaultViewBtn = document.getElementById('defaultViewBtn');
  const needsReviewViewBtn = document.getElementById('needsReviewViewBtn');
  const detailCache = state.issueStore && typeof state.issueStore === 'object' ? state.issueStore : {};
  let hasUnsavedValidationChanges = false;
  let savedValidationSignature = '';

  function collectValidationSignatureIssue(issue, fallback, bucket) {
    if (!issue || typeof issue !== 'object') {
      return;
    }
    const key = issue._offline_id || offlineIssueKey(issue, fallback);
    bucket[key] = [
      String(issue.validation_status ?? ''),
      String(issue.validation_reasoning ?? ''),
      String(issue.user_rebuttal ?? ''),
    ];
  }

  function validationSignature() {
    const bucket = {};
    Object.entries(state.issueStore || {}).forEach(([key, issue]) => {
      collectValidationSignatureIssue(issue, key, bucket);
    });
    Object.entries(state.reportViews || {}).forEach(([viewName, view]) => {
      if (!view || typeof view !== 'object' || !Array.isArray(view.issues)) {
        return;
      }
      view.issues.forEach((issue, index) => {
        collectValidationSignatureIssue(issue, `${viewName}:${index}`, bucket);
      });
    });
    state.findings.forEach((issue, index) => {
      collectValidationSignatureIssue(issue, `${state.reportView || 'current'}:${index}`, bucket);
    });
    Object.entries(state.issueSummaries || {}).forEach(([key, issue]) => {
      collectValidationSignatureIssue(issue, key, bucket);
    });
    return JSON.stringify(Object.keys(bucket).sort().map(key => [key, ...bucket[key]]));
  }

  function markValidationStateSaved() {
    savedValidationSignature = validationSignature();
    hasUnsavedValidationChanges = false;
  }

  function refreshUnsavedValidationChanges() {
    hasUnsavedValidationChanges = validationSignature() !== savedValidationSignature;
  }

  window.addEventListener('beforeunload', (event) => {
    refreshUnsavedValidationChanges();
    if (!hasUnsavedValidationChanges) {
      return;
    }
    event.preventDefault();
    event.returnValue = '';
  });

  function updateIssueSummary(issue) {
    if (!issue || typeof issue !== 'object') {
      return;
    }
    const key = issue._offline_id || offlineIssueKey(issue);
    issue._offline_id = key;
    const summary = stripRuntimeFields(issue);
    delete summary.code_snippet;
    delete summary.reasoning;
    delete summary.reasoning_process;
    delete summary.evidence_pack;
    delete summary.positive_evidence;
    delete summary.negative_evidence;
    delete summary.related_needs_review_observations;
    state.issueSummaries[key] = {
      ...(state.issueSummaries[key] || {}),
      ...summary,
      _offline_id: key,
      _detail_lazy: true,
    };
  }

  function mergeSummaryState(detail, summary) {
    if (!summary || typeof summary !== 'object') {
      return detail;
    }
    const merged = { ...(detail || {}), ...summary };
    merged._offline_id = summary._offline_id || (detail && detail._offline_id);
    return merged;
  }

  async function loadIssueDetail(summary) {
    if (!summary || typeof summary !== 'object') {
      return null;
    }
    const key = summary._offline_id || offlineIssueKey(summary);
    summary._offline_id = key;
    if (detailCache[key]) {
      const merged = mergeSummaryState(detailCache[key], summary);
      detailCache[key] = merged;
      return merged;
    }
    const chunk = state.issueChunks ? state.issueChunks[key] : null;
    if (!chunk) {
      return summary;
    }
    const json = await decompressOfflineText(chunk);
    const detail = JSON.parse(json);
    const merged = mergeSummaryState(detail, summary);
    detailCache[key] = merged;
    return merged;
  }

  function updateViewButtons() {
    if (!defaultViewBtn || !needsReviewViewBtn) return;
    defaultViewBtn.style.background = state.reportView === 'default' ? '#0284c7' : '#334155';
    needsReviewViewBtn.style.background = state.reportView === 'with_needs_review' ? '#0284c7' : '#334155';
    defaultViewBtn.disabled = !(
      state.reportViews.default &&
      (Array.isArray(state.reportViews.default.issues) || Array.isArray(state.reportViews.default.issueRefs))
    );
    needsReviewViewBtn.disabled = !(
      state.reportViews.with_needs_review &&
      (Array.isArray(state.reportViews.with_needs_review.issues) || Array.isArray(state.reportViews.with_needs_review.issueRefs))
    );
  }

  function issuesForReportView(viewName) {
    const selected = state.reportViews[viewName];
    if (!selected || typeof selected !== 'object') {
      return [];
    }
    if (Array.isArray(selected.issues)) {
      return selected.issues;
    }
    const summaries = state.issueSummaries && typeof state.issueSummaries === 'object' ? state.issueSummaries : {};
    const store = state.issueStore && typeof state.issueStore === 'object' ? state.issueStore : {};
    if (Array.isArray(selected.issueRefs)) {
      selected.issues = selected.issueRefs
        .map(ref => summaries[ref] || store[ref])
        .filter(issue => issue && typeof issue === 'object');
      return selected.issues;
    }
    return [];
  }

  function activateReportView(view) {
    const selected = state.reportViews[view];
    if (!selected) {
      return;
    }
    state.reportView = view;
    state.findings = issuesForReportView(view);
    currentIndex = -1;
    filteredIndexes = state.findings.map((_, i) => i);
    renderList();
    updateViewButtons();
    if (state.findings.length > 0) {
      select(filteredIndexes[0] ?? 0);
    } else {
      select(-1);
    }
  }

  function getSeverityClass(level) {
    const cls = { critical:'badge-error', high:'badge-warning', medium:'badge-info', low:'badge-ghost' };
    return cls[(level||'').toLowerCase()] || 'badge-ghost';
  }

  function getValidationClass(status) {
    const cls = {
      validated:'badge-success',
      needs_review:'badge-info',
      uncertain:'badge-ghost',
      unvalidated:'badge-warning',
      pending:'badge-warning',
      rejected:'badge-error'
    };
    return cls[(status||'').toLowerCase()] || 'badge-ghost';
  }

  function getBorderColor(level) {
    const cls = { critical:'var(--error)', high:'var(--warning)', medium:'var(--info)', low:'var(--muted)' };
    return cls[(level||'').toLowerCase()] || 'var(--border)';
  }

  function setLlmExplanation(value) {
    const text = String(value || '').trim();
    if (!llmExplanationEl || !llmExplanationWrapEl) return;
    llmExplanationEl.textContent = text;
    llmExplanationWrapEl.style.display = text ? 'block' : 'none';
  }

  function setPromotionReview(value) {
    const text = String(value || '').trim();
    if (!promotionReviewEl || !promotionReviewWrapEl) return;
    promotionReviewEl.textContent = text;
    promotionReviewWrapEl.style.display = text ? 'block' : 'none';
  }

  function formatFindingEvidence(finding) {
    if (!finding) return '';
    const lines = [];
    const evidencePack = finding.evidence_pack || {};
    const score = finding.final_score ?? evidencePack.final_score;
    if (finding.source || finding.sink) {
      lines.push(`Source/Sink: ${finding.source || 'unknown'} -> ${finding.sink || 'unknown'}`);
    }
    if (finding.rule || finding.cwe || finding.defect_class) {
      lines.push(`Rule: ${finding.rule || finding.defect_class || 'unknown'}${finding.cwe ? ` (${finding.cwe})` : ''}`);
    }
    if (score !== undefined && score !== null && score !== '') {
      const numeric = Number(score);
      lines.push(`Score: ${Number.isFinite(numeric) ? numeric.toFixed(2) : score}`);
    }
    const positives = Array.isArray(finding.positive_evidence)
      ? finding.positive_evidence
      : (Array.isArray(evidencePack.positive_evidence) ? evidencePack.positive_evidence : []);
    const negatives = Array.isArray(finding.negative_evidence)
      ? finding.negative_evidence
      : (Array.isArray(evidencePack.negative_evidence) ? evidencePack.negative_evidence : []);
    if (positives.length) {
      lines.push('正向证据:');
      positives.slice(0, 8).forEach(item => lines.push(`- ${item}`));
    }
    if (negatives.length) {
      lines.push('反向证据 / 待复核点:');
      negatives.slice(0, 6).forEach(item => lines.push(`- ${item}`));
    }
    const refs = Array.isArray(finding.evidence_refs)
      ? finding.evidence_refs
      : (Array.isArray(evidencePack.evidence_refs) ? evidencePack.evidence_refs : []);
    if (refs.length) {
      lines.push(`Evidence refs: ${refs.slice(0, 8).join(', ')}`);
    }
    return lines.join('\n');
  }

  function fuzzyScore(text, query) {
    const t = String(text||'').toLowerCase();
    const q = String(query||'').toLowerCase();
    if (!q) return 1;
    let tIdx = 0, qIdx = 0;
    while(tIdx < t.length && qIdx < q.length) {
      if(t[tIdx] === q[qIdx]) qIdx++;
      tIdx++;
    }
    return qIdx === q.length ? 1 : 0;
  }

  function buildFilteredIndexes() {
    const query = filterInputEl.value.trim();
    const field = filterFieldEl.value;
    if (!query) {
      filteredIndexes = state.findings.map((_, i) => i);
      return;
    }

    const fieldsCfg = {
      all: ['function', 'location', 'category', 'subcategory', 'description', 'impact_level', 'validation_status'],
      function: ['function'], location: ['location'], category: ['category'], subcategory: ['subcategory'],
      description: ['description'], impact_level: ['impact_level'], validation_status: ['validation_status']
    };
    const keys = fieldsCfg[field] || fieldsCfg.all;

    filteredIndexes = state.findings
      .map((f, i) => {
        const text = keys.map(k => f[k]||'').join(' ');
        return { i, score: fuzzyScore(text, query) };
      })
      .filter(item => item.score > 0)
      .map(item => item.i);
  }

  function renderList() {
    listEl.innerHTML = '';
    buildFilteredIndexes();
    filterHintEl.textContent = `显示 ${filteredIndexes.length} / ${state.findings.length}`;

    filteredIndexes.forEach((realIndex) => {
      const f = state.findings[realIndex];
      const div = document.createElement('div');
      const sevClass = getSeverityClass(f.impact_level);
      const valClass = getValidationClass(f.validation_status);
      
      div.className = 'issue' + (realIndex === currentIndex ? ' active' : '');
      const badges = document.createElement('div');
      badges.style.cssText = 'display:flex; justify-content:space-between; margin-bottom:6px;';
      const severity = document.createElement('span');
      severity.className = `badge ${sevClass}`;
      severity.textContent = f.impact_level || 'unknown';
      const status = document.createElement('span');
      status.className = `badge ${valClass}`;
      status.textContent = f.validation_status || 'pending';
      badges.append(severity, status);

      const title = document.createElement('div');
      title.style.cssText = 'font-weight:600; font-size:13px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;';
      title.title = f.function || '';
      title.textContent = f.function || 'unknown';

      const description = document.createElement('div');
      description.style.cssText = 'font-size:12px; color:var(--muted); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis;';
      description.textContent = f.description || '';
      div.append(badges, title, description);
      div.onclick = () => select(realIndex);
      listEl.appendChild(div);
    });

    if (!filteredIndexes.length) {
      listEl.innerHTML = '<div class="hint" style="text-align:center; padding: 20px;">未找到匹配项</div>';
    }
  }

  async function select(i) {
    currentIndex = i;
    const summary = state.findings[i];
    if (!summary) {
      emptyViewEl.style.display = 'flex';
      selectedViewEl.style.display = 'none';
      return;
    }
    emptyViewEl.style.display = 'none';
    selectedViewEl.style.display = 'flex';
    const selectedKey = summary._offline_id || offlineIssueKey(summary, i);
    summary._offline_id = selectedKey;
    let f = summary;

    locEl.textContent = f.location || f.function || '';
    subcatEl.textContent = f.subcategory || '';
    sevEl.textContent = f.impact_level || '';
    sevEl.className = 'badge ' + getSeverityClass(f.impact_level);
    detailsCardEl.style.borderLeftColor = getBorderColor(f.impact_level);

    statusEl.value = f.validation_status || 'pending';
    reasonEl.value = f.validation_reasoning || '';
    setLlmExplanation(f.llm_explanation);
    setPromotionReview(f.promotion_review_reason);
    rebuttalEl.value = f.user_rebuttal || '';

    snippetEl.textContent = f.code_snippet || '暂无代码片段';
    reasoningEl.textContent = f.reasoning || f.reasoning_process || '暂无推理过程';
    evidenceDetailsEl.textContent = formatFindingEvidence(f) || '暂无结构化证据';
    rootCauseEl.textContent = f.root_cause || f.description || '暂无根本原因分析';
    fixEl.textContent = f.suggested_fix || '暂无修复建议';
    
    snippetEl.textContent = state.issueChunks && state.issueChunks[selectedKey] ? '正在加载离线详情...' : snippetEl.textContent;
    reasoningEl.textContent = state.issueChunks && state.issueChunks[selectedKey] ? '正在加载离线详情...' : reasoningEl.textContent;
    try {
      const detail = await loadIssueDetail(summary);
      if (currentIndex !== i || !detail) {
        return;
      }
      f = mergeSummaryState(detail, summary);
      state.findings[i] = f;
      locEl.textContent = f.location || f.function || '';
      subcatEl.textContent = f.subcategory || '';
      sevEl.textContent = f.impact_level || '';
      sevEl.className = 'badge ' + getSeverityClass(f.impact_level);
      detailsCardEl.style.borderLeftColor = getBorderColor(f.impact_level);
      statusEl.value = f.validation_status || 'pending';
      reasonEl.value = f.validation_reasoning || '';
      setLlmExplanation(f.llm_explanation);
      setPromotionReview(f.promotion_review_reason);
      rebuttalEl.value = f.user_rebuttal || '';
      snippetEl.textContent = f.code_snippet || '暂无代码片段';
      reasoningEl.textContent = f.reasoning || f.reasoning_process || '暂无推理过程';
      evidenceDetailsEl.textContent = formatFindingEvidence(f) || '暂无结构化证据';
      rootCauseEl.textContent = f.root_cause || f.description || '暂无根本原因分析';
      fixEl.textContent = f.suggested_fix || '暂无修复建议';
    } catch (error) {
      if (currentIndex === i) {
        snippetEl.textContent = `离线详情加载失败：${error.message || error}`;
        reasoningEl.textContent = summary.reasoning || summary.reasoning_process || '暂无推理过程';
        evidenceDetailsEl.textContent = formatFindingEvidence(summary) || '暂无结构化证据';
      }
    }
    renderList(); // update active class
  }

  statusEl.addEventListener('change', () => {
    if (currentIndex < 0) return;
    state.findings[currentIndex].validation_status = statusEl.value;
    updateIssueSummary(state.findings[currentIndex]);
    refreshUnsavedValidationChanges();
    renderList();
  });

  // #reason 为只读展示（validator 原始说明），人工输入统一写入 #rebuttal -> user_rebuttal。
  rebuttalEl.addEventListener('input', () => {
    if (currentIndex < 0) return;
    state.findings[currentIndex].user_rebuttal = rebuttalEl.value;
    updateIssueSummary(state.findings[currentIndex]);
    refreshUnsavedValidationChanges();
  });

  filterInputEl.addEventListener('input', () => {
    renderList();
    if (currentIndex >= 0 && !filteredIndexes.includes(currentIndex)) {
      if (filteredIndexes.length > 0) select(filteredIndexes[0]);
    }
  });

  filterFieldEl.addEventListener('change', () => {
    renderList();
    if (currentIndex >= 0 && !filteredIndexes.includes(currentIndex)) {
      if (filteredIndexes.length > 0) select(filteredIndexes[0]);
    }
  });

  document.getElementById('savePageBtn').addEventListener('click', async () => {
    const json = JSON.stringify(await dehydrateOfflineState(state)).replace(/<\/script>/gi, '<\\/script>');
    const root = document.documentElement.cloneNode(true);
    const stateScript = root.querySelector('#zscope-offline-state');
    if (stateScript) {
      stateScript.textContent = json;
    }
    const html = '<!DOCTYPE html>\n' + root.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zscope-offline-dashboard.html';
    a.click();
    URL.revokeObjectURL(a.href);
    markValidationStateSaved();
  });

  if (defaultViewBtn) {
    defaultViewBtn.addEventListener('click', () => activateReportView('default'));
  }
  if (needsReviewViewBtn) {
    needsReviewViewBtn.addEventListener('click', () => activateReportView('with_needs_review'));
  }

  markValidationStateSaved();
  updateViewButtons();
  renderList();
  if (state.findings.length > 0) {
    select(filteredIndexes[0] ?? 0);
  }
})();
</script>
</body>
</html>
