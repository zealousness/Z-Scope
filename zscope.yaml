# Z-SCOPE Global Configuration

llm:
  provider: openai
  base_url: https://api.siliconflow.cn/v1
  models:
    - Qwen/Qwen3-Coder-480B-A35B-Instruct
    - Qwen/Qwen3-Coder-30B-A3B-Instruct
  api_key: REDACTED_REVOKED_CREDENTIAL
  temperature: 0.1
  max_tokens: 4096

project:
  root: .
  entry_function: main
  agents:
    - name: semantic_modeler
      enabled: true
    - name: vulnerability_analyzer
      task: "查找逻辑漏洞、内存安全问题和并发风险。"
      enabled: true

indexing:
  backend: libclang

analysis:
  max_recursion_depth: 3
  max_function_lines: 500
  max_tool_iterations: 50
  snapshot_dir: .zscope_snapshots
  enable_snapshot_cache: true
