name: Bind P6 Python to the immutable control-plane checkout
description: Install hash-locked Python 3.13 dependencies and bind the explicit trusted checkout without build drift.

inputs:
  checkout-path:
    description: Workspace-relative immutable control-plane checkout path
    required: true

runs:
  using: composite
  steps:
    - id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Bind the self-hosted toolcache shared library root
      shell: bash
      run: |
        set -euo pipefail
        fail_binding() {
          echo '::error::stage=entry_input; class=input_binding_failure:1; count=1'
          exit 2
        }
        python_executable="$(realpath -e '${{ steps.setup-python.outputs.python-path }}' 2>/dev/null)" || fail_binding
        python_root="$(realpath -e "$(dirname "$(dirname "$python_executable")")" 2>/dev/null)" || fail_binding
        runner_tool_cache="$(realpath -e "$RUNNER_TOOL_CACHE" 2>/dev/null)" || fail_binding
        [[ "$python_root" == "$runner_tool_cache"/* ]] || fail_binding
        python_library="$python_root/lib"
        test -f "$python_library/libpython3.13.so.1.0" || fail_binding
        [[ "${LD_LIBRARY_PATH:-}" != *$'\n'* ]] || fail_binding
        test -f "$GITHUB_ENV" && [[ ! -L "$GITHUB_ENV" ]] || fail_binding
        bound_library_path="$python_library${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        printf 'LD_LIBRARY_PATH=%s\n' "$bound_library_path" >> "$GITHUB_ENV" || fail_binding
        export LD_LIBRARY_PATH="$bound_library_path"
        "$python_executable" --version >/dev/null 2>&1 || fail_binding
    - name: Install hash-locked dependencies and bind the current checkout
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.checkout-path }}
      run: |
        set -euo pipefail
        fail_binding() {
          echo '::error::stage=entry_input; class=input_binding_failure:1; count=1'
          exit 2
        }
        python_executable="$(realpath -e '${{ steps.setup-python.outputs.python-path }}' 2>/dev/null)" || fail_binding
        if ! "$python_executable" -m pip install --disable-pip-version-check --require-hashes \
          -r requirements/constraints/py313.txt >/dev/null 2>&1; then
          fail_binding
        fi
        checkout_root="$(realpath -e "$GITHUB_WORKSPACE/${{ inputs.checkout-path }}" 2>/dev/null)" || fail_binding
        workspace_root="$(realpath -e "$GITHUB_WORKSPACE" 2>/dev/null)" || fail_binding
        if [[ "$checkout_root" != "$workspace_root"/* ]] || ! \
          P6_SETUP_CHECKOUT_ROOT="$checkout_root" PYTHONPATH="$checkout_root" \
          "$python_executable" - <<'PY' >/dev/null 2>&1
        import os
        from pathlib import Path
        import zscope

        expected = Path(os.environ["P6_SETUP_CHECKOUT_ROOT"]).resolve() / "zscope/__init__.py"
        actual = Path(zscope.__file__ or "").resolve()
        if actual != expected or not actual.is_file():
            raise SystemExit(2)
        PY
        then
          fail_binding
        fi
