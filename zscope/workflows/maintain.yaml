name: maintain
mode: maintain
description: Incremental maintenance scan that reuses unchanged function reports.
steps:
  - id: discover_entries
    scope: session
    handler: discover_entries
    action: classify API, communication, thread, and other user-input entries when requested
  - id: compare_entry_state
    scope: entry
    handler: compare_entry_state
    action: compare code and semantic hashes in snapshot.db
  - id: reuse_unchanged_report
    scope: entry
    handler: reuse_unchanged_report
    stop_policy: stop_if_handler_returns_true
    action: return historical reports for unchanged entries with zero LLM cost
  - id: reconcile_history
    scope: entry
    handler: reconcile_history
    agent: history_maintenance_agent
    action: verify whether historical issues still exist after source changes
  - id: run_changed_entry
    scope: entry
    handler: run_changed_entry
    stop_policy: stop_if_handler_returns_true
    agent: hypothesis_hunter
    action: run the default Candidate Ledger workflow only for changed entries
