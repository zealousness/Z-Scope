name: Range v16 and Benchmark v5 Attestation

on:
  workflow_dispatch:
    inputs:
      governance_commit:
        description: Merged E0 governance commit
        required: true
      scorer_commit:
        description: Merged Benchmark v5 scorer commit
        required: true
      truth_commit:
        description: Merged Truth v16 commit
        required: true
      review_run_id:
        description: Successful protected Range v16 review workflow run ID
        required: true
      review_source_sha:
        description: Frozen commit used to generate the protected review run
        required: true

permissions:
  contents: read
  actions: read

jobs:
  attest:
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        id: setup_python
        with:
          python-version: "3.13"
      - name: Initialize isolated attestation Python
        env:
          E0_SETUP_PYTHON: ${{ steps.setup_python.outputs.python-path }}
        run: |
          if ! "$E0_SETUP_PYTHON" -c \
            'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 13) else 1)' \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=selected_python_identity_mismatch; count=1"
            exit 1
          fi
          if ! E0_VENV_ROOT="$(mktemp -d "$RUNNER_TEMP/e0-attestation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX" 2>/dev/null)"; then
            echo "::error title=E0 attestation validation::validation_failure=venv_workspace_failure; count=1"
            exit 1
          fi
          E0_PYTHON="$E0_VENV_ROOT/venv/bin/python"
          if ! "$E0_SETUP_PYTHON" -m venv "$E0_VENV_ROOT/venv" \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=venv_creation_failure; count=1"
            exit 1
          fi
          if ! "$E0_PYTHON" -c \
            'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 13) else 1)' \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=venv_python_identity_mismatch; count=1"
            exit 1
          fi
          if ! printf 'E0_PYTHON=%s\n' "$E0_PYTHON" >> "$GITHUB_ENV"; then
            echo "::error title=E0 attestation validation::validation_failure=venv_binding_failure; count=1"
            exit 1
          fi
      - name: Verify component ancestry and protected review lineage
        id: review_lineage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          E0_REPOSITORY: ${{ github.repository }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
          TRUTH_COMMIT: ${{ inputs.truth_commit }}
          GOVERNANCE_COMMIT: ${{ inputs.governance_commit }}
          SCORER_COMMIT: ${{ inputs.scorer_commit }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          "$E0_PYTHON" scripts/verify_e0_attestation_preflight.py \
            --repository "$E0_REPOSITORY" \
            --workflow-run-id "$REVIEW_RUN_ID" \
            --review-source-sha "$REVIEW_SOURCE_SHA" \
            --truth-commit "$TRUTH_COMMIT" \
            --governance-commit "$GOVERNANCE_COMMIT" \
            --scorer-commit "$SCORER_COMMIT" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --workflow-head-branch "$WORKFLOW_HEAD_BRANCH" \
            --workspace "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Checkout frozen Truth v16 commit
        env:
          TRUTH_COMMIT: ${{ inputs.truth_commit }}
        run: |
          if ! git -c advice.detachedHead=false checkout --detach --quiet \
            "$TRUTH_COMMIT" >/dev/null 2>&1; then
            echo "::error title=E0 attestation preflight::preflight_failure=truth_checkout_failed; count=1"
            exit 1
          fi
          if [ "$(git rev-parse HEAD 2>/dev/null)" != "$TRUTH_COMMIT" ]; then
            echo "::error title=E0 attestation preflight::preflight_failure=truth_checkout_mismatch; count=1"
            exit 1
          fi
      - name: Restore exact protected review artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          E0_REPOSITORY: ${{ github.repository }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
          REVIEW_ARTIFACT_ID: ${{ steps.review_lineage.outputs.review_artifact_id }}
          REVIEW_ARTIFACT_DIGEST: ${{ steps.review_lineage.outputs.review_artifact_digest }}
          PROVENANCE_ARTIFACT_ID: ${{ steps.review_lineage.outputs.review_provenance_artifact_id }}
          PROVENANCE_ARTIFACT_DIGEST: ${{ steps.review_lineage.outputs.review_provenance_artifact_digest }}
          PAIR_ARTIFACT_ID: ${{ steps.review_lineage.outputs.pair_author_artifact_id }}
          PAIR_ARTIFACT_DIGEST: ${{ steps.review_lineage.outputs.pair_author_artifact_digest }}
        run: |
          if ! "$E0_PYTHON" scripts/download_e0_run_artifacts.py \
            --repository "$E0_REPOSITORY" \
            --expected-run-id "$REVIEW_RUN_ID" \
            --expected-head-sha "$REVIEW_SOURCE_SHA" \
            --expected-workflow-path ".github/workflows/range-v16-review.yml" \
            --expected-event "workflow_dispatch" \
            --expected-head-branch "main" \
            --expected-producer-job "codex arbitration finalize and safe-pair author" \
            --exact-artifact "range-v16-reviewed-${REVIEW_SOURCE_SHA}=protected-review-evidence=${REVIEW_ARTIFACT_ID}=${REVIEW_ARTIFACT_DIGEST}" \
            --exact-artifact "range-v16-review-provenance-${REVIEW_SOURCE_SHA}=protected-review-provenance=${PROVENANCE_ARTIFACT_ID}=${PROVENANCE_ARTIFACT_DIGEST}" \
            --exact-artifact "range-v16-pair-author-${REVIEW_SOURCE_SHA}=protected-pair-author=${PAIR_ARTIFACT_ID}=${PAIR_ARTIFACT_DIGEST}" \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation artifact restore::preflight_failure=artifact_restore_failed; count=1"
            exit 1
          fi
      - name: Install locked attestation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          if ! "$E0_PYTHON" -m pip install --only-binary=:all: --require-hashes \
            -r requirements/constraints/py313.txt >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=locked_dependency_install_failure; count=1"
            exit 1
          fi
          if ! "$E0_PYTHON" -m pip check >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=dependency_integrity_failure; count=1"
            exit 1
          fi
      - name: Verify protected review provenance
        env:
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
          REVIEW_WORKFLOW_HEAD_SHA: ${{ steps.review_lineage.outputs.review_workflow_head_sha }}
          REVIEW_ARTIFACT_DIGEST: ${{ steps.review_lineage.outputs.review_artifact_digest }}
        run: |
          if ! "$E0_PYTHON" scripts/verify_e0_review_provenance.py \
            --provenance protected-review-provenance/review-provenance.json \
            --workflow-run-id "$REVIEW_RUN_ID" \
            --workflow-head-sha "$REVIEW_WORKFLOW_HEAD_SHA" \
            --packet-source-sha "$REVIEW_SOURCE_SHA" \
            --artifact-digest "$REVIEW_ARTIFACT_DIGEST" \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=review_provenance_failure; count=1"
            exit 1
          fi
      - name: Reconstruct normalized review decisions
        run: |
          if ! mkdir -p reconstructed-review >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=review_workspace_failure; count=1"
            exit 1
          fi
          if ! "$E0_PYTHON" scripts/generate_range_v16_truth.py normalize \
            --packet-dir test/range/benchmark/v16/review-packets \
            --packet-catalog test/range/benchmark/v16/review-packet-catalog.json \
            --review-root protected-review-evidence \
            --review-bundle-manifest protected-review-evidence/review-bundle-manifest.json \
            --review-provenance protected-review-provenance/review-provenance.json \
            --output reconstructed-review/normalized-decisions.json \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=review_normalization_failure; count=1"
            exit 1
          fi
      - name: Compare normalized review decisions
        run: |
          if ! cmp reconstructed-review/normalized-decisions.json \
            test/range/benchmark/v16/reviews/normalized-decisions.json \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=normalized_review_mismatch; count=1"
            exit 1
          fi
          if ! cmp protected-pair-author/normalized-decisions.json \
            test/range/benchmark/v16/reviews/normalized-decisions.json \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=pair_author_decision_mismatch; count=1"
            exit 1
          fi
      - name: Materialize and compile protected safe pairs
        run: |
          if ! "$E0_PYTHON" scripts/generate_range_v16_safe_pairs.py materialize \
            --packet-dir test/range/benchmark/v16/review-packets \
            --normalized-decisions test/range/benchmark/v16/reviews/normalized-decisions.json \
            --author-dir protected-pair-author/author \
            --output-dir reconstructed-pairs \
            --compiler cc \
            --compile \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=pair_materialization_failure; count=1"
            exit 1
          fi
      - name: Compare reconstructed safe-pair tree
        run: |
          if ! diff --recursive --brief --no-dereference reconstructed-pairs \
            test/range/benchmark/v16/pairs >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=pair_tree_mismatch; count=1"
            exit 1
          fi
      - name: Rebuild Truth v16
        run: |
          if ! mkdir -p reconstructed-truth >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=truth_workspace_failure; count=1"
            exit 1
          fi
          if ! "$E0_PYTHON" scripts/generate_range_v16_truth.py build \
            --truth-v15 test/range/benchmark/ground_truth.json \
            --normalized-decisions reconstructed-review/normalized-decisions.json \
            --pair-root reconstructed-pairs \
            --fixture-root test/range \
            --taxonomy zscope/benchmarking/defect-taxonomy.v1.json \
            --output reconstructed-truth/ground_truth.json \
            --pair-index-output reconstructed-truth/safe-pair-manifest.json \
            --truth-manifest-output reconstructed-truth/truth-manifest.json \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=truth_rebuild_failure; count=1"
            exit 1
          fi
      - name: Compare reconstructed Truth v16
        run: |
          if ! cmp reconstructed-truth/ground_truth.json \
            test/range/benchmark/v16/ground_truth.json >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=ground_truth_mismatch; count=1"
            exit 1
          fi
          if ! cmp reconstructed-truth/safe-pair-manifest.json \
            test/range/benchmark/v16/safe-pair-manifest.json >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=safe_pair_manifest_mismatch; count=1"
            exit 1
          fi
          if ! cmp reconstructed-truth/truth-manifest.json \
            test/range/benchmark/v16/truth-manifest.json >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=truth_manifest_mismatch; count=1"
            exit 1
          fi
      - name: Validate frozen Truth v16
        run: |
          if ! "$E0_PYTHON" scripts/validate_range_v16_truth.py \
            --truth test/range/benchmark/v16/ground_truth.json \
            --pair-root test/range/benchmark/v16/pairs \
            --truth-manifest test/range/benchmark/v16/truth-manifest.json \
            --normalized-decisions test/range/benchmark/v16/reviews/normalized-decisions.json \
            --pair-index test/range/benchmark/v16/safe-pair-manifest.json \
            --taxonomy zscope/benchmarking/defect-taxonomy.v1.json \
            --fixture-root test/range \
            --compile-pairs \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=truth_validation_failure; count=1"
            exit 1
          fi
      - name: Run focused attestation tests
        run: |
          if ! "$E0_PYTHON" -m pytest -q tests/test_truth_contract_v2.py \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=truth_contract_test_failure; count=1"
            exit 1
          fi
          if ! "$E0_PYTHON" -m pytest -q tests/test_benchmark_v5.py \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=benchmark_v5_test_failure; count=1"
            exit 1
          fi
          if ! "$E0_PYTHON" -m pytest -q tests/test_benchmark_leakage.py \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=benchmark_leakage_test_failure; count=1"
            exit 1
          fi
          if ! "$E0_PYTHON" -m pytest -q tests/test_zscope_2_change_scope.py \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation validation::validation_failure=change_scope_test_failure; count=1"
            exit 1
          fi
      - name: Build protected E0 attestation
        env:
          Z_SCOPE_ATTESTATION_ENVIRONMENT: sealed-benchmark
          GOVERNANCE_COMMIT: ${{ inputs.governance_commit }}
          SCORER_COMMIT: ${{ inputs.scorer_commit }}
          TRUTH_COMMIT: ${{ inputs.truth_commit }}
          PAIR_AUTHOR_ARTIFACT_DIGEST: ${{ steps.review_lineage.outputs.pair_author_artifact_digest }}
        run: |
          if ! mkdir -p release-evidence >/dev/null 2>&1; then
            echo "::error title=E0 attestation issuance::attestation_failure=release_workspace_failure; count=1"
            exit 1
          fi
          if ! OPUS_REVIEW_COUNT="$("$E0_PYTHON" -c 'import json; print(json.load(open("protected-review-evidence/opus/manifest.json"))["reviewed_count"])' 2>/dev/null)"; then
            echo "::error title=E0 attestation issuance::attestation_failure=review_count_read_failure; count=1"
            exit 1
          fi
          case "$OPUS_REVIEW_COUNT" in
            ""|*[!0-9]*)
              echo "::error title=E0 attestation issuance::attestation_failure=review_count_invalid; count=1"
              exit 1
              ;;
          esac
          if ! "$E0_PYTHON" scripts/build_e0_attestation.py \
            --governance-commit "$GOVERNANCE_COMMIT" \
            --scorer-commit "$SCORER_COMMIT" \
            --truth-commit "$TRUTH_COMMIT" \
            --truth test/range/benchmark/v16/ground_truth.json \
            --truth-manifest test/range/benchmark/v16/truth-manifest.json \
            --source-truth-v15 test/range/benchmark/ground_truth.json \
            --review-packet-catalog test/range/benchmark/v16/review-packet-catalog.json \
            --normalized-decisions test/range/benchmark/v16/reviews/normalized-decisions.json \
            --safe-pair-author-manifest protected-pair-author/author/manifest.json \
            --safe-pair-author-artifact-digest "$PAIR_AUTHOR_ARTIFACT_DIGEST" \
            --review-bundle protected-review-evidence/review-bundle-manifest.json \
            --review-provenance protected-review-provenance/review-provenance.json \
            --safe-pair-manifest test/range/benchmark/v16/safe-pair-manifest.json \
            --defect-taxonomy zscope/benchmarking/defect-taxonomy.v1.json \
            --benchmark-policy zscope/benchmarking/benchmark_policy.v2.json \
            --scorer-bundle-file zscope/benchmarking/benchmark_v5.py \
            --scorer-bundle-file zscope/benchmarking/protocol.py \
            --scorer-bundle-file zscope/benchmarking/truth_contract.py \
            --opus-review-count "$OPUS_REVIEW_COUNT" \
            --output release-evidence/e0-attestation.json \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation issuance::attestation_failure=attestation_build_failure; count=1"
            exit 1
          fi
      - name: Verify protected E0 attestation
        run: |
          if ! "$E0_PYTHON" scripts/verify_e0_attestation.py \
            --attestation release-evidence/e0-attestation.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            >/dev/null 2>&1; then
            echo "::error title=E0 attestation issuance::attestation_failure=attestation_self_verification_failure; count=1"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: e0-range-v16-benchmark-v5-${{ inputs.truth_commit }}
          path: release-evidence/e0-attestation.json
          if-no-files-found: error
          retention-days: 90
