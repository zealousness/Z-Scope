# Z-SCOPE benchmark config for test/range.
# Fill the LLM placeholders before running the full scan.
# ${bailian_url}="https://dashscope.aliyuncs.com/compatible-mode/v1"
# ${zhipu_url}="https://open.bigmodel.cn/api/paas/v4"

llms:
  default:
    provider: openai
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    models:
      - "glm-5"
    api_key: ${Z_SCOPE_API_KEY}
    temperature: 0.1
    max_tokens: 8192
    max_retries: 2
    timeout: 120

  smart_model:
    provider: openai
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    models:
      - "glm-5"
    api_key: ${Z_SCOPE_API_KEY}
    temperature: 0.1
    max_tokens: 8192
    max_retries: 2
    timeout: 120

project:
  root: test/range
  source_root: .
  entry_functions_list: benchmark/entries.json

  prompt_autofill:
    enabled: false
    overwrite_existing: false
    write_back: false
    min_custom_prompt_chars: 20

  entry_discovery:
    enabled: false
    max_candidates: 100
    max_functions: 1000
    header_files:
      - include/task_dispatcher.h

  compile_commands_path: build/compile_commands.json

  include_paths:
    - include
    - internal
    - src
  exclude_paths:
    - build
    - .zscope_knowledge
    - .zscope_snapshots
    - benchmark/ground_truth.json
    - benchmark/ISSUE40_REAL_MODEL_MAPPING.md
    - benchmark/ISSUE41_CS_MODEL_MAPPING.md
    - benchmark/ISSUE42_RUNTIME_MODEL_MAPPING.md
    - GROUND_TRUTH.md

  agents:
    - name: semantic_modeler
      enabled: true
      llm_ref: default

    - name: vulnerability_analyzer
      enabled: true
      llm_ref: smart_model
      can_spawn_subagents: true
      task: >
        Audit this C service-runtime benchmark for memory corruption,
        integer/bounds mistakes, ownership/lifetime bugs, command/file security
        flaws, and concurrency defects. Use source evidence and call paths.
        Do not rely on benchmark answer-key files.

    - name: validator_agent
      enabled: true
      llm_ref: smart_model

    - name: issue_reconciler_agent
      enabled: true
      llm_ref: default

indexing:
  backend: unified
  joern_path: joern
  joern_server_host: 127.0.0.1
  joern_server_port: 8080
  joern_heap_size: 4g
  clangd_path: clangd
  knowledge_db_path: .zscope_knowledge/code_knowledge.db
  batch_size: 50
  max_clangd_threads: 8
  gclang_path: gclang
  get_bc_path: get-bc
  llvm_link_path: llvm-link
  svf_bin_dir: "/home/jager/.local/svf/SVF-SVF-3.2/build/bin"
  svf_heap_limit_mb: 8192
  svf_timeout: 600

analysis:
  max_recursion_depth: 3
  max_function_lines: 500
  max_tool_iterations: 50
  snapshot_dir: test/range/.zscope_snapshots
  enable_snapshot_cache: true
  user_config_db: ""
  parallel_workers: 12
  enable_global_model: true
  max_premodel_depth: 5
  max_premodel_callees: 20
  trivial_function_max_lines: 10
  enable_subagent_workers: true
  max_subagent_tickets: 8
