# Z-SCOPE Java 配置 v2。复制为目标项目的 zscope.yaml 后修改。
# 本文件是精简参考，仅列出常用字段；全部可配置字段、默认值与约束
# 见 README.md 的“配置字段参考”一节。所有字符串值支持 ${VAR} 环境变量展开。
config_version: 2

llms:
  # LLM profile 表：default 必需；可再定义命名 profile（如 wiki_compiler），
  # 并在 scan.llm_profiles 中把 Agent 角色指到不同 profile。
  default:
    base_urls: ["${Z_SCOPE_LLM_BASE_URL}"] # OpenAI 兼容 endpoint；多个时最闲优先分流，故障端点自动冷却
    models: ["${Z_SCOPE_LLM_MODEL}"] # 候选模型，按序回退
    api_key: "${Z_SCOPE_API_KEY}" # 环境变量缺失时加载即报错
    max_tokens: 8192 # 单次响应长度上限；不是 scan-wide token 预算。
    base_url_max_concurrent_requests: 4 # 单个 endpoint 并发在途请求上限，与 concurrency.llm_max_inflight 共同生效

project:
  language: java # 只能是 c_cpp 或 java
  root: . # 项目根目录；相对路径按加载进程的工作目录解析
  source_root: . # 源码根；entry_discovery.search_root、include_paths 相对它解析
  include_paths: [] # 源码扫描根（相对 source_root），留空扫描整个 source_root
  exclude_paths: [target, build, .gradle] # 命中的路径不参与扫描
  # 也可改用 entry_function 或 entry_functions_list；自动发现时请明确目标模块和 API 源文件。
  entry_discovery:
    enabled: true # 自动发现入口；显式 entry_functions_list 优先于发现结果
    search_root: . # 待扫模块根，必须位于 source_root 之内
    interface_files: ["src/main/java/**/*.java"] # 相对 search_root 的 POSIX glob，声明公共 API 的源文件
    max_entries: 200 # 最多选出的入口数，其余候选标记 deferred

scan:
  depth: fast # Java Preview 尚未开放 balanced/deep；显式请求会失败。
  task: "" # 空串启用当前语言全部适用 Skill；非空文本仅指定审计重点。
  llm_profiles: {modeling: default, analysis: default, validation: default} # 三类 Agent 角色到 llms profile 的映射

indexing:
  backend: java_unified # java_unified=结构前端+全部信号 provider；java_source=仅结构；joern=仅 Joern
  java:
    structure_frontend: auto # auto|spoon|javaparser|builtin；auto 按可用性依次尝试
    signals: [joern] # 图/数据流信号 provider：joern|sootup|wala|codeql；java_unified 要求全部可用

concurrency:
  entry_workers: 4 # 并行分析的入口数，每个入口一套建模+分析会话
  validator_workers: 2 # Validator 并发验证线程数
  investigator_workers: 1 # deep_worker 子代理调查并发（默认由 RuntimeSpec 关闭）
  evidence_completion_workers: 2 # 确定性事实补全 worker 数（不调用 LLM）
  index_workers: 4 # 索引阶段并行度
  wiki_compiler_workers: 4 # Wiki 编译并行度，仅 project.wiki 启用时使用
  llm_max_inflight: 4 # 进程级 LLM 并发上限，与 profile 的 endpoint 限流共同生效
