name: P6 Non-Release Cold Pilot Validation

on:
  workflow_dispatch:
    inputs:
      control_plane_commit:
        description: Exact protected main commit containing the immutable P6 control plane
        required: true
      candidate_sha:
        description: Exact main commit to validate as the non-release P6 candidate
        required: true

concurrency:
  group: p6-pilot-validation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash
    working-directory: control

env:
  P6_MAX_CONCURRENT_CALLS: "8"
  Z_SCOPE_BENCHMARK_OCI_RUNTIME: podman
  P6_ATTEMPT_ID: p6-${{ github.run_id }}-${{ github.run_attempt }}
  P6_CONTROL_PLANE_COMMIT: ${{ inputs.control_plane_commit }}
  P6_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
  P6_CONTROL_ROOT: ${{ github.workspace }}/control
  P6_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
  PYTHONPATH: ${{ github.workspace }}/control

jobs:
  entry:
    name: P6 entry and provider identity
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 15
    steps:
      - name: Validate immutable dispatcher identities before checkout
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$P6_CONTROL_PLANE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$P6_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$P6_CONTROL_PLANE_COMMIT" = "$GITHUB_SHA"
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Remove exact-label stale P6 scanners before any secret is loaded
        run: |
          set -euo pipefail
          if ! python3 scripts/p6_oci_cleanup.py \
            --runtime "$Z_SCOPE_BENCHMARK_OCI_RUNTIME" \
            --mode stale --repository "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=oci_isolation_violation:1; count=1'
            exit 2
          fi
      - name: Verify protected entry and immutable non-release request
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$P6_CONTROL_PLANE_COMMIT"
          test "$P6_CANDIDATE_COMMIT" = "$P6_CONTROL_PLANE_COMMIT"
          test "$(git rev-parse HEAD)" = "$P6_CONTROL_PLANE_COMMIT"
          test "$(git -C "$P6_CANDIDATE_ROOT" rev-parse HEAD)" = "$P6_CANDIDATE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git -C "$P6_CANDIDATE_ROOT" rev-parse 'HEAD^{tree}')"
          git merge-base --is-ancestor "$P6_CANDIDATE_COMMIT" origin/main
          for protected_path in \
            .github/actions/setup-p6-python \
            .github/actions/classify-p6-job-failure \
            .github/actions/validate-p6-artifact \
            .github/workflows/p6-pilot-validation.yml \
            .github/workflows/p6-pilot-finalize-recovery.yml \
            scripts/download_p6_run_artifact.py \
            scripts/p6_pilot_protocol.py \
            scripts/project_p6_entry_lineage.py \
            scripts/run_p6_cold_producer.py \
            scripts/run_p6_policy_replay.py \
            scripts/validate_p6_artifact_tree.py \
            docs/design/zscope-2.0-security-architecture/acceptance/p6-entry-gate.json \
            test/range/zscope.benchmark.yaml \
            test/range/benchmark/v16/review-packets \
            test/range/benchmark/v16/review-packet-catalog.json \
            test/range/benchmark/v16/reviews/normalized-decisions.json \
            test/range/benchmark/v16/ground_truth.json \
            test/range/benchmark/v16/truth-manifest.json \
            scripts/score_range_v5.py \
            zscope/benchmarking/p6_protocol.py \
            zscope/benchmarking/p6_review.py \
            zscope/benchmarking/provider_runtime.py \
            zscope/benchmarking/runner.py \
            zscope/benchmarking/isolation.py \
            zscope/cli/benchmark.py; do
            control_object="$(git rev-parse "${P6_CONTROL_PLANE_COMMIT}:${protected_path}")"
            candidate_object="$(git rev-parse "${P6_CANDIDATE_COMMIT}:${protected_path}")"
            test "$control_object" = "$candidate_object"
          done
          test "$P6_MAX_CONCURRENT_CALLS" = 8
          python3 scripts/check_zscope_2_design_evidence.py
          python3 - <<'PY'
          import yaml
          from zscope.benchmarking.p6_protocol import require_pilot_request
          from zscope.benchmarking.provider_runtime import ProviderRuntimeContract
          require_pilot_request(language="c_cpp", mode="pilot", runs=1)
          contract = ProviderRuntimeContract.from_config_file(
              __import__("pathlib").Path("test/range/zscope.benchmark.yaml")
          )
          assert contract.base_url == "https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1"
          assert contract.model == "deepseek-v4-flash"
          assert contract.response_model == "deepseek-v4-flash-ga-260731"
          assert contract.required_environment_keys == ("Z_SCOPE_API_KEY",)
          config = yaml.safe_load(__import__("pathlib").Path("test/range/zscope.benchmark.yaml").read_text(encoding="utf-8"))
          assert config["llms"]["default"]["base_url_max_concurrent_requests"] == 8
          assert config["concurrency"]["llm_max_inflight"] == 8
          PY
      - name: Verify runner-owned secret and frozen-input authority before any model call
        id: authority
        env:
          P6_ENTRY_FAILURE_MARKER: ${{ runner.temp }}/p6-entry-failure-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          validate_authority() {
          set -euo pipefail
          for required_name in \
            Z_SCOPE_P6_API_KEY_FILE \
            Z_SCOPE_P6_FROZEN_TRACE_ROOT \
            Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256 \
            Z_SCOPE_P6_CANARY_SOURCE_ROOT \
            Z_SCOPE_P6_CANARY_SOURCE_TREE_SHA256 \
            Z_SCOPE_P6_CANARY_COMPILE_COMMANDS \
            Z_SCOPE_P6_CANARY_COMPILE_COMMANDS_SHA256 \
            Z_SCOPE_P6_QUALIFICATION_HARNESS \
            Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256 \
            Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE \
            Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE_SHA256 \
            Z_SCOPE_P6_SAFE_PAIR_BUNDLE \
            Z_SCOPE_P6_SAFE_PAIR_BUNDLE_SHA256; do
            test -n "${!required_name:-}" || return 2
          done
          test -n "${Z_SCOPE_P6_API_KEY_FILE:-}"
          case "$Z_SCOPE_P6_API_KEY_FILE" in /*) ;; *) exit 2 ;; esac
          test -f "$Z_SCOPE_P6_API_KEY_FILE"
          test ! -L "$Z_SCOPE_P6_API_KEY_FILE"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zscope.benchmarking.provider_runtime import load_explicit_api_key_file
          assert set(load_explicit_api_key_file(Path(os.environ["Z_SCOPE_P6_API_KEY_FILE"]))) == {
              "Z_SCOPE_API_KEY"
          }
          PY
          for value in \
            "$Z_SCOPE_P6_FROZEN_TRACE_ROOT" \
            "$Z_SCOPE_P6_CANARY_SOURCE_ROOT" \
            "$Z_SCOPE_P6_CANARY_COMPILE_COMMANDS" \
            "$Z_SCOPE_P6_QUALIFICATION_HARNESS" \
            "$Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE" \
            "$Z_SCOPE_P6_SAFE_PAIR_BUNDLE"; do
            case "$value" in /*) ;; *) exit 2 ;; esac
            test ! -L "$value"
          done
          test -d "$Z_SCOPE_P6_FROZEN_TRACE_ROOT"
          test -d "$Z_SCOPE_P6_CANARY_SOURCE_ROOT"
          test -f "$Z_SCOPE_P6_CANARY_COMPILE_COMMANDS"
          test -f "$Z_SCOPE_P6_QUALIFICATION_HARNESS"
          test -x "$Z_SCOPE_P6_QUALIFICATION_HARNESS"
          test -f "$Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE"
          test -f "$Z_SCOPE_P6_SAFE_PAIR_BUNDLE"
          test "$(sha256sum "$Z_SCOPE_P6_FROZEN_TRACE_ROOT/decision_trace_manifest.json" | awk '{print $1}')" = "$Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256"
          test "$(sha256sum "$Z_SCOPE_P6_CANARY_COMPILE_COMMANDS" | awk '{print $1}')" = "$Z_SCOPE_P6_CANARY_COMPILE_COMMANDS_SHA256"
          test "$(sha256sum "$Z_SCOPE_P6_QUALIFICATION_HARNESS" | awk '{print $1}')" = "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"
          test "$(sha256sum "$Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE" | awk '{print $1}')" = "$Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE_SHA256"
          test "$(sha256sum "$Z_SCOPE_P6_SAFE_PAIR_BUNDLE" | awk '{print $1}')" = "$Z_SCOPE_P6_SAFE_PAIR_BUNDLE_SHA256"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["Z_SCOPE_P6_CANARY_SOURCE_ROOT"])
          digest = hashlib.sha256()
          for path in sorted(root.rglob("*"), key=lambda item: item.relative_to(root).as_posix()):
              if path.is_symlink() or not path.is_file():
                  if path.is_symlink():
                      raise SystemExit(2)
                  continue
              relative = path.relative_to(root).as_posix().encode("utf-8")
              payload = path.read_bytes()
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(payload).to_bytes(8, "big"))
              digest.update(payload)
          if digest.hexdigest() != os.environ["Z_SCOPE_P6_CANARY_SOURCE_TREE_SHA256"]:
              raise SystemExit(2)
          PY
          }
          if ! validate_authority >/dev/null 2>&1; then
            python3 - <<'PY' >/dev/null 2>&1
          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          marker = Path(os.environ["P6_ENTRY_FAILURE_MARKER"])
          if marker.parent.resolve(strict=True) != runner_temp or marker.name != (
              f"p6-entry-failure-{os.environ['GITHUB_RUN_ID']}-"
              f"{os.environ['GITHUB_RUN_ATTEMPT']}.json"
          ):
              raise SystemExit(2)
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(marker, flags, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8", newline="\n") as handle:
              json.dump(
                  {"failure_class": "input_binding_failure", "failure_count": 1},
                  handle,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              handle.write("\n")
          PY
            echo '::error::stage=entry_input; class=input_binding_failure:1; count=1'
            exit 2
          fi
      - name: Seal answer-free entry evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from scripts.project_p6_entry_lineage import project_gate_lineage
          from zscope.benchmarking.p6_protocol import canonical_sha256, load_json_strict, sha256_file
          from zscope.benchmarking.provider_runtime import ProviderRuntimeContract

          candidate = os.environ["P6_CANDIDATE_COMMIT"]
          contract = ProviderRuntimeContract.from_config_file(
              Path("test/range/zscope.benchmark.yaml")
          )
          gate_path = Path(
              "docs/design/zscope-2.0-security-architecture/acceptance/p6-entry-gate.json"
          )
          gate = load_json_strict(gate_path)
          if not isinstance(gate, dict):
              raise SystemExit(2)
          e0_lineage = project_gate_lineage(
              gate, gate_file_sha256=sha256_file(gate_path)
          )
          payload = {
              "schema_version": "zscope.p6-entry-evidence.v1",
              "workflow_path": ".github/workflows/p6-pilot-validation.yml",
              "control_plane_commit": os.environ["P6_CONTROL_PLANE_COMMIT"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "attempt_id": os.environ["P6_ATTEMPT_ID"],
              "candidate_git_sha": candidate,
              "candidate_git_tree": subprocess.run(
                  ["git", "rev-parse", "HEAD^{tree}"],
                  cwd=os.environ["P6_CANDIDATE_ROOT"],
                  check=True,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              ).stdout.strip(),
              "candidate_sha256": hashlib.sha256(candidate.encode("utf-8")).hexdigest(),
              "provider_contract_sha256": contract.identity_sha256,
              "p6_entry_gate_file_sha256": e0_lineage["entry_gate_file_sha256"],
              "p6_entry_gate_content_sha256": e0_lineage["entry_gate_content_sha256"],
              "e0_lineage": e0_lineage,
              "trace_manifest_sha256": os.environ["Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256"],
              "canary_tree_sha256": os.environ["Z_SCOPE_P6_CANARY_SOURCE_TREE_SHA256"],
              "compile_commands_sha256": os.environ["Z_SCOPE_P6_CANARY_COMPILE_COMMANDS_SHA256"],
              "qualification_harness_sha256": os.environ["Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"],
              "hidden_bundle_sha256": os.environ["Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE_SHA256"],
              "safe_pair_bundle_sha256": os.environ["Z_SCOPE_P6_SAFE_PAIR_BUNDLE_SHA256"],
              "formal_evidence": False,
              "release_eligible": False,
          }
          payload["evidence_sha256"] = canonical_sha256(payload)
          Path("entry-evidence.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python3 scripts/p6_pilot_protocol.py validate-answer-free \
            --input entry-evidence.json >/dev/null
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: entry-evidence.json
          stage: entry_input
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-entry-evidence-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/entry-evidence.json
      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: entry
          default-class: internal_failure
          marker: ${{ runner.temp }}/p6-entry-failure-${{ github.run_id }}-${{ github.run_attempt }}.json

  provider_probe:
    name: source-free deepseek-v4-flash provider probe
    needs: entry
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.probe.outputs.failure_class }}
      failure_count: ${{ steps.probe.outputs.failure_count }}
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 15
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Execute one constant source-free request
        id: probe
        run: |
          set -euo pipefail
          if ! python3 - <<'PY' >/dev/null 2>&1
          import json
          import os
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import load_json_strict, validate_provider_probe
          from zscope.benchmarking.provider_runtime import (
              ProviderProbeError,
              require_p6_provider_contract,
              run_p6_provider_probe,
          )
          allowed = {
              "provider_credentials_unavailable",
              "provider_identity_mismatch",
              "provider_identity_override_attempt",
              "provider_transport_exhausted",
              "provider_protocol_incompatible",
              "provider_usage_unverifiable",
          }
          try:
              value = run_p6_provider_probe(Path("test/range/zscope.benchmark.yaml"))
          except ProviderProbeError as exc:
              failure_class = exc.failure_class if exc.failure_class in allowed else "internal_failure"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"failure_class={failure_class}\n")
                  handle.write("failure_count=1\n")
              raise SystemExit(2)
          validate_provider_probe(value)
          contract = require_p6_provider_contract(Path("test/range/zscope.benchmark.yaml"))
          assert value["provider_identity_sha256"] == contract.identity_sha256
          assert value["config_sha256"] == contract.config_sha256
          assert value["model"] == contract.model == "deepseek-v4-flash"
          assert contract.response_model == "deepseek-v4-flash-ga-260731"
          Path("provider-probe.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          restored = load_json_strict(Path("provider-probe.json"))
          assert restored == value
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("failure_class=\n")
              handle.write("failure_count=0\n")
          PY
          then
            failure_class="$(sed -n 's/^failure_class=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            case "$failure_class" in
              provider_credentials_unavailable|provider_identity_mismatch|provider_identity_override_attempt|provider_transport_exhausted|provider_protocol_incompatible|provider_usage_unverifiable) ;;
              *) failure_class=internal_failure ;;
            esac
            echo "::error::stage=provider; class=${failure_class}:1; count=1"
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: provider-probe.json
          stage: provider
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-provider-probe-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/provider-probe.json

  toolchain_oci:
    name: toolchain OCI and cold-cache preflight
    needs: provider_probe
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 30
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Verify complete Linux toolchain and rootless digest-pinned OCI
        run: |
          set -euo pipefail
          for tool in cmake gcc clang clangd gclang get-bc llvm-link llvm-nm wpa saber cc; do
            command -v "$tool" >/dev/null
          done
          ! ldd "$(command -v wpa)" | grep -q 'not found'
          ! ldd "$(command -v saber)" | grep -q 'not found'
          synthetic_root="$(mktemp -d)"
          trap 'rm -rf -- "$synthetic_root"' EXIT
          printf '%s\n' 'int main(void) { return 0; }' > "$synthetic_root/probe.c"
          if ! cc -std=c11 -Werror -Wall -Wextra -c "$synthetic_root/probe.c" \
            -o "$synthetic_root/probe.o" >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=toolchain_preflight_failed:1; count=1'
            exit 2
          fi
          if ! python3 - <<'PY' >/dev/null 2>&1
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          from zscope.benchmarking.isolation import (
              RootlessOciExecutor,
              validate_oci_execution_evidence,
          )
          from zscope.benchmarking.p6_protocol import canonical_sha256
          from zscope.benchmarking.provider_runtime import (
              ProviderRuntimeContract,
              load_explicit_api_key_file,
          )
          from zscope.benchmarking.runner import prepare_p6_runtime_source

          runtime = os.environ.get("Z_SCOPE_BENCHMARK_OCI_RUNTIME", "")
          image = os.environ.get("Z_SCOPE_BENCHMARK_OCI_IMAGE", "")
          if image.count("@sha256:") != 1:
              raise SystemExit(2)
          contract = ProviderRuntimeContract.from_config_file(
              Path("test/range/zscope.benchmark.yaml")
          )
          key_environment = load_explicit_api_key_file(
              Path(os.environ["Z_SCOPE_P6_API_KEY_FILE"])
          )
          policy_environment = dict(key_environment)
          for name in (
              "Z_SCOPE_BENCHMARK_OCI_NETWORK",
              "Z_SCOPE_BENCHMARK_OCI_MODEL_PROXY_CONTAINER",
          ):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(2)
              policy_environment[name] = value
          with tempfile.TemporaryDirectory(prefix="zscope-p6-oci-") as raw:
              root = Path(raw)
              scan_input, artifact_output, cache_output = (
                  root / "input", root / "output", root / "cache"
              )
              runtime_source = root / "runtime-source" / "zscope"
              for target in (scan_input, artifact_output, cache_output):
                  target.mkdir(parents=True)
              runtime_source_sha256 = prepare_p6_runtime_source(
                  runtime_source, git_revision=os.environ["P6_CANDIDATE_COMMIT"]
              )
              executor = RootlessOciExecutor(
                  runtime=runtime,
                  image=image,
                  scan_input=scan_input,
                  artifact_output=artifact_output,
                  cache_output=cache_output,
                  runtime_source=runtime_source,
                  environment=policy_environment,
                  provider_contract=contract,
              )
              executor.preflight()
              executor.execute_phase(
                  "preflight",
                  (
                      "python3",
                      "-c",
                      "import sys;sys.path.insert(0,'/zscope-runtime');import zscope;"
                      "assert str(zscope.__file__).startswith('/zscope-runtime/zscope/');"
                      "assert zscope.__file__ is not None",
                  ),
                  log_path=root / "discarded-preflight.log",
                  accepted_returncodes=(0,),
                  provider_credentials=False,
              )
              phase_log = load_json_strict(root / "discarded-preflight.log")
              if phase_log != {
                  "schema_version": "zscope.oci-phase-log.v1",
                  "phase": "preflight",
                  "outcome": "completed",
                  "return_code": 0,
                  "return_code_accepted": True,
                  "stdout_persisted": False,
                  "stderr_persisted": False,
              }:
                  raise SystemExit(2)
              execution = executor.execution_evidence(required_phases=("preflight",))
              if validate_oci_execution_evidence(execution):
                  raise SystemExit(2)
              if (
                  execution.get("runtime_source_mounted") is not True
                  or execution.get("runtime_source_sha256") != runtime_source_sha256
              ):
                  raise SystemExit(2)
              candidate = os.environ["P6_CANDIDATE_COMMIT"]
              candidate_tree = subprocess.run(
                  ["git", "rev-parse", "HEAD^{tree}"],
                  cwd=os.environ["P6_CANDIDATE_ROOT"],
                  check=True,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              ).stdout.strip()
              draft = {
                  "schema_version": "zscope.p6-toolchain-oci-evidence.v1",
                  "workflow_path": ".github/workflows/p6-pilot-validation.yml",
                  "control_plane_commit": os.environ["P6_CONTROL_PLANE_COMMIT"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "attempt_id": os.environ["P6_ATTEMPT_ID"],
                  "candidate_sha256": hashlib.sha256(candidate.encode("utf-8")).hexdigest(),
                  "candidate_git_sha": candidate,
                  "candidate_git_tree": candidate_tree,
                  "image_ref": image,
                  "image_digest": image.rsplit("@", 1)[1],
                  "image_id": execution["image_id"],
                  "runtime_source_sha256": runtime_source_sha256,
                  "oci_execution_sha256": canonical_sha256(execution),
                  "rootless_verified": execution["rootless_verified"] is True,
                  "image_digest_verified": execution["image_digest_verified"] is True,
                  "mounts_verified": execution["mounts_verified"] is True,
                  "network_restriction_verified": execution["network_restriction_verified"] is True,
                  "runtime_source_mounted": execution["runtime_source_mounted"] is True,
                  "formal_evidence": False,
                  "release_eligible": False,
              }
              Path("toolchain-draft.json").write_text(
                  json.dumps(draft, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
          PY
          then
            echo '::error::stage=toolchain_oci_cache; class=oci_capability_failed:1; count=1'
            exit 2
          fi
          if ! python3 scripts/p6_pilot_protocol.py seal-toolchain-evidence \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --candidate-tree "$(git -C "$P6_CANDIDATE_ROOT" rev-parse 'HEAD^{tree}')" \
            --draft toolchain-draft.json --output toolchain-evidence.json >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=oci_isolation_violation:1; count=1'
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: toolchain-evidence.json
          stage: toolchain_oci_cache
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-toolchain-oci-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/toolchain-evidence.json
      - name: Remove exact current-attempt P6 scanners
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ! python3 scripts/p6_oci_cleanup.py \
            --runtime "$Z_SCOPE_BENCHMARK_OCI_RUNTIME" --mode current \
            --repository "$GITHUB_REPOSITORY" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=oci_isolation_violation:1; count=1'
            exit 2
          fi

      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: toolchain_oci_preflight
          default-class: oci_capability_failed

  policy_replay:
    name: P6 frozen policy replay
    needs: toolchain_oci
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Fail closed unless the frozen replay input is exact
        run: |
          set -euo pipefail
          case "$Z_SCOPE_P6_FROZEN_TRACE_ROOT" in /*) ;; *) exit 2 ;; esac
          test -d "$Z_SCOPE_P6_FROZEN_TRACE_ROOT"
          test ! -L "$Z_SCOPE_P6_FROZEN_TRACE_ROOT"
          test "$(sha256sum "$Z_SCOPE_P6_FROZEN_TRACE_ROOT/decision_trace_manifest.json" | awk '{print $1}')" = "$Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256"
      - name: Replay the frozen policy with zero model calls
        run: |
          set -euo pipefail
          if ! python3 -m pytest -q \
            tests/test_p1_frozen_replay.py \
            tests/test_candidate_outcome_replay.py \
            tests/test_validator_replay.py >/dev/null 2>&1; then
            echo '::error::stage=proof_provider_checker; class=replay_nondeterministic:1; count=1'
            exit 2
          fi
          if ! env -u Z_SCOPE_API_KEY -u Z_SCOPE_P6_API_KEY_FILE \
            -u ANTHROPIC_API_KEY -u DEEPSEEK_API_KEY -u OPENAI_API_KEY \
            python3 scripts/run_p6_policy_replay.py \
              --trace-root "$Z_SCOPE_P6_FROZEN_TRACE_ROOT" \
              --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
              --candidate-commit "$P6_CANDIDATE_COMMIT" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output policy-replay.json >/dev/null 2>&1; then
            echo '::error::stage=proof_provider_checker; class=replay_nondeterministic:1; count=1'
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: policy-replay.json
          stage: policy_replay
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-policy-replay-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/policy-replay.json
      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: policy_replay
          default-class: replay_nondeterministic

  certificate_reverify:
    name: P6 certificate reverify
    needs: policy_replay
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore the exact policy-replay producer
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_ID: ${{ needs.policy_replay.outputs.artifact_id }}
          POLICY_DIGEST: ${{ needs.policy_replay.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$POLICY_ID" =~ ^[0-9]+$ ]]
          [[ "$POLICY_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'P6 frozen policy replay' --artifact-id "$POLICY_ID" \
            --artifact-name "p6-policy-replay-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$POLICY_DIGEST" --required-member policy-replay.json \
            --output-dir restored/policy
      - name: Reverify frozen certificates with zero model calls
        run: |
          set -euo pipefail
          test "$(sha256sum "$Z_SCOPE_P6_FROZEN_TRACE_ROOT/decision_trace_manifest.json" | awk '{print $1}')" = "$Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256"
          if ! python3 -m pytest -q tests/test_proof_kernel.py tests/test_p2_proof_lifecycle.py >/dev/null 2>&1; then
            echo '::error::stage=proof_provider_checker; class=certificate_reverify_failure:1; count=1'
            exit 2
          fi
          if ! python3 scripts/reverify_v3_trace.py --trace-root "$Z_SCOPE_P6_FROZEN_TRACE_ROOT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output v3-reverify.json >/dev/null 2>&1; then
            echo '::error::stage=proof_provider_checker; class=certificate_reverify_failure:1; count=1'
            exit 2
          fi
          readarray -t manifest_hashes < <(python3 - <<'PY'
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import load_json_strict
          value = load_json_strict(Path("restored/policy/policy-replay.json"))
          print(value["trace_manifest_sha256"])
          print(value["trace_manifest_file_sha256"])
          PY
          )
          test "${manifest_hashes[1]}" = "$Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256"
          if ! python3 scripts/p6_pilot_protocol.py seal-offline-stage \
            --stage reverify --suite-file scripts/reverify_v3_trace.py \
            --suite-file v3-reverify.json --receipt v3-reverify.json \
            --receipt-sha256 "$(sha256sum v3-reverify.json | awk '{print $1}')" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --trace-manifest-sha256 "${manifest_hashes[0]}" \
            --trace-manifest-file-sha256 "${manifest_hashes[1]}" \
            --output offline-reverify.json >/dev/null 2>&1; then
            echo '::error::stage=artifact_seal; class=artifact_integrity_failure:1; count=1'
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: offline-reverify.json
          stage: certificate_reverify
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-certificate-reverify-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/offline-reverify.json
      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: certificate_reverify
          default-class: certificate_reverify_failure

  anonymous_qualification:
    name: P6 anonymous qualification
    needs: [certificate_reverify, toolchain_oci]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore exact toolchain evidence for the qualification receipt
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN_ID: ${{ needs.toolchain_oci.outputs.artifact_id }}
          TOOLCHAIN_DIGEST: ${{ needs.toolchain_oci.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$TOOLCHAIN_ID" =~ ^[0-9]+$ ]]
          [[ "$TOOLCHAIN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'toolchain OCI and cold-cache preflight' --artifact-id "$TOOLCHAIN_ID" \
            --artifact-name "p6-toolchain-oci-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$TOOLCHAIN_DIGEST" --required-member toolchain-evidence.json \
            --output-dir restored/toolchain
      - name: Execute frozen hidden-holdout harness against the current candidate
        run: |
          set -euo pipefail
          QUALIFICATION_HARNESS="$Z_SCOPE_P6_QUALIFICATION_HARNESS"
          HIDDEN_BUNDLE="$Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE"
          HIDDEN_BUNDLE_SHA="$Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE_SHA256"
          if ! python3 -m pytest -q \
            tests/test_p2_proof_corpus.py \
            tests/test_p3_security_spec_qualification.py \
            tests/test_p4_hypothesis_qualification.py \
            tests/test_p5_runtime_authority.py >/dev/null 2>&1; then
            echo '::error::stage=candidates; class=anonymous_qualification_failed:1; count=1'
            exit 2
          fi
          test "$(sha256sum "$QUALIFICATION_HARNESS" | awk '{print $1}')" = "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"
          if ! python3 - "$QUALIFICATION_HARNESS" "$HIDDEN_BUNDLE" "$HIDDEN_BUNDLE_SHA" <<'PY' >/dev/null 2>&1
          import os, subprocess, sys
          from pathlib import Path
          from zscope.benchmarking.provider_runtime import load_explicit_api_key_file
          allowed = {
              "PATH", "LANG", "LC_ALL", "SSL_CERT_FILE", "SSL_CERT_DIR",
              "LD_LIBRARY_PATH", "P6_CANDIDATE_COMMIT", "P6_ATTEMPT_ID",
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
              "P6_MAX_CONCURRENT_CALLS",
              "Z_SCOPE_BENCHMARK_OCI_RUNTIME", "Z_SCOPE_BENCHMARK_OCI_IMAGE",
              "Z_SCOPE_BENCHMARK_OCI_NETWORK",
              "Z_SCOPE_BENCHMARK_OCI_MODEL_PROXY_CONTAINER",
          }
          child = {name: value for name, value in os.environ.items() if name in allowed}
          key_file = os.environ["Z_SCOPE_P6_API_KEY_FILE"]
          child.update(load_explicit_api_key_file(Path(key_file)))
          command = [
              sys.argv[1], "hidden-holdout", "--candidate", child["P6_CANDIDATE_COMMIT"],
              "--workflow-run-id", child["GITHUB_RUN_ID"],
              "--workflow-run-attempt", child["GITHUB_RUN_ATTEMPT"],
              "--attempt-id", os.environ["P6_ATTEMPT_ID"],
              "--control-plane-commit", os.environ["P6_CONTROL_PLANE_COMMIT"],
              "--harness-sha256", os.environ["Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"],
              "--workers", child["P6_MAX_CONCURRENT_CALLS"],
              "--provider-model", "deepseek-v4-flash", "--input", sys.argv[2],
              "--input-sha256", sys.argv[3], "--output", "hidden-holdout-receipt.json",
          ]
          completed = subprocess.run(
              command, env=child, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              check=False,
          )
          raise SystemExit(completed.returncode)
          PY
          then
            echo '::error::stage=candidates; class=anonymous_qualification_failed:1; count=1'
            exit 2
          fi
          if ! python3 scripts/p6_pilot_protocol.py seal-offline-stage \
            --stage hidden_holdout --suite-file hidden-holdout-receipt.json \
            --receipt hidden-holdout-receipt.json \
            --receipt-sha256 "$(sha256sum hidden-holdout-receipt.json | awk '{print $1}')" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --harness-sha256 "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256" \
            --qualification-input-sha256 "$Z_SCOPE_P6_HIDDEN_HOLDOUT_BUNDLE_SHA256" \
            --toolchain-evidence restored/toolchain/toolchain-evidence.json \
            --toolchain-evidence-sha256 "$(sha256sum restored/toolchain/toolchain-evidence.json | awk '{print $1}')" \
            --output offline-hidden-holdout.json >/dev/null 2>&1; then
            echo '::error::stage=usage_trace; class=accounting_conservation_failure:1; count=1'
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: offline-hidden-holdout.json
          stage: candidates
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-anonymous-qualification-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/offline-hidden-holdout.json
      - name: Remove exact current-attempt P6 scanners
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ! python3 scripts/p6_oci_cleanup.py \
            --runtime "$Z_SCOPE_BENCHMARK_OCI_RUNTIME" --mode current \
            --repository "$GITHUB_REPOSITORY" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=oci_isolation_violation:1; count=1'
            exit 2
          fi

      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: anonymous_qualification
          default-class: anonymous_qualification_failed

  safe_pair_validation:
    name: P6 safe-pair validation
    needs: [anonymous_qualification, toolchain_oci]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore exact toolchain evidence for the qualification receipt
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN_ID: ${{ needs.toolchain_oci.outputs.artifact_id }}
          TOOLCHAIN_DIGEST: ${{ needs.toolchain_oci.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$TOOLCHAIN_ID" =~ ^[0-9]+$ ]]
          [[ "$TOOLCHAIN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'toolchain OCI and cold-cache preflight' --artifact-id "$TOOLCHAIN_ID" \
            --artifact-name "p6-toolchain-oci-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$TOOLCHAIN_DIGEST" --required-member toolchain-evidence.json \
            --output-dir restored/toolchain
      - name: Execute frozen safe-pair dual-scan harness against the current candidate
        run: |
          set -euo pipefail
          QUALIFICATION_HARNESS="$Z_SCOPE_P6_QUALIFICATION_HARNESS"
          SAFE_BUNDLE="$Z_SCOPE_P6_SAFE_PAIR_BUNDLE"
          SAFE_BUNDLE_SHA="$Z_SCOPE_P6_SAFE_PAIR_BUNDLE_SHA256"
          if ! python3 -m pytest -q \
            tests/test_range_v16_safe_pairs.py \
            tests/test_fact_action_canary.py \
            tests/test_validator_evidence_slice.py >/dev/null 2>&1; then
            echo '::error::stage=terminal_authority; class=safe_pair_false_confirmation:1; count=1'
            exit 2
          fi
          test "$(sha256sum "$QUALIFICATION_HARNESS" | awk '{print $1}')" = "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"
          if ! python3 - "$QUALIFICATION_HARNESS" "$SAFE_BUNDLE" "$SAFE_BUNDLE_SHA" <<'PY' >/dev/null 2>&1
          import os, subprocess, sys
          from pathlib import Path
          from zscope.benchmarking.provider_runtime import load_explicit_api_key_file
          allowed = {
              "PATH", "LANG", "LC_ALL", "SSL_CERT_FILE", "SSL_CERT_DIR",
              "LD_LIBRARY_PATH", "P6_CANDIDATE_COMMIT", "P6_ATTEMPT_ID",
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
              "P6_MAX_CONCURRENT_CALLS",
              "Z_SCOPE_BENCHMARK_OCI_RUNTIME", "Z_SCOPE_BENCHMARK_OCI_IMAGE",
              "Z_SCOPE_BENCHMARK_OCI_NETWORK",
              "Z_SCOPE_BENCHMARK_OCI_MODEL_PROXY_CONTAINER",
          }
          child = {name: value for name, value in os.environ.items() if name in allowed}
          key_file = os.environ["Z_SCOPE_P6_API_KEY_FILE"]
          child.update(load_explicit_api_key_file(Path(key_file)))
          command = [
              sys.argv[1], "safe-pair-dual-scan", "--candidate", child["P6_CANDIDATE_COMMIT"],
              "--workflow-run-id", child["GITHUB_RUN_ID"],
              "--workflow-run-attempt", child["GITHUB_RUN_ATTEMPT"],
              "--attempt-id", os.environ["P6_ATTEMPT_ID"],
              "--control-plane-commit", os.environ["P6_CONTROL_PLANE_COMMIT"],
              "--harness-sha256", os.environ["Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"],
              "--workers", child["P6_MAX_CONCURRENT_CALLS"],
              "--provider-model", "deepseek-v4-flash", "--input", sys.argv[2],
              "--input-sha256", sys.argv[3], "--output", "safe-pair-receipt.json",
          ]
          completed = subprocess.run(
              command, env=child, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              check=False,
          )
          raise SystemExit(completed.returncode)
          PY
          then
            echo '::error::stage=terminal_authority; class=safe_pair_false_confirmation:1; count=1'
            exit 2
          fi
          if ! python3 scripts/p6_pilot_protocol.py seal-offline-stage \
            --stage safe_pair --suite-file safe-pair-receipt.json \
            --receipt safe-pair-receipt.json \
            --receipt-sha256 "$(sha256sum safe-pair-receipt.json | awk '{print $1}')" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --harness-sha256 "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256" \
            --qualification-input-sha256 "$Z_SCOPE_P6_SAFE_PAIR_BUNDLE_SHA256" \
            --toolchain-evidence restored/toolchain/toolchain-evidence.json \
            --toolchain-evidence-sha256 "$(sha256sum restored/toolchain/toolchain-evidence.json | awk '{print $1}')" \
            --output offline-safe-pair.json >/dev/null 2>&1; then
            echo '::error::stage=usage_trace; class=accounting_conservation_failure:1; count=1'
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: offline-safe-pair.json
          stage: terminal_authority
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-safe-pair-validation-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/offline-safe-pair.json
      - name: Remove exact current-attempt P6 scanners
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ! python3 scripts/p6_oci_cleanup.py \
            --runtime "$Z_SCOPE_BENCHMARK_OCI_RUNTIME" --mode current \
            --repository "$GITHUB_REPOSITORY" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=oci_isolation_violation:1; count=1'
            exit 2
          fi

      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: safe_pair_validation
          default-class: safe_pair_false_confirmation

  evidence_action_canary:
    name: P6 EvidenceAction canary
    needs: [safe_pair_validation, toolchain_oci]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore exact toolchain evidence for the qualification receipt
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN_ID: ${{ needs.toolchain_oci.outputs.artifact_id }}
          TOOLCHAIN_DIGEST: ${{ needs.toolchain_oci.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$TOOLCHAIN_ID" =~ ^[0-9]+$ ]]
          [[ "$TOOLCHAIN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'toolchain OCI and cold-cache preflight' --artifact-id "$TOOLCHAIN_ID" \
            --artifact-name "p6-toolchain-oci-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$TOOLCHAIN_DIGEST" --required-member toolchain-evidence.json \
            --output-dir restored/toolchain
      - name: Prepare answer-free EvidenceAction input and invoke the sealed candidate harness
        run: |
          set -euo pipefail
          TRACE_ROOT="$Z_SCOPE_P6_FROZEN_TRACE_ROOT"
          CANARY_SOURCE="$Z_SCOPE_P6_CANARY_SOURCE_ROOT"
          COMPILE_COMMANDS="$Z_SCOPE_P6_CANARY_COMPILE_COMMANDS"
          if ! python3 - <<'PY' >/dev/null 2>&1
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["Z_SCOPE_P6_CANARY_SOURCE_ROOT"])
          snapshot = Path("sealed-canary-source")
          if snapshot.exists() or snapshot.is_symlink():
              raise SystemExit(2)
          snapshot.mkdir(mode=0o700)
          digest = hashlib.sha256()
          for path in sorted(root.rglob("*"), key=lambda item: item.relative_to(root).as_posix()):
              if path.is_symlink():
                  raise SystemExit(2)
              if not path.is_file():
                  continue
              relative_path = path.relative_to(root)
              relative = relative_path.as_posix().encode("utf-8")
              payload = path.read_bytes()
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(payload).to_bytes(8, "big"))
              digest.update(payload)
              target = snapshot / relative_path
              target.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
              target.write_bytes(payload)
          if digest.hexdigest() != os.environ["Z_SCOPE_P6_CANARY_SOURCE_TREE_SHA256"]:
              raise SystemExit(2)
          PY
          then
            echo '::error::stage=entry_input; class=input_binding_failure:1; count=1'
            exit 2
          fi
          CANARY_SOURCE="$PWD/sealed-canary-source"
          if ! python3 scripts/prepare_v3_action_canary.py --trace-root "$TRACE_ROOT" \
            --source-root "$CANARY_SOURCE" --compile-commands "$COMPILE_COMMANDS" \
            --output v3-canary-preflight.json >/dev/null 2>&1; then
            echo '::error::stage=entry_input; class=input_binding_failure:1; count=1'
            exit 2
          fi
          preflight_sha="$(python3 -c 'from pathlib import Path; from zscope.benchmarking.p6_protocol import load_json_strict; print(load_json_strict(Path("v3-canary-preflight.json"))["artifact_sha256"])')"
          test "$(sha256sum "$Z_SCOPE_P6_QUALIFICATION_HARNESS" | awk '{print $1}')" = "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"
          if ! python3 - "$preflight_sha" "$TRACE_ROOT" "$CANARY_SOURCE" "$COMPILE_COMMANDS" <<'PY' >/dev/null 2>&1
          import os, subprocess, sys
          from pathlib import Path
          from zscope.benchmarking.provider_runtime import load_explicit_api_key_file
          allowed = {
              "PATH", "LANG", "LC_ALL", "SSL_CERT_FILE", "SSL_CERT_DIR",
              "LD_LIBRARY_PATH", "P6_CANDIDATE_COMMIT", "P6_ATTEMPT_ID",
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
              "P6_MAX_CONCURRENT_CALLS",
              "Z_SCOPE_BENCHMARK_OCI_RUNTIME", "Z_SCOPE_BENCHMARK_OCI_IMAGE",
              "Z_SCOPE_BENCHMARK_OCI_NETWORK",
              "Z_SCOPE_BENCHMARK_OCI_MODEL_PROXY_CONTAINER",
          }
          env = {name: value for name, value in os.environ.items() if name in allowed}
          key_file = os.environ["Z_SCOPE_P6_API_KEY_FILE"]
          env.update(load_explicit_api_key_file(Path(key_file)))
          command = [
              os.environ["Z_SCOPE_P6_QUALIFICATION_HARNESS"],
              "evidence-action-canary",
              "--candidate", env["P6_CANDIDATE_COMMIT"],
              "--workflow-run-id", env["GITHUB_RUN_ID"],
              "--workflow-run-attempt", env["GITHUB_RUN_ATTEMPT"],
              "--attempt-id", os.environ["P6_ATTEMPT_ID"],
              "--control-plane-commit", os.environ["P6_CONTROL_PLANE_COMMIT"],
              "--harness-sha256", os.environ["Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256"],
              "--workers", env["P6_MAX_CONCURRENT_CALLS"],
              "--provider-model", "deepseek-v4-flash",
              "--preflight", "v3-canary-preflight.json",
              "--expected-preflight-sha256", sys.argv[1],
              "--trace-root", sys.argv[2], "--source-root", sys.argv[3],
              "--compile-commands", sys.argv[4],
              "--trace-manifest-sha256", os.environ["Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256"],
              "--source-tree-sha256", os.environ["Z_SCOPE_P6_CANARY_SOURCE_TREE_SHA256"],
              "--compile-commands-sha256", os.environ["Z_SCOPE_P6_CANARY_COMPILE_COMMANDS_SHA256"],
              "--output", "v3-model-canary.json",
          ]
          raise SystemExit(
              subprocess.run(
                  command, env=env, stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL, check=False,
              ).returncode
          )
          PY
          then
            echo '::error::stage=evidence_action; class=evidence_action_not_consumed:1; count=1'
            exit 2
          fi
          if ! python3 scripts/p6_pilot_protocol.py seal-offline-stage \
            --stage canary --suite-file v3-model-canary.json \
            --receipt v3-model-canary.json \
            --receipt-sha256 "$(sha256sum v3-model-canary.json | awk '{print $1}')" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --harness-sha256 "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256" \
            --qualification-input-sha256 "$preflight_sha" \
            --toolchain-evidence restored/toolchain/toolchain-evidence.json \
            --toolchain-evidence-sha256 "$(sha256sum restored/toolchain/toolchain-evidence.json | awk '{print $1}')" \
            --output offline-canary.json >/dev/null 2>&1; then
            echo '::error::stage=usage_trace; class=accounting_conservation_failure:1; count=1'
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: offline-canary.json
          stage: evidence_action
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-evidence-action-canary-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/offline-canary.json
      - name: Remove exact current-attempt P6 scanners
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ! python3 scripts/p6_oci_cleanup.py \
            --runtime "$Z_SCOPE_BENCHMARK_OCI_RUNTIME" --mode current \
            --repository "$GITHUB_REPOSITORY" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=oci_isolation_violation:1; count=1'
            exit 2
          fi

      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: evidence_action_canary
          default-class: evidence_action_not_consumed

  offline_qualification:
    name: seal P6 offline evidence
    needs: [toolchain_oci, policy_replay, certificate_reverify, anonymous_qualification, safe_pair_validation, evidence_action_canary]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore exact per-stage offline artifacts
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_ID: ${{ needs.policy_replay.outputs.artifact_id }}
          POLICY_DIGEST: ${{ needs.policy_replay.outputs.artifact_digest }}
          TOOLCHAIN_ID: ${{ needs.toolchain_oci.outputs.artifact_id }}
          TOOLCHAIN_DIGEST: ${{ needs.toolchain_oci.outputs.artifact_digest }}
          REVERIFY_ID: ${{ needs.certificate_reverify.outputs.artifact_id }}
          REVERIFY_DIGEST: ${{ needs.certificate_reverify.outputs.artifact_digest }}
          HIDDEN_ID: ${{ needs.anonymous_qualification.outputs.artifact_id }}
          HIDDEN_DIGEST: ${{ needs.anonymous_qualification.outputs.artifact_digest }}
          SAFE_ID: ${{ needs.safe_pair_validation.outputs.artifact_id }}
          SAFE_DIGEST: ${{ needs.safe_pair_validation.outputs.artifact_digest }}
          CANARY_ID: ${{ needs.evidence_action_canary.outputs.artifact_id }}
          CANARY_DIGEST: ${{ needs.evidence_action_canary.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          for value in "$POLICY_ID" "$TOOLCHAIN_ID" "$REVERIFY_ID" "$HIDDEN_ID" "$SAFE_ID" "$CANARY_ID"; do [[ "$value" =~ ^[0-9]+$ ]]; done
          for value in "$POLICY_DIGEST" "$TOOLCHAIN_DIGEST" "$REVERIFY_DIGEST" "$HIDDEN_DIGEST" "$SAFE_DIGEST" "$CANARY_DIGEST"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]]; done
          restore() {
            local job="$1" id="$2" name="$3" digest="$4" member="$5" target="$6"
            python3 scripts/download_p6_run_artifact.py \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
              --candidate-commit "$P6_CANDIDATE_COMMIT" \
              --producer-job "$job" --artifact-id "$id" --artifact-name "$name" \
              --artifact-digest "sha256:$digest" --required-member "$member" \
              --output-dir "$target"
          }
          restore 'P6 frozen policy replay' "$POLICY_ID" "p6-policy-replay-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$POLICY_DIGEST" policy-replay.json restored/policy
          restore 'toolchain OCI and cold-cache preflight' "$TOOLCHAIN_ID" "p6-toolchain-oci-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$TOOLCHAIN_DIGEST" toolchain-evidence.json restored/toolchain
          restore 'P6 certificate reverify' "$REVERIFY_ID" "p6-certificate-reverify-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$REVERIFY_DIGEST" offline-reverify.json restored/reverify
          restore 'P6 anonymous qualification' "$HIDDEN_ID" "p6-anonymous-qualification-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$HIDDEN_DIGEST" offline-hidden-holdout.json restored/hidden
          restore 'P6 safe-pair validation' "$SAFE_ID" "p6-safe-pair-validation-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$SAFE_DIGEST" offline-safe-pair.json restored/safe
          restore 'P6 EvidenceAction canary' "$CANARY_ID" "p6-evidence-action-canary-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$CANARY_DIGEST" offline-canary.json restored/canary
      - name: Seal answer-free offline evidence marker
        run: |
          set -euo pipefail
          candidate_sha="$(printf %s "$P6_CANDIDATE_COMMIT" | sha256sum | awk '{print $1}')"
          policy_sha="$(sha256sum zscope/benchmarking/benchmark_policy.v2.json | awk '{print $1}')"
          policy_replay_sha="$(sha256sum restored/policy/policy-replay.json | awk '{print $1}')"
          toolchain_sha="$(sha256sum restored/toolchain/toolchain-evidence.json | awk '{print $1}')"
          reverify_sha="$(sha256sum restored/reverify/offline-reverify.json | awk '{print $1}')"
          hidden_sha="$(sha256sum restored/hidden/offline-hidden-holdout.json | awk '{print $1}')"
          safe_sha="$(sha256sum restored/safe/offline-safe-pair.json | awk '{print $1}')"
          canary_sha="$(sha256sum restored/canary/offline-canary.json | awk '{print $1}')"
          if ! python3 scripts/p6_pilot_protocol.py seal-offline-evidence \
            --candidate-sha256 "$candidate_sha" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --policy-sha256 "$policy_sha" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --harness-sha256 "$Z_SCOPE_P6_QUALIFICATION_HARNESS_SHA256" \
            --toolchain-evidence restored/toolchain/toolchain-evidence.json --toolchain-evidence-sha256 "$toolchain_sha" \
            --trace-manifest-file-sha256 "$Z_SCOPE_P6_FROZEN_TRACE_MANIFEST_SHA256" \
            --policy-replay-artifact restored/policy/policy-replay.json --policy-replay-sha256 "$policy_replay_sha" \
            --reverify-artifact restored/reverify/offline-reverify.json --reverify-sha256 "$reverify_sha" \
            --hidden-holdout-artifact restored/hidden/offline-hidden-holdout.json --hidden-holdout-sha256 "$hidden_sha" \
            --safe-pair-artifact restored/safe/offline-safe-pair.json --safe-pair-sha256 "$safe_sha" \
            --canary-artifact restored/canary/offline-canary.json --canary-sha256 "$canary_sha" \
            --output offline-evidence.json >/dev/null 2>&1; then
            echo '::error::stage=artifact_seal; class=artifact_integrity_failure:1; count=1'
            exit 2
          fi
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: offline-evidence.json
          stage: usage_trace
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-offline-evidence-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/offline-evidence.json
      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: cold_fast
          default-class: internal_failure

  cold_fast:
    name: one isolated cold fast pilot
    needs: [offline_qualification, toolchain_oci]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 720
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore exact same-run toolchain evidence
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN_ID: ${{ needs.toolchain_oci.outputs.artifact_id }}
          TOOLCHAIN_DIGEST: ${{ needs.toolchain_oci.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$TOOLCHAIN_ID" =~ ^[0-9]+$ ]]
          [[ "$TOOLCHAIN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'toolchain OCI and cold-cache preflight' --artifact-id "$TOOLCHAIN_ID" \
            --artifact-name "p6-toolchain-oci-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$TOOLCHAIN_DIGEST" --required-member toolchain-evidence.json \
            --output-dir restored/toolchain
      - name: Execute fast from a new empty cache root
        run: |
          set -euo pipefail
          export Z_SCOPE_P6_CANDIDATE_COMMIT="$P6_CANDIDATE_COMMIT"
          export Z_SCOPE_BENCHMARK_WORK_ROOT="$RUNNER_TEMP/p6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fast"
          test ! -e "$Z_SCOPE_BENCHMARK_WORK_ROOT"
          mkdir -m 700 "$Z_SCOPE_BENCHMARK_WORK_ROOT"
          if ! python3 scripts/run_p6_cold_producer.py --scan-depth fast \
            --output p6-fast --failure-marker "$RUNNER_TEMP/p6-cold-fast-failure.json" \
            >/dev/null 2>&1; then
            exit 2
          fi
          toolchain_sha="$(sha256sum restored/toolchain/toolchain-evidence.json | awk '{print $1}')"
          if ! python3 scripts/p6_pilot_protocol.py project-depth \
            --aggregate p6-fast/aggregate.json --scan-depth fast \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --expected-git-sha "$P6_CANDIDATE_COMMIT" \
