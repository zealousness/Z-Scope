<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Z-SCOPE 离线审计页面</title>
<style>
:root {
  --bg: #0b1220;
  --panel: #111827;
  --panel-soft: #0f172a;
  --border: #1f2937;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --primary: #38bdf8;
  --success: #22c55e;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top, #111827 0%, #0b1220 55%); color: var(--text); }
header { padding: 12px 16px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
button { background: #0284c7; border: 0; border-radius: 8px; color: white; padding: 8px 12px; cursor: pointer; font-weight: 600; }
small { color: var(--muted); }
main { display: grid; grid-template-columns: 360px 1fr; gap: 12px; padding: 12px; min-height: calc(100vh - 58px); }
.panel { background: rgba(17, 24, 39, 0.95); border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow: auto; }
.hint { color: var(--muted); font-size: 12px; }
.issue { border: 1px solid #374151; border-radius: 10px; padding: 8px; margin-bottom: 8px; cursor: pointer; transition: all .15s ease; }
.issue:hover { border-color: #4b5563; }
.issue.active { border-color: var(--primary); background: #0b1220; }
.search-wrap { margin-bottom: 8px; }
.search { width: 100%; background: #0b1220; color: var(--text); border: 1px solid #374151; border-radius: 8px; padding: 8px; }
.grid-two { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
input, select, textarea { width: 100%; background: #0b1220; color: var(--text); border: 1px solid #374151; border-radius: 8px; padding: 8px; }
textarea { min-height: 100px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--panel-soft); border: 1px solid #374151; border-radius: 8px; padding: 10px; margin: 6px 0 0; font-size: 13px; }
.sec-title { margin: 6px 0 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
@media (max-width: 1200px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script id="zscope-offline-state" type="application/json">__ZCOPE_OFFLINE_STATE__</script>
<header>
  <button id="savePageBtn">保存当前离线页面</button>
  <small>离线模式支持筛选、查看详情并编辑 validation_status / validation_reasoning。</small>
</header>
<main>
  <section class="panel">
    <h3>审计发现</h3>
    <div class="search-wrap">
      <input id="filterInput" class="search" placeholder="模糊筛选：ID / 函数 / 位置 / 分类 / 描述" />
    </div>
    <div id="filterHint" class="hint">显示 0 / 0</div>
    <div id="issueList"></div>
  </section>
  <section class="panel">
    <h3 id="title">请选择问题</h3>
    <div class="grid-two">
      <div><label>函数</label><input id="fn" readonly></div>
      <div><label>位置</label><input id="loc" readonly></div>
    </div>
    <label>验证状态</label>
    <select id="status"><option value="validated">validated</option><option value="pending">pending</option><option value="rejected">rejected</option></select>
    <label>验证说明</label><textarea id="reason"></textarea>

    <div class="sec-title">漏洞描述</div><pre id="desc"></pre>
    <div class="sec-title">Code Snippet</div><pre id="snippet"></pre>
    <div class="sec-title">AI 推理链 (Reasoning)</div><pre id="reasoning"></pre>
    <div class="sec-title">修复建议</div><pre id="fix"></pre>
  </section>
</main>
<script>
(() => {
  function decodeBase64Utf8(base64Text) {
    const binary = atob(base64Text);
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function encodeBase64Utf8(plainText) {
    const bytes = new TextEncoder().encode(plainText);
    let binary = '';
    bytes.forEach(b => {
      binary += String.fromCharCode(b);
    });
    return btoa(binary);
  }

  function parseOfflineState(rawText) {
    const trimmed = String(rawText || '').trim();
    if (!trimmed) {
      return {};
    }
    if (trimmed.startsWith('base64:')) {
      const decoded = decodeBase64Utf8(trimmed.slice('base64:'.length));
      return JSON.parse(decoded);
    }
    return JSON.parse(trimmed);
  }

  const stateScript = document.getElementById('zscope-offline-state');
  const state = parseOfflineState(stateScript ? stateScript.textContent : '{}');
  state.findings = Array.isArray(state.findings) ? state.findings : [];
  let currentIndex = -1;
  let filteredIndexes = state.findings.map((_, i) => i);

  const listEl = document.getElementById('issueList');
  const filterInputEl = document.getElementById('filterInput');
  const filterHintEl = document.getElementById('filterHint');
  const fnEl = document.getElementById('fn');
  const locEl = document.getElementById('loc');
  const statusEl = document.getElementById('status');
  const reasonEl = document.getElementById('reason');
  const descEl = document.getElementById('desc');
  const snippetEl = document.getElementById('snippet');
  const reasoningEl = document.getElementById('reasoning');
  const fixEl = document.getElementById('fix');
  const titleEl = document.getElementById('title');

  function findingSearchText(f) {
    return [
      f.id, f.function, f.location, f.category, f.subcategory,
      f.description, f.code_snippet, f.reasoning, f.reasoning_process, f.suggested_fix,
      f.validation_status, f.validation_reasoning
    ].filter(Boolean).join(' | ');
  }

  function buildFilteredIndexes() {
    const query = filterInputEl.value.trim();
    if (!query) {
      filteredIndexes = state.findings.map((_, i) => i);
      return;
    }
    filteredIndexes = state.findings
      .map((f, i) => ({ i, score: fuzzyScore(findingSearchText(f), query) }))
      .filter(item => item.score > 0)
      .sort((a, b) => b.score - a.score)
      .map(item => item.i);
  }

  function renderList() {
    listEl.innerHTML = '';
    buildFilteredIndexes();
    filterHintEl.textContent = `显示 ${filteredIndexes.length} / ${state.findings.length}`;

    filteredIndexes.forEach((realIndex) => {
      const f = state.findings[realIndex];
      const div = document.createElement('div');
      div.className = 'issue' + (realIndex === currentIndex ? ' active' : '');
      div.innerHTML = '<b>' + (f.id || 'issue') + '</b><br><small>' + (f.function || 'unknown') + '</small><br><small>' + (f.location || '-') + '</small><br><small>' + (f.validation_status || 'pending') + '</small>';
      div.onclick = () => select(realIndex);
      listEl.appendChild(div);
    });

    if (!filteredIndexes.length) {
      const empty = document.createElement('div');
      empty.className = 'hint';
      empty.textContent = '未找到匹配项';
      listEl.appendChild(empty);
    }
  }

  function select(i) {
    currentIndex = i;
    const f = state.findings[i];
    if (!f) return;
    titleEl.textContent = (f.id || 'issue') + ' - ' + (f.subcategory || '');
    fnEl.value = f.function || '';
    locEl.value = f.location || '';
    statusEl.value = f.validation_status || 'pending';
    reasonEl.value = f.validation_reasoning || '';
    descEl.textContent = f.description || '';
    snippetEl.textContent = f.code_snippet || '暂无代码片段';
    reasoningEl.textContent = f.reasoning || f.reasoning_process || '暂无推理过程';
    fixEl.textContent = f.suggested_fix || '暂无修复建议';
    renderList();
  }

  statusEl.addEventListener('change', () => {
    if (currentIndex < 0) return;
    state.findings[currentIndex].validation_status = statusEl.value;
    renderList();
  });

  reasonEl.addEventListener('input', () => {
    if (currentIndex < 0) return;
    state.findings[currentIndex].validation_reasoning = reasonEl.value;
  });

  filterInputEl.addEventListener('input', () => {
    renderList();
    if (currentIndex >= 0 && !filteredIndexes.includes(currentIndex)) {
      if (filteredIndexes.length > 0) {
        select(filteredIndexes[0]);
      }
    }
  });

  document.getElementById('savePageBtn').addEventListener('click', () => {
    const json = JSON.stringify(state).replace(/<\/script>/gi, '<\\/script>');
    const root = document.documentElement.cloneNode(true);
    const stateScript = root.querySelector('#zscope-offline-state');
    if (stateScript) {
      stateScript.textContent = json;
    }
    const html = '<!DOCTYPE html>\n' + root.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zscope-offline-dashboard.html';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  renderList();
  if (state.findings.length > 0) {
    select(filteredIndexes[0] ?? 0);
  }
})();
</script>
</body>
</html>
