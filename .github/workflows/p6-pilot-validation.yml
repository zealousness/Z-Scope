          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'one isolated cold deep pilot' --artifact-id "$DEEP_ID" \
            --artifact-name "p6-cold-deep-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$DEEP_DIGEST" --required-member p6-deep-projection.json \
            --output-dir restored/deep
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'conservation and qualification seal' --artifact-id "$QUALIFICATION_ID" \
            --artifact-name "p6-qualification-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$QUALIFICATION_DIGEST" --required-member qualification.json \
            --output-dir restored/qualification
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'independent product architecture review' --artifact-id "$PRODUCT_ID" \
            --artifact-name "p6-review-product-architecture-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$PRODUCT_DIGEST" --required-member packet/packet.json \
            --required-member review/decision.json --required-member review/raw-envelope.json \
            --output-dir restored/reviews/product-architecture
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'independent proof security review' --artifact-id "$PROOF_ID" \
            --artifact-name "p6-review-proof-security-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$PROOF_DIGEST" --required-member packet/packet.json \
            --required-member review/decision.json --required-member review/raw-envelope.json \
            --output-dir restored/reviews/proof-security
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'independent benchmark review' --artifact-id "$BENCHMARK_ID" \
            --artifact-name "p6-review-independent-benchmark-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$BENCHMARK_DIGEST" --required-member packet/packet.json \
            --required-member review/decision.json --required-member review/raw-envelope.json \
            --output-dir restored/reviews/independent-benchmark
      - name: Strictly aggregate all three independent zero-blocker decisions
        run: |
          set -euo pipefail
          python3 scripts/p6_pilot_protocol.py aggregate-reviews \
            --product-architecture-packet restored/reviews/product-architecture/packet/packet.json \
            --product-architecture-output restored/reviews/product-architecture/review \
            --proof-security-packet restored/reviews/proof-security/packet/packet.json \
            --proof-security-output restored/reviews/proof-security/review \
            --independent-benchmark-packet restored/reviews/independent-benchmark/packet/packet.json \
            --independent-benchmark-output restored/reviews/independent-benchmark/review \
            --output p6-independent-reviews.json
      - name: Seal a complete same-attempt checkpoint before formal publication
        run: |
          set -euo pipefail
          candidate_sha="$(printf %s "$P6_CANDIDATE_COMMIT" | sha256sum | awk '{print $1}')"
          policy_sha="$(sha256sum zscope/benchmarking/benchmark_policy.v2.json | awk '{print $1}')"
          plan_sha="$(sha256sum .github/workflows/p6-pilot-validation.yml | awk '{print $1}')"
          mapfile -t evidence_lineage < <(python3 - <<'PY'
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import load_json_strict
          entry = load_json_strict(Path("restored/entry/entry-evidence.json"))
          probe = load_json_strict(Path("restored/provider/provider-probe.json"))
          toolchain = load_json_strict(Path("restored/toolchain/toolchain-evidence.json"))
          print(entry["evidence_sha256"])
          print(toolchain["runtime_source_sha256"])
          print(probe["provider_identity_sha256"])
          print(toolchain["oci_execution_sha256"])
          PY
          )
          test "${#evidence_lineage[@]}" = 4
          input_sha="${evidence_lineage[0]}"
          runtime_sha="${evidence_lineage[1]}"
          provider_sha="${evidence_lineage[2]}"
          oci_sha="${evidence_lineage[3]}"
          fast_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:fast" | sha256sum | awk '{print $1}')"
          balanced_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:balanced" | sha256sum | awk '{print $1}')"
          deep_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:deep" | sha256sum | awk '{print $1}')"
          lineage_args=(
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT"
            --attempt-id "$P6_ATTEMPT_ID" --candidate-sha256 "$candidate_sha"
            --policy-sha256 "$policy_sha" --plan-sha256 "$plan_sha" --input-sha256 "$input_sha"
            --runtime-sha256 "$runtime_sha" --provider-sha256 "$provider_sha" --oci-sha256 "$oci_sha"
            --fast-cache-sha256 "$fast_cache" --balanced-cache-sha256 "$balanced_cache"
            --deep-cache-sha256 "$deep_cache"
          )
          entry_payload="$(sha256sum restored/entry/entry-evidence.json | awk '{print $1}')"
          provider_payload="$(sha256sum restored/provider/provider-probe.json | awk '{print $1}')"
          toolchain_payload="$(sha256sum restored/toolchain/toolchain-evidence.json | awk '{print $1}')"
          policy_payload="$(sha256sum restored/policy/policy-replay.json | awk '{print $1}')"
          reverify_payload="$(sha256sum restored/reverify/offline-reverify.json | awk '{print $1}')"
          hidden_payload="$(sha256sum restored/hidden/offline-hidden-holdout.json | awk '{print $1}')"
          safe_payload="$(sha256sum restored/safe/offline-safe-pair.json | awk '{print $1}')"
          canary_payload="$(sha256sum restored/canary/offline-canary.json | awk '{print $1}')"
          fast_payload="$(sha256sum restored/fast/p6-fast-projection.json | awk '{print $1}')"
          balanced_payload="$(sha256sum restored/balanced/p6-balanced-projection.json | awk '{print $1}')"
          deep_payload="$(sha256sum restored/deep/p6-deep-projection.json | awk '{print $1}')"
          qualification_payload="$(sha256sum restored/qualification/qualification.json | awk '{print $1}')"
          product_payload="$(sha256sum restored/reviews/product-architecture/review/decision.json | awk '{print $1}')"
          proof_payload="$(sha256sum restored/reviews/proof-security/review/decision.json | awk '{print $1}')"
          benchmark_payload="$(sha256sum restored/reviews/independent-benchmark/review/decision.json | awk '{print $1}')"
          mkdir -p checkpoint-run/stage-artifacts checkpoint-run/payload/reviews/product-architecture checkpoint-run/payload/reviews/proof-security checkpoint-run/payload/reviews/independent-benchmark
          cp restored/entry/entry-evidence.json checkpoint-run/payload/entry-evidence.json
          cp restored/provider/provider-probe.json checkpoint-run/payload/provider-probe.json
          cp restored/toolchain/toolchain-evidence.json checkpoint-run/payload/toolchain-evidence.json
          cp restored/policy/policy-replay.json checkpoint-run/payload/policy-replay.json
          cp restored/reverify/offline-reverify.json checkpoint-run/payload/offline-reverify.json
          cp restored/hidden/offline-hidden-holdout.json checkpoint-run/payload/offline-hidden-holdout.json
          cp restored/safe/offline-safe-pair.json checkpoint-run/payload/offline-safe-pair.json
          cp restored/canary/offline-canary.json checkpoint-run/payload/offline-canary.json
          cp restored/offline/offline-evidence.json checkpoint-run/payload/offline-evidence.json
          cp restored/fast/p6-fast-projection.json checkpoint-run/payload/p6-fast-projection.json
          cp restored/balanced/p6-balanced-projection.json checkpoint-run/payload/p6-balanced-projection.json
          cp restored/deep/p6-deep-projection.json checkpoint-run/payload/p6-deep-projection.json
          cp restored/qualification/qualification.json checkpoint-run/payload/qualification.json
          cp restored/reviews/product-architecture/packet/packet.json checkpoint-run/payload/reviews/product-architecture/packet.json
          cp restored/reviews/product-architecture/review/decision.json checkpoint-run/payload/reviews/product-architecture/decision.json
          cp restored/reviews/product-architecture/review/raw-envelope.json checkpoint-run/payload/reviews/product-architecture/raw-envelope.json
          cp restored/reviews/proof-security/packet/packet.json checkpoint-run/payload/reviews/proof-security/packet.json
          cp restored/reviews/proof-security/review/decision.json checkpoint-run/payload/reviews/proof-security/decision.json
          cp restored/reviews/proof-security/review/raw-envelope.json checkpoint-run/payload/reviews/proof-security/raw-envelope.json
          cp restored/reviews/independent-benchmark/packet/packet.json checkpoint-run/payload/reviews/independent-benchmark/packet.json
          cp restored/reviews/independent-benchmark/review/decision.json checkpoint-run/payload/reviews/independent-benchmark/decision.json
          cp restored/reviews/independent-benchmark/review/raw-envelope.json checkpoint-run/payload/reviews/independent-benchmark/raw-envelope.json
          cp p6-independent-reviews.json checkpoint-run/payload/p6-independent-reviews.json
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zscope.benchmarking.p6_review import validate_review_artifact
          for role, directory in (
              ("product_architecture", "product-architecture"),
              ("proof_security", "proof-security"),
              ("independent_benchmark", "independent-benchmark"),
          ):
              root = Path("checkpoint-run/payload/reviews") / directory
              validate_review_artifact(
                  output_dir=root,
                  packet_path=root / "packet.json",
                  role=role,
                  material_root=Path(os.environ["P6_CANDIDATE_ROOT"]),
              )
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import load_json_strict
          value = load_json_strict(Path("checkpoint-run/payload/qualification.json"))
          payload = {
              "schema_version": "zscope.p6-conservation-evidence.v1",
              "control_plane_commit": value["control_plane_commit"],
              "usage_conservation": value["usage_conservation"],
              "formal_benchmark": False,
              "release_eligible": False,
          }
          Path("checkpoint-run/payload/conservation.json").write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import canonical_sha256
          root = Path("checkpoint-run/payload")
          rows = []
          for path in sorted(root.rglob("*.json"), key=lambda item: item.relative_to(root).as_posix()):
              relative = path.relative_to(root).as_posix()
              if relative == "final-evidence-manifest.json":
                  continue
              rows.append({"path": relative, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          stages = ["entry", "provider_probe", "toolchain_oci_preflight", "policy_replay", "certificate_reverify", "anonymous_qualification", "safe_pair_validation", "evidence_action_canary", "cold_fast", "cold_balanced", "cold_deep", "conservation", "qualification_seal", "product_architecture_review", "proof_security_review", "independent_benchmark_review", "final_evidence_seal"]
          payload = {
              "schema_version": "zscope.p6-final-evidence-manifest.v1",
              "control_plane_commit": os.environ["P6_CONTROL_PLANE_COMMIT"],
              "candidate_git_sha": os.environ["P6_CANDIDATE_COMMIT"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "attempt_id": os.environ["P6_ATTEMPT_ID"],
              "artifacts": rows,
              "phase_status": {stage: "completed" for stage in stages},
              "formal_benchmark": False,
              "release_eligible": False,
          }
          payload["evidence_sha256"] = canonical_sha256(payload)
          (root / "final-evidence-manifest.json").write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          conservation_payload="$(sha256sum checkpoint-run/payload/conservation.json | awk '{print $1}')"
          final_payload="$(sha256sum checkpoint-run/payload/final-evidence-manifest.json | awk '{print $1}')"
          stages=(entry provider_probe toolchain_oci_preflight policy_replay certificate_reverify anonymous_qualification safe_pair_validation evidence_action_canary cold_fast cold_balanced cold_deep conservation qualification_seal product_architecture_review proof_security_review independent_benchmark_review final_evidence_seal)
          payloads=(
            "$entry_payload" "$provider_payload" "$toolchain_payload"
            "$policy_payload" "$reverify_payload" "$hidden_payload"
            "$safe_payload" "$canary_payload" "$fast_payload"
            "$balanced_payload" "$deep_payload" "$conservation_payload"
            "$qualification_payload" "$product_payload" "$proof_payload" "$benchmark_payload"
            "$final_payload"
          )
          while IFS= read -r -d '' artifact; do
            python3 scripts/p6_pilot_protocol.py validate-answer-free --input "$artifact" >/dev/null
          done < <(find checkpoint-run/payload -type f -name '*.json' \
            -not -path '*/reviews/*' -print0)
          for index in "${!stages[@]}"; do
            stage="${stages[$index]}"
            binding="$(python3 scripts/p6_pilot_protocol.py seal-stage-artifact \
              "${lineage_args[@]}" --stage "$stage" --payload-sha256 "${payloads[$index]}" \
              --output "checkpoint-run/stage-artifacts/${stage}.json")"
            python3 scripts/p6_pilot_protocol.py record-stage \
              --run-dir checkpoint-run --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --attempt-id "$P6_ATTEMPT_ID" \
              --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
              --stage "$stage" --status completed --binding-sha256 "$binding" >/dev/null
          done
          python3 scripts/p6_pilot_protocol.py checkpoint \
            --run-dir checkpoint-run --output checkpoint-run/checkpoint.json \
            "${lineage_args[@]}" >/dev/null
          python3 scripts/p6_pilot_protocol.py validate-checkpoint \
            --checkpoint checkpoint-run/checkpoint.json \
            --artifact-root checkpoint-run/stage-artifacts \
            --run-dir checkpoint-run >/dev/null
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: checkpoint-run
          stage: artifact_seal
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-complete-checkpoint-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/checkpoint-run
      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: final_evidence_seal
          default-class: artifact_integrity_failure

  finalize:
    name: zero-call finalize reviewed P6 evidence
    needs: final_evidence_seal
    outputs:
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 30
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore the exact complete checkpoint
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          CHECKPOINT_ID: ${{ needs.final_evidence_seal.outputs.artifact_id }}
          CHECKPOINT_DIGEST: ${{ needs.final_evidence_seal.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$CHECKPOINT_ID" =~ ^[0-9]+$ ]]
          [[ "$CHECKPOINT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'seal complete reviewed P6 checkpoint' --artifact-id "$CHECKPOINT_ID" \
            --artifact-name "p6-complete-checkpoint-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$CHECKPOINT_DIGEST" \
            --required-member checkpoint.json \
            --required-member stage-artifacts/final_evidence_seal.json \
            --required-member payload/entry-evidence.json \
            --required-member payload/provider-probe.json \
            --required-member payload/toolchain-evidence.json \
            --required-member payload/qualification.json \
            --required-member payload/p6-independent-reviews.json \
            --required-member payload/final-evidence-manifest.json \
            --required-member payload/reviews/product-architecture/decision.json \
            --required-member payload/reviews/proof-security/decision.json \
            --required-member payload/reviews/independent-benchmark/decision.json \
            --output-dir restored/checkpoint
      - name: Byte-exact zero-call finalization
        run: |
          set -euo pipefail
          candidate_sha="$(printf %s "$P6_CANDIDATE_COMMIT" | sha256sum | awk '{print $1}')"
          policy_sha="$(sha256sum zscope/benchmarking/benchmark_policy.v2.json | awk '{print $1}')"
          plan_sha="$(sha256sum .github/workflows/p6-pilot-validation.yml | awk '{print $1}')"
          mapfile -t evidence_lineage < <(python3 - <<'PY'
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import load_json_strict
          entry = load_json_strict(Path("restored/checkpoint/payload/entry-evidence.json"))
          probe = load_json_strict(Path("restored/checkpoint/payload/provider-probe.json"))
          toolchain = load_json_strict(Path("restored/checkpoint/payload/toolchain-evidence.json"))
          print(entry["evidence_sha256"])
          print(toolchain["runtime_source_sha256"])
          print(probe["provider_identity_sha256"])
          print(toolchain["oci_execution_sha256"])
          PY
          )
          test "${#evidence_lineage[@]}" = 4
          input_sha="${evidence_lineage[0]}"
          runtime_sha="${evidence_lineage[1]}"
          provider_sha="${evidence_lineage[2]}"
          oci_sha="${evidence_lineage[3]}"
          fast_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:fast" | sha256sum | awk '{print $1}')"
          balanced_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:balanced" | sha256sum | awk '{print $1}')"
          deep_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:deep" | sha256sum | awk '{print $1}')"
          python3 scripts/p6_pilot_protocol.py finalize-checkpoint \
            --checkpoint restored/checkpoint/checkpoint.json \
            --artifact-root restored/checkpoint/stage-artifacts \
            --run-dir restored/checkpoint \
            --payload restored/checkpoint/payload/final-evidence-manifest.json \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --attempt-id "$P6_ATTEMPT_ID" --candidate-sha256 "$candidate_sha" \
            --policy-sha256 "$policy_sha" --plan-sha256 "$plan_sha" --input-sha256 "$input_sha" \
            --runtime-sha256 "$runtime_sha" --provider-sha256 "$provider_sha" --oci-sha256 "$oci_sha" \
            --fast-cache-sha256 "$fast_cache" --balanced-cache-sha256 "$balanced_cache" \
            --deep-cache-sha256 "$deep_cache" \
            --output final-evidence-manifest.json >/dev/null
          mkdir -p non-release-evidence
          cp final-evidence-manifest.json non-release-evidence/final-evidence-manifest.json
          cp -R restored/checkpoint non-release-evidence/complete-checkpoint
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: non-release-evidence
          stage: artifact_seal
      - uses: ./control/.github/actions/upload-artifact-retry
        id: non_release_artifact
        with:
          name: p6-non-release-evidence-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: control/non-release-evidence
      - name: Report immutable non-release artifact identity
        run: |
          set -euo pipefail
          test -n '${{ steps.non_release_artifact.outputs.artifact-id }}'
          test -n '${{ steps.non_release_artifact.outputs.artifact-digest }}'
          echo 'P6 pilot complete: formal_benchmark=false; release_eligible=false'
      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: evidence_pr
          default-class: artifact_upload_transport_failed

  failure_evidence:
    name: immutable answer-free failure diagnostic and partial checkpoint
    needs:
      - entry
      - provider_probe
      - toolchain_oci
      - policy_replay
      - certificate_reverify
      - anonymous_qualification
      - safe_pair_validation
      - evidence_action_canary
      - offline_qualification
      - cold_fast
      - cold_balanced
      - cold_deep
      - qualification_seal
      - product_architecture_review
      - proof_security_review
      - independent_benchmark_review
      - final_evidence_seal
      - finalize
    if: ${{ always() && needs.finalize.result != 'success' }}
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 30
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate only when completed reviewer artifacts may be restored
        if: ${{ needs.entry.result == 'success' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Select the first failed job boundary without reading logs
        id: boundary
        env:
          ENTRY_RESULT: ${{ needs.entry.result }}
          ENTRY_FAILURE_CLASS: ${{ needs.entry.outputs.failure_class }}
          ENTRY_FAILURE_COUNT: ${{ needs.entry.outputs.failure_count }}
          PROVIDER_RESULT: ${{ needs.provider_probe.result }}
          PROVIDER_FAILURE_CLASS: ${{ needs.provider_probe.outputs.failure_class }}
          PROVIDER_FAILURE_COUNT: ${{ needs.provider_probe.outputs.failure_count }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain_oci.result }}
          TOOLCHAIN_FAILURE_CLASS: ${{ needs.toolchain_oci.outputs.failure_class }}
          TOOLCHAIN_FAILURE_COUNT: ${{ needs.toolchain_oci.outputs.failure_count }}
          POLICY_RESULT: ${{ needs.policy_replay.result }}
          POLICY_FAILURE_CLASS: ${{ needs.policy_replay.outputs.failure_class }}
          POLICY_FAILURE_COUNT: ${{ needs.policy_replay.outputs.failure_count }}
          REVERIFY_RESULT: ${{ needs.certificate_reverify.result }}
          REVERIFY_FAILURE_CLASS: ${{ needs.certificate_reverify.outputs.failure_class }}
          REVERIFY_FAILURE_COUNT: ${{ needs.certificate_reverify.outputs.failure_count }}
          ANONYMOUS_RESULT: ${{ needs.anonymous_qualification.result }}
          ANONYMOUS_FAILURE_CLASS: ${{ needs.anonymous_qualification.outputs.failure_class }}
          ANONYMOUS_FAILURE_COUNT: ${{ needs.anonymous_qualification.outputs.failure_count }}
          SAFE_PAIR_RESULT: ${{ needs.safe_pair_validation.result }}
          SAFE_PAIR_FAILURE_CLASS: ${{ needs.safe_pair_validation.outputs.failure_class }}
          SAFE_PAIR_FAILURE_COUNT: ${{ needs.safe_pair_validation.outputs.failure_count }}
          CANARY_RESULT: ${{ needs.evidence_action_canary.result }}
          CANARY_FAILURE_CLASS: ${{ needs.evidence_action_canary.outputs.failure_class }}
          CANARY_FAILURE_COUNT: ${{ needs.evidence_action_canary.outputs.failure_count }}
          OFFLINE_RESULT: ${{ needs.offline_qualification.result }}
          OFFLINE_FAILURE_CLASS: ${{ needs.offline_qualification.outputs.failure_class }}
          OFFLINE_FAILURE_COUNT: ${{ needs.offline_qualification.outputs.failure_count }}
          FAST_RESULT: ${{ needs.cold_fast.result }}
          FAST_FAILURE_CLASS: ${{ needs.cold_fast.outputs.failure_class }}
          FAST_FAILURE_COUNT: ${{ needs.cold_fast.outputs.failure_count }}
          BALANCED_RESULT: ${{ needs.cold_balanced.result }}
          BALANCED_FAILURE_CLASS: ${{ needs.cold_balanced.outputs.failure_class }}
          BALANCED_FAILURE_COUNT: ${{ needs.cold_balanced.outputs.failure_count }}
          DEEP_RESULT: ${{ needs.cold_deep.result }}
          DEEP_FAILURE_CLASS: ${{ needs.cold_deep.outputs.failure_class }}
          DEEP_FAILURE_COUNT: ${{ needs.cold_deep.outputs.failure_count }}
          SEAL_RESULT: ${{ needs.qualification_seal.result }}
          SEAL_FAILURE_CLASS: ${{ needs.qualification_seal.outputs.failure_class }}
          SEAL_FAILURE_COUNT: ${{ needs.qualification_seal.outputs.failure_count }}
          PRODUCT_RESULT: ${{ needs.product_architecture_review.result }}
          PRODUCT_FAILURE_CLASS: ${{ needs.product_architecture_review.outputs.failure_class }}
          PRODUCT_FAILURE_COUNT: ${{ needs.product_architecture_review.outputs.failure_count }}
          PROOF_RESULT: ${{ needs.proof_security_review.result }}
          PROOF_FAILURE_CLASS: ${{ needs.proof_security_review.outputs.failure_class }}
          PROOF_FAILURE_COUNT: ${{ needs.proof_security_review.outputs.failure_count }}
          BENCHMARK_RESULT: ${{ needs.independent_benchmark_review.result }}
          BENCHMARK_FAILURE_CLASS: ${{ needs.independent_benchmark_review.outputs.failure_class }}
          BENCHMARK_FAILURE_COUNT: ${{ needs.independent_benchmark_review.outputs.failure_count }}
          FINAL_SEAL_RESULT: ${{ needs.final_evidence_seal.result }}
          FINAL_SEAL_FAILURE_CLASS: ${{ needs.final_evidence_seal.outputs.failure_class }}
          FINAL_SEAL_FAILURE_COUNT: ${{ needs.final_evidence_seal.outputs.failure_count }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          FINALIZE_FAILURE_CLASS: ${{ needs.finalize.outputs.failure_class }}
          FINALIZE_FAILURE_COUNT: ${{ needs.finalize.outputs.failure_count }}
        run: |
          set -euo pipefail
          stage=
          failure_class=
          failure_count=1
          while IFS=: read -r result candidate reported fallback reported_count; do
            if [[ "$result" = failure || "$result" = cancelled ]]; then
              stage="$candidate"
              if [[ "$result" = cancelled ]]; then
                failure_class=internal_failure
                failure_count=1
              else
                failure_class="${reported:-$fallback}"
                failure_count="${reported_count:-1}"
              fi
              break
            fi
          done <<EOF
          $ENTRY_RESULT:entry:$ENTRY_FAILURE_CLASS:internal_failure:$ENTRY_FAILURE_COUNT
          $PROVIDER_RESULT:provider_probe:$PROVIDER_FAILURE_CLASS:provider_protocol_incompatible:$PROVIDER_FAILURE_COUNT
          $TOOLCHAIN_RESULT:toolchain_oci_preflight:$TOOLCHAIN_FAILURE_CLASS:oci_capability_failed:$TOOLCHAIN_FAILURE_COUNT
          $POLICY_RESULT:policy_replay:$POLICY_FAILURE_CLASS:replay_nondeterministic:$POLICY_FAILURE_COUNT
          $REVERIFY_RESULT:certificate_reverify:$REVERIFY_FAILURE_CLASS:certificate_reverify_failure:$REVERIFY_FAILURE_COUNT
          $ANONYMOUS_RESULT:anonymous_qualification:$ANONYMOUS_FAILURE_CLASS:anonymous_qualification_failed:$ANONYMOUS_FAILURE_COUNT
          $SAFE_PAIR_RESULT:safe_pair_validation:$SAFE_PAIR_FAILURE_CLASS:safe_pair_false_confirmation:$SAFE_PAIR_FAILURE_COUNT
          $CANARY_RESULT:evidence_action_canary:$CANARY_FAILURE_CLASS:evidence_action_not_consumed:$CANARY_FAILURE_COUNT
          $OFFLINE_RESULT:cold_fast:$OFFLINE_FAILURE_CLASS:internal_failure:$OFFLINE_FAILURE_COUNT
          $FAST_RESULT:cold_fast:$FAST_FAILURE_CLASS:quality_no_progress_gate_failed:$FAST_FAILURE_COUNT
          $BALANCED_RESULT:cold_balanced:$BALANCED_FAILURE_CLASS:quality_no_progress_gate_failed:$BALANCED_FAILURE_COUNT
          $DEEP_RESULT:cold_deep:$DEEP_FAILURE_CLASS:quality_no_progress_gate_failed:$DEEP_FAILURE_COUNT
          $SEAL_RESULT:qualification_seal:$SEAL_FAILURE_CLASS:accounting_conservation_failure:$SEAL_FAILURE_COUNT
          $PRODUCT_RESULT:product_architecture_review:$PRODUCT_FAILURE_CLASS:review_binding_invalid:$PRODUCT_FAILURE_COUNT
          $PROOF_RESULT:proof_security_review:$PROOF_FAILURE_CLASS:review_binding_invalid:$PROOF_FAILURE_COUNT
          $BENCHMARK_RESULT:independent_benchmark_review:$BENCHMARK_FAILURE_CLASS:review_binding_invalid:$BENCHMARK_FAILURE_COUNT
          $FINAL_SEAL_RESULT:final_evidence_seal:$FINAL_SEAL_FAILURE_CLASS:artifact_integrity_failure:$FINAL_SEAL_FAILURE_COUNT
          $FINALIZE_RESULT:evidence_pr:$FINALIZE_FAILURE_CLASS:artifact_upload_transport_failed:$FINALIZE_FAILURE_COUNT
          EOF
          test -n "$stage"
          test -n "$failure_class"
          if [[ ! "$failure_class" =~ ^[a-z][a-z0-9_]+$ || ! "$failure_count" =~ ^[1-9][0-9]*$ ]] || \
            ! SELECTED_STAGE="$stage" SELECTED_CLASS="$failure_class" SELECTED_COUNT="$failure_count" \
              python3 - <<'PY' >/dev/null 2>&1
          import os
          from zscope.benchmarking.p6_protocol import validate_stage_result
          validate_stage_result({
              "schema_version": "zscope.p6-stage-result.v1",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "attempt_id": os.environ["P6_ATTEMPT_ID"],
              "control_plane_commit": os.environ["P6_CONTROL_PLANE_COMMIT"],
              "stage": os.environ["SELECTED_STAGE"],
              "status": "failed",
              "failure_class": os.environ["SELECTED_CLASS"],
              "failure_count": int(os.environ["SELECTED_COUNT"]),
              "binding_sha256": "0" * 64,
          })
          PY
          then
            failure_class=internal_failure
            failure_count=1
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "failure_class=$failure_class" >> "$GITHUB_OUTPUT"
          echo "failure_count=$failure_count" >> "$GITHUB_OUTPUT"
      - name: Restore the exact longest continuous successful producer prefix
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          ENTRY_RESULT: ${{ needs.entry.result }}
          ENTRY_ID: ${{ needs.entry.outputs.artifact_id }}
          ENTRY_DIGEST: ${{ needs.entry.outputs.artifact_digest }}
          PROVIDER_RESULT: ${{ needs.provider_probe.result }}
          PROVIDER_ID: ${{ needs.provider_probe.outputs.artifact_id }}
          PROVIDER_DIGEST: ${{ needs.provider_probe.outputs.artifact_digest }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain_oci.result }}
          TOOLCHAIN_ID: ${{ needs.toolchain_oci.outputs.artifact_id }}
          TOOLCHAIN_DIGEST: ${{ needs.toolchain_oci.outputs.artifact_digest }}
          POLICY_RESULT: ${{ needs.policy_replay.result }}
          POLICY_ID: ${{ needs.policy_replay.outputs.artifact_id }}
          POLICY_DIGEST: ${{ needs.policy_replay.outputs.artifact_digest }}
          REVERIFY_RESULT: ${{ needs.certificate_reverify.result }}
          REVERIFY_ID: ${{ needs.certificate_reverify.outputs.artifact_id }}
          REVERIFY_DIGEST: ${{ needs.certificate_reverify.outputs.artifact_digest }}
          ANONYMOUS_RESULT: ${{ needs.anonymous_qualification.result }}
          ANONYMOUS_ID: ${{ needs.anonymous_qualification.outputs.artifact_id }}
          ANONYMOUS_DIGEST: ${{ needs.anonymous_qualification.outputs.artifact_digest }}
          SAFE_RESULT: ${{ needs.safe_pair_validation.result }}
          SAFE_ID: ${{ needs.safe_pair_validation.outputs.artifact_id }}
          SAFE_DIGEST: ${{ needs.safe_pair_validation.outputs.artifact_digest }}
          CANARY_RESULT: ${{ needs.evidence_action_canary.result }}
          CANARY_ID: ${{ needs.evidence_action_canary.outputs.artifact_id }}
          CANARY_DIGEST: ${{ needs.evidence_action_canary.outputs.artifact_digest }}
          FAST_RESULT: ${{ needs.cold_fast.result }}
          FAST_ID: ${{ needs.cold_fast.outputs.artifact_id }}
          FAST_DIGEST: ${{ needs.cold_fast.outputs.artifact_digest }}
          BALANCED_RESULT: ${{ needs.cold_balanced.result }}
          BALANCED_ID: ${{ needs.cold_balanced.outputs.artifact_id }}
          BALANCED_DIGEST: ${{ needs.cold_balanced.outputs.artifact_digest }}
          DEEP_RESULT: ${{ needs.cold_deep.result }}
          DEEP_ID: ${{ needs.cold_deep.outputs.artifact_id }}
          DEEP_DIGEST: ${{ needs.cold_deep.outputs.artifact_digest }}
          QUALIFICATION_RESULT: ${{ needs.qualification_seal.result }}
          QUALIFICATION_ID: ${{ needs.qualification_seal.outputs.artifact_id }}
          QUALIFICATION_DIGEST: ${{ needs.qualification_seal.outputs.artifact_digest }}
          PRODUCT_RESULT: ${{ needs.product_architecture_review.result }}
          PRODUCT_ID: ${{ needs.product_architecture_review.outputs.artifact_id }}
          PRODUCT_DIGEST: ${{ needs.product_architecture_review.outputs.artifact_digest }}
          PROOF_RESULT: ${{ needs.proof_security_review.result }}
          PROOF_ID: ${{ needs.proof_security_review.outputs.artifact_id }}
          PROOF_DIGEST: ${{ needs.proof_security_review.outputs.artifact_digest }}
          BENCHMARK_RESULT: ${{ needs.independent_benchmark_review.result }}
          BENCHMARK_ID: ${{ needs.independent_benchmark_review.outputs.artifact_id }}
          BENCHMARK_DIGEST: ${{ needs.independent_benchmark_review.outputs.artifact_digest }}
          FINAL_SEAL_RESULT: ${{ needs.final_evidence_seal.result }}
          FINAL_SEAL_ID: ${{ needs.final_evidence_seal.outputs.artifact_id }}
          FINAL_SEAL_DIGEST: ${{ needs.final_evidence_seal.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p failure-evidence/restored
          restore() {
            local job="$1" id="$2" name="$3" digest="$4" member="$5" target="$6"
            [[ "$id" =~ ^[0-9]+$ ]]
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            python3 scripts/download_p6_run_artifact.py \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
              --candidate-commit "$P6_CANDIDATE_COMMIT" \
              --producer-job "$job" --artifact-id "$id" --artifact-name "$name" \
              --artifact-digest "sha256:$digest" --required-member "$member" \
              --output-dir "$target"
          }
          prefix_open=true
          restore_prefix() {
            local result="$1" stage="$2" job="$3" id="$4" name="$5" digest="$6" member="$7" target="$8"
            if [[ "$prefix_open" != true ]]; then return 0; fi
            if [[ "$result" != success ]]; then prefix_open=false; return 0; fi
            restore "$job" "$id" "$name" "$digest" "$member" "$target"
            printf '%s\n' "$stage" >> failure-evidence/prefix-stages.txt
          }
          restore_prefix "$ENTRY_RESULT" entry 'P6 entry and provider identity' "$ENTRY_ID" \
            "p6-entry-evidence-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$ENTRY_DIGEST" entry-evidence.json failure-evidence/restored/entry
          restore_prefix "$PROVIDER_RESULT" provider_probe 'source-free deepseek-v4-flash provider probe' "$PROVIDER_ID" \
            "p6-provider-probe-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$PROVIDER_DIGEST" provider-probe.json failure-evidence/restored/provider
          restore_prefix "$TOOLCHAIN_RESULT" toolchain_oci_preflight 'toolchain OCI and cold-cache preflight' "$TOOLCHAIN_ID" \
            "p6-toolchain-oci-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$TOOLCHAIN_DIGEST" toolchain-evidence.json failure-evidence/restored/toolchain
          restore_prefix "$POLICY_RESULT" policy_replay 'P6 frozen policy replay' "$POLICY_ID" \
            "p6-policy-replay-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$POLICY_DIGEST" policy-replay.json failure-evidence/restored/policy
          restore_prefix "$REVERIFY_RESULT" certificate_reverify 'P6 certificate reverify' "$REVERIFY_ID" \
            "p6-certificate-reverify-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$REVERIFY_DIGEST" offline-reverify.json failure-evidence/restored/reverify
          restore_prefix "$ANONYMOUS_RESULT" anonymous_qualification 'P6 anonymous qualification' "$ANONYMOUS_ID" \
            "p6-anonymous-qualification-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$ANONYMOUS_DIGEST" offline-hidden-holdout.json failure-evidence/restored/hidden
          restore_prefix "$SAFE_RESULT" safe_pair_validation 'P6 safe-pair validation' "$SAFE_ID" \
            "p6-safe-pair-validation-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$SAFE_DIGEST" offline-safe-pair.json failure-evidence/restored/safe
          restore_prefix "$CANARY_RESULT" evidence_action_canary 'P6 EvidenceAction canary' "$CANARY_ID" \
            "p6-evidence-action-canary-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$CANARY_DIGEST" offline-canary.json failure-evidence/restored/canary
          restore_prefix "$FAST_RESULT" cold_fast 'one isolated cold fast pilot' "$FAST_ID" \
            "p6-cold-fast-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$FAST_DIGEST" p6-fast-projection.json failure-evidence/restored/fast
          restore_prefix "$BALANCED_RESULT" cold_balanced 'one isolated cold balanced pilot' "$BALANCED_ID" \
            "p6-cold-balanced-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$BALANCED_DIGEST" p6-balanced-projection.json failure-evidence/restored/balanced
          restore_prefix "$DEEP_RESULT" cold_deep 'one isolated cold deep pilot' "$DEEP_ID" \
            "p6-cold-deep-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$DEEP_DIGEST" p6-deep-projection.json failure-evidence/restored/deep
          if [[ "$prefix_open" = true ]]; then
            if [[ "$QUALIFICATION_RESULT" = success ]]; then
              restore 'conservation and qualification seal' "$QUALIFICATION_ID" \
                "p6-qualification-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$QUALIFICATION_DIGEST" qualification.json failure-evidence/restored/qualification
              printf '%s\n' conservation qualification_seal >> failure-evidence/prefix-stages.txt
            else
              prefix_open=false
            fi
          fi
          restore_prefix "$PRODUCT_RESULT" product_architecture_review 'independent product architecture review' "$PRODUCT_ID" \
            "p6-review-product-architecture-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$PRODUCT_DIGEST" review/decision.json failure-evidence/restored/product
          restore_prefix "$PROOF_RESULT" proof_security_review 'independent proof security review' "$PROOF_ID" \
            "p6-review-proof-security-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$PROOF_DIGEST" review/decision.json failure-evidence/restored/proof
          restore_prefix "$BENCHMARK_RESULT" independent_benchmark_review 'independent benchmark review' "$BENCHMARK_ID" \
            "p6-review-independent-benchmark-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$BENCHMARK_DIGEST" review/decision.json failure-evidence/restored/benchmark
          if [[ "$prefix_open" = true && "$FINAL_SEAL_RESULT" = success ]]; then
            restore 'seal complete reviewed P6 checkpoint' "$FINAL_SEAL_ID" \
              "p6-complete-checkpoint-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" "$FINAL_SEAL_DIGEST" checkpoint.json failure-evidence/complete-checkpoint
            printf '%s\n' final_evidence_seal >> failure-evidence/prefix-stages.txt
          fi
      - name: Emit typed diagnostic and an exact non-finalizable checkpoint when possible
        env:
          FAILURE_EXECUTION_STAGE: ${{ steps.boundary.outputs.stage }}
          FAILURE_CLASS: ${{ steps.boundary.outputs.failure_class }}
          FAILURE_COUNT: ${{ steps.boundary.outputs.failure_count }}
        run: |
          set -euo pipefail
          candidate_sha="$(printf %s "$P6_CANDIDATE_COMMIT" | sha256sum | awk '{print $1}')"
          policy_sha="$(sha256sum zscope/benchmarking/benchmark_policy.v2.json | awk '{print $1}')"
          plan_sha="$(sha256sum .github/workflows/p6-pilot-validation.yml | awk '{print $1}')"
          fast_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:fast" | sha256sum | awk '{print $1}')"
          balanced_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:balanced" | sha256sum | awk '{print $1}')"
          deep_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:deep" | sha256sum | awk '{print $1}')"
          mkdir -p failure-evidence/diagnostic-run
          checkpoint_args=()
          if [[ -f failure-evidence/complete-checkpoint/checkpoint.json ]]; then
            python3 scripts/p6_pilot_protocol.py validate-checkpoint \
              --checkpoint failure-evidence/complete-checkpoint/checkpoint.json \
              --artifact-root failure-evidence/complete-checkpoint/stage-artifacts \
              --run-dir failure-evidence/complete-checkpoint >/dev/null
            checkpoint_args=(--checkpoint failure-evidence/complete-checkpoint/checkpoint.json \
              --checkpoint-artifact-root failure-evidence/complete-checkpoint/stage-artifacts)
          elif [[ -f failure-evidence/restored/entry/entry-evidence.json && \
                -f failure-evidence/restored/provider/provider-probe.json && \
                -f failure-evidence/restored/toolchain/toolchain-evidence.json ]]; then
            mapfile -t evidence_lineage < <(python3 - <<'PY'
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import load_json_strict
          entry = load_json_strict(Path("failure-evidence/restored/entry/entry-evidence.json"))
          provider = load_json_strict(Path("failure-evidence/restored/provider/provider-probe.json"))
          toolchain = load_json_strict(Path("failure-evidence/restored/toolchain/toolchain-evidence.json"))
          print(entry["evidence_sha256"])
          print(toolchain["runtime_source_sha256"])
          print(provider["provider_identity_sha256"])
          print(toolchain["oci_execution_sha256"])
          PY
            )
            test "${#evidence_lineage[@]}" = 4
            input_sha="${evidence_lineage[0]}"
            runtime_sha="${evidence_lineage[1]}"
            provider_sha="${evidence_lineage[2]}"
            oci_sha="${evidence_lineage[3]}"
            lineage_args=(
              --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
              --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" --attempt-id "$P6_ATTEMPT_ID"
              --candidate-sha256 "$candidate_sha" --policy-sha256 "$policy_sha"
              --plan-sha256 "$plan_sha" --input-sha256 "$input_sha"
              --runtime-sha256 "$runtime_sha" --provider-sha256 "$provider_sha" --oci-sha256 "$oci_sha"
              --fast-cache-sha256 "$fast_cache" --balanced-cache-sha256 "$balanced_cache"
              --deep-cache-sha256 "$deep_cache"
            )
            python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.project_p6_entry_lineage import project_entry_lineage
          from zscope.benchmarking.p6_protocol import (
              P6_CHECKPOINT_STAGE_ORDER,
              load_json_strict,
              sha256_file,
              validate_depth_projection,
              validate_provider_probe,
              validate_toolchain_evidence,
          )

          restored = Path("failure-evidence/restored")
          entry_path = restored / "entry/entry-evidence.json"
          entry = load_json_strict(entry_path)
          project_entry_lineage(entry, artifact_sha256=sha256_file(entry_path))
          provider = load_json_strict(restored / "provider/provider-probe.json")
          validate_provider_probe(provider)
          toolchain = load_json_strict(restored / "toolchain/toolchain-evidence.json")
          validate_toolchain_evidence(
              toolchain,
              expected_run_id=os.environ["GITHUB_RUN_ID"],
              expected_run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              expected_attempt_id=os.environ["P6_ATTEMPT_ID"],
              expected_control_plane_commit=os.environ["P6_CONTROL_PLANE_COMMIT"],
              expected_git_sha=os.environ["P6_CANDIDATE_COMMIT"],
          )
          stages = Path("failure-evidence/prefix-stages.txt").read_text(
              encoding="utf-8"
          ).splitlines()
          if stages != list(P6_CHECKPOINT_STAGE_ORDER[: len(stages)]):
              raise SystemExit(2)
          for depth in ("fast", "balanced", "deep"):
              path = restored / depth / f"p6-{depth}-projection.json"
              if path.is_file():
                  value = load_json_strict(path)
                  validate_depth_projection(value, scan_depth=depth)
          PY
            if grep -qx qualification_seal failure-evidence/prefix-stages.txt; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          from zscope.benchmarking.p6_protocol import load_json_strict
          value = load_json_strict(Path("failure-evidence/restored/qualification/qualification.json"))
          payload = {
              "schema_version": "zscope.p6-conservation-evidence.v1",
              "control_plane_commit": value["control_plane_commit"],
              "usage_conservation": value["usage_conservation"],
              "formal_benchmark": False,
              "release_eligible": False,
          }
          Path("failure-evidence/restored/qualification/conservation.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
            fi
            for role_dir in product proof benchmark; do
              if [[ -f "failure-evidence/restored/${role_dir}/review/decision.json" ]]; then
                ROLE_DIR="$role_dir" python3 - <<'PY'
          import os
          from pathlib import Path
          from zscope.benchmarking.p6_review import validate_review_artifact
          directory = os.environ["ROLE_DIR"]
          role = {
              "product": "product_architecture",
              "proof": "proof_security",
              "benchmark": "independent_benchmark",
          }[directory]
          root = Path("failure-evidence/restored") / directory
          validate_review_artifact(
              output_dir=root / "review",
              packet_path=root / "packet/packet.json",
              role=role,
              material_root=Path(os.environ["P6_CANDIDATE_ROOT"]),
          )
          PY
              fi
            done
            mkdir -p failure-evidence/checkpoint-run/stage-artifacts
            mapfile -t stages < failure-evidence/prefix-stages.txt
            payload_path() {
              case "$1" in
                entry) echo failure-evidence/restored/entry/entry-evidence.json ;;
                provider_probe) echo failure-evidence/restored/provider/provider-probe.json ;;
                toolchain_oci_preflight) echo failure-evidence/restored/toolchain/toolchain-evidence.json ;;
                policy_replay) echo failure-evidence/restored/policy/policy-replay.json ;;
                certificate_reverify) echo failure-evidence/restored/reverify/offline-reverify.json ;;
                anonymous_qualification) echo failure-evidence/restored/hidden/offline-hidden-holdout.json ;;
                safe_pair_validation) echo failure-evidence/restored/safe/offline-safe-pair.json ;;
                evidence_action_canary) echo failure-evidence/restored/canary/offline-canary.json ;;
                cold_fast) echo failure-evidence/restored/fast/p6-fast-projection.json ;;
                cold_balanced) echo failure-evidence/restored/balanced/p6-balanced-projection.json ;;
                cold_deep) echo failure-evidence/restored/deep/p6-deep-projection.json ;;
                conservation) echo failure-evidence/restored/qualification/conservation.json ;;
                qualification_seal) echo failure-evidence/restored/qualification/qualification.json ;;
                product_architecture_review) echo failure-evidence/restored/product/review/decision.json ;;
                proof_security_review) echo failure-evidence/restored/proof/review/decision.json ;;
                independent_benchmark_review) echo failure-evidence/restored/benchmark/review/decision.json ;;
                *) return 2 ;;
              esac
            }
            for index in "${!stages[@]}"; do
              stage="${stages[$index]}"
              payload="$(payload_path "$stage")"
              test -f "$payload"
              if [[ "$stage" != *_review ]]; then
                python3 scripts/p6_pilot_protocol.py validate-answer-free --input "$payload" >/dev/null
              fi
              payload_sha="$(sha256sum "$payload" | awk '{print $1}')"
              binding="$(python3 scripts/p6_pilot_protocol.py seal-stage-artifact \
                "${lineage_args[@]}" --stage "$stage" --payload-sha256 "$payload_sha" \
                --output "failure-evidence/checkpoint-run/stage-artifacts/${stage}.json")"
              python3 scripts/p6_pilot_protocol.py record-stage \
                --run-dir failure-evidence/checkpoint-run --workflow-run-id "$GITHUB_RUN_ID" \
                --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --attempt-id "$P6_ATTEMPT_ID" \
                --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
                --stage "$stage" --status completed --binding-sha256 "$binding" >/dev/null
            done
            python3 scripts/p6_pilot_protocol.py checkpoint \
              --run-dir failure-evidence/checkpoint-run --output failure-evidence/checkpoint.json \
              "${lineage_args[@]}" >/dev/null
            checkpoint_args=(--checkpoint failure-evidence/checkpoint.json \
              --checkpoint-artifact-root failure-evidence/checkpoint-run/stage-artifacts)
          fi
          python3 scripts/p6_pilot_protocol.py emit-workflow-failure \
            --run-dir failure-evidence/diagnostic-run --output failure-evidence/diagnostic.json \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --attempt-id "$P6_ATTEMPT_ID" --stage "$FAILURE_EXECUTION_STAGE" \
            --status failed --failure-class "$FAILURE_CLASS" --failure-count "$FAILURE_COUNT" \
            --binding-sha256 "$candidate_sha" "${checkpoint_args[@]}"
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: failure-evidence/diagnostic.json
          stage: artifact_seal
          require-key: "false"
      - name: Strictly validate the optional exact partial checkpoint
        run: |
          set -euo pipefail
          if [[ -f failure-evidence/checkpoint.json ]]; then
            python3 scripts/p6_pilot_protocol.py validate-checkpoint \
              --checkpoint failure-evidence/checkpoint.json \
              --artifact-root failure-evidence/checkpoint-run/stage-artifacts \
              --run-dir failure-evidence/checkpoint-run >/dev/null
          fi
      - uses: ./control/.github/actions/upload-artifact-retry
        with:
          name: p6-failure-evidence-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: control/failure-evidence

  cleanup_p6_oci:
    name: exact-label terminal P6 scanner cleanup
    needs:
      - toolchain_oci
      - anonymous_qualification
      - safe_pair_validation
      - evidence_action_canary
      - cold_fast
      - cold_balanced
      - cold_deep
      - finalize
      - failure_evidence
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 15
    steps:
      - name: Checkout immutable control plane only
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Remove only exact current-attempt P6 scanner containers
        run: |
          set -euo pipefail
          if ! python3 scripts/p6_oci_cleanup.py \
            --runtime "$Z_SCOPE_BENCHMARK_OCI_RUNTIME" --mode current \
            --repository "$GITHUB_REPOSITORY" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attempt-id "$P6_ATTEMPT_ID" >/dev/null 2>&1; then
            echo '::error::stage=toolchain_oci_cache; class=oci_isolation_violation:1; count=1'
            exit 2
          fi
