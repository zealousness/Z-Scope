name: Validate P6 sanitized artifact with live scanner canary
description: Run the trusted control-plane answer-free validator without exposing the key.
inputs:
  paths:
    description: Newline-separated artifact files relative to the control checkout
    required: true
  stage:
    description: Fixed P6 stage used by the public typed failure annotation
    required: true
  require-key:
    description: Require and scan the live scanner secret (false only for credential-failure evidence)
    required: false
    default: "true"
  byte-scan-only:
    description: Recursively scan exact artifact bytes for live secrets without running semantic validators
    required: false
    default: "false"
  toolchain-evidence:
    description: Exact restored toolchain evidence used to generate a closed proxy attestation
    required: false
    default: ""
  image-provenance:
    description: Exact restored image provenance used to generate a closed proxy attestation
    required: false
    default: ""
  proxy-provision:
    description: Exact restored proxy-provision receipt used to generate a closed proxy attestation
    required: false
    default: ""
  expected-proxy-attestation:
    description: New control-checkout-relative closed proxy attestation output path
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate strict schemas and reject the live scanner secret
      shell: bash
      working-directory: ${{ github.workspace }}/control
      env:
        P6_SANITIZED_ARTIFACT_PATHS: ${{ inputs.paths }}
        P6_SANITIZED_ARTIFACT_STAGE: ${{ inputs.stage }}
        P6_SANITIZED_ARTIFACT_REQUIRE_KEY: ${{ inputs.require-key }}
        P6_SANITIZED_ARTIFACT_BYTE_SCAN_ONLY: ${{ inputs.byte-scan-only }}
        P6_TOOLCHAIN_EVIDENCE_PATH: ${{ inputs.toolchain-evidence }}
        P6_IMAGE_PROVENANCE_PATH: ${{ inputs.image-provenance }}
        P6_PROXY_PROVISION_PATH: ${{ inputs.proxy-provision }}
        P6_EXPECTED_PROXY_ATTESTATION_PATH: ${{ inputs.expected-proxy-attestation }}
      run: |
        set -euo pipefail
        if ! python3 - <<'PY' >/dev/null 2>&1
        import hashlib
        import os
        import stat
        import subprocess
        import sys
        import sysconfig
        from pathlib import Path

        from scripts.validate_p6_artifact_tree import (
            discover_regular_files,
            revalidate_regular_file,
        )
        from zscope.benchmarking.provider_runtime import load_explicit_api_key_file
        from zscope.benchmarking.isolation import OciNetworkPolicy
        from zscope.benchmarking.p6_local_runtime import (
            ProxyProvisionRequest,
            build_expected_proxy_attestation,
        )
        from zscope.benchmarking.p6_protocol import (
            derive_p6_artifact_canaries,
            load_json_strict,
            read_regular_file_once,
            scan_regular_artifact_tree_for_canaries,
            validate_expected_proxy_attestation,
        )
        from zscope.benchmarking.provider_runtime import ProviderRuntimeContract

        def strict_bool(name: str) -> bool:
            value = os.environ[name]
            if value not in {"true", "false"}:
                raise SystemExit(2)
            return value == "true"


        def exact_control_path(control: Path, raw: str, *, existing: bool) -> Path:
            if not raw or Path(raw).is_absolute():
                raise SystemExit(2)
            candidate = control / raw
            lexical = Path(os.path.abspath(candidate))
            try:
                lexical.relative_to(control)
            except ValueError:
                raise SystemExit(2)
            if existing:
                return revalidate_regular_file(control, lexical)
            if lexical.exists() or lexical.is_symlink() or lexical.parent != control:
                raise SystemExit(2)
            return lexical


        def write_expected_proxy_attestation(control: Path) -> tuple[Path, str]:
            raw_inputs = (
                os.environ["P6_TOOLCHAIN_EVIDENCE_PATH"],
                os.environ["P6_IMAGE_PROVENANCE_PATH"],
                os.environ["P6_PROXY_PROVISION_PATH"],
                os.environ["P6_EXPECTED_PROXY_ATTESTATION_PATH"],
            )
            if not any(raw_inputs):
                raise SystemExit(0)
            if not all(raw_inputs):
                raise SystemExit(2)
            if strict_bool("P6_SANITIZED_ARTIFACT_REQUIRE_KEY"):
                raise SystemExit(2)

            toolchain_path = exact_control_path(control, raw_inputs[0], existing=True)
            image_path = exact_control_path(control, raw_inputs[1], existing=True)
            proxy_path = exact_control_path(control, raw_inputs[2], existing=True)
            output = exact_control_path(control, raw_inputs[3], existing=False)
            for path in (toolchain_path, image_path, proxy_path):
                revalidate_regular_file(control, path)

            toolchain = load_json_strict(toolchain_path)
            receipt = load_json_strict(proxy_path)
            if not isinstance(toolchain, dict) or not isinstance(receipt, dict):
                raise SystemExit(2)
            contract = ProviderRuntimeContract.from_config_file(
                control / "test/range/zscope.benchmark.yaml"
            )
            policy = OciNetworkPolicy.from_provider_contract(os.environ, contract)
            runtime = os.environ.get("Z_SCOPE_BENCHMARK_OCI_RUNTIME", "")
            image_ref = os.environ.get("Z_SCOPE_BENCHMARK_OCI_IMAGE", "")
            proxy_container = os.environ.get(
                "Z_SCOPE_BENCHMARK_OCI_MODEL_PROXY_CONTAINER", ""
            )
            internal_network = os.environ.get("Z_SCOPE_BENCHMARK_OCI_NETWORK", "")
            egress_network = os.environ.get(
                "Z_SCOPE_BENCHMARK_OCI_EGRESS_NETWORK", ""
            )
            if runtime != "podman" or not all(
                (image_ref, proxy_container, internal_network, egress_network)
            ):
                raise SystemExit(2)
            candidate = os.environ["P6_CANDIDATE_COMMIT"]
            candidate_tree = subprocess.run(
                ["git", "rev-parse", "HEAD^{tree}"],
                cwd=os.environ["P6_CANDIDATE_ROOT"],
                check=True,
                capture_output=True,
                text=True,
                encoding="utf-8",
                env={"PATH": os.environ.get("PATH", "")},
            ).stdout.strip()
            request = ProxyProvisionRequest(
                runtime=runtime,
                image_ref=image_ref,
                internal_network=internal_network,
                egress_network=egress_network,
                proxy_container=proxy_container,
                relay_path=control / "scripts/p6_tcp_relay.py",
                image_provenance_path=image_path,
            )
            payload = build_expected_proxy_attestation(
                request=request,
                provider_contract=contract,
                toolchain_evidence_path=toolchain_path,
                proxy_provision_path=proxy_path,
                expected_lineage={
                    "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                    "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                    "attempt_id": os.environ["P6_ATTEMPT_ID"],
                    "control_plane_commit": os.environ["P6_CONTROL_PLANE_COMMIT"],
                    "candidate_sha256": hashlib.sha256(candidate.encode("utf-8")).hexdigest(),
                    "candidate_git_sha": candidate,
                    "candidate_git_tree": candidate_tree,
                    "provider_identity_sha256": contract.identity_sha256,
                    "image_ref": image_ref,
                    "image_id": toolchain.get("image_id"),
                    "proxy_container": proxy_container,
                    "proxy_container_id": receipt.get("proxy_container_id"),
                    "network_name": internal_network,
                    "egress_network_name": egress_network,
                    "network_policy_sha256": policy.policy_sha256,
                    "endpoint_origin": policy.endpoint_origin,
                },
                output=output,
            )
            if validate_expected_proxy_attestation(payload) != payload:
                raise SystemExit(2)
            encoded = read_regular_file_once(output.absolute())
            metadata = output.lstat()
            if (
                not stat.S_ISREG(metadata.st_mode)
                or metadata.st_nlink != 1
                or metadata.st_size != len(encoded)
                or (os.name == "posix" and metadata.st_mode & 0o077)
            ):
                raise SystemExit(2)
            output = revalidate_regular_file(control, output)
            file_sha = hashlib.sha256(encoded).hexdigest()
            with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as handle:
                handle.write(f"Z_SCOPE_BENCHMARK_EXPECTED_PROXY_ATTESTATION_FILE={output}\n")
                handle.write(
                    "Z_SCOPE_BENCHMARK_EXPECTED_PROXY_ATTESTATION_SHA256="
                    f"{file_sha}\n"
                )
            return output, file_sha


        control = Path.cwd().resolve()
        paths = discover_regular_files(
            control, os.environ["P6_SANITIZED_ARTIFACT_PATHS"].splitlines()
        )
        attestation_output: Path | None = None
        if any(
            os.environ[name]
            for name in (
                "P6_TOOLCHAIN_EVIDENCE_PATH",
                "P6_IMAGE_PROVENANCE_PATH",
                "P6_PROXY_PROVISION_PATH",
                "P6_EXPECTED_PROXY_ATTESTATION_PATH",
            )
        ):
            attestation_output, _ = write_expected_proxy_attestation(control)
        libdir_value = sysconfig.get_config_var("LIBDIR")
        if not isinstance(libdir_value, str) or not libdir_value:
            raise SystemExit(2)
        libdir = Path(libdir_value).resolve(strict=True)
        if not libdir.is_dir():
            raise SystemExit(2)
        child = {
            "PATH": os.environ.get("PATH", ""),
            "PYTHONPATH": str(control),
            "LD_LIBRARY_PATH": str(libdir),
        }
        encoded_canaries = list(
            derive_p6_artifact_canaries(
                workflow_run_id=os.environ["GITHUB_RUN_ID"],
                workflow_run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
                candidate_git_sha=os.environ["P6_CANDIDATE_COMMIT"],
            )
        )
        source_identity = (
            os.environ.get("P6_SOURCE_RUN_ID"),
            os.environ.get("P6_SOURCE_RUN_ATTEMPT"),
        )
        if any(source_identity):
            if not all(source_identity):
                raise SystemExit(2)
            encoded_canaries.extend(
                derive_p6_artifact_canaries(
                    workflow_run_id=str(source_identity[0]),
                    workflow_run_attempt=int(str(source_identity[1])),
                    candidate_git_sha=os.environ["P6_CANDIDATE_COMMIT"],
                )
            )
        require_key = strict_bool("P6_SANITIZED_ARTIFACT_REQUIRE_KEY")
        byte_scan_only = strict_bool("P6_SANITIZED_ARTIFACT_BYTE_SCAN_ONLY")
        if require_key:
            key_file = Path(os.environ["Z_SCOPE_P6_API_KEY_FILE"])
            scanner_environment = load_explicit_api_key_file(key_file)
            encoded_canaries.extend(
                value.encode("utf-8") for value in scanner_environment.values()
            )
        encoded_canaries.extend(
            value.encode("utf-8")
            for name in (
                "ANTHROPIC_API_KEY",
                "ANTHROPIC_AUTH_TOKEN",
                "CLAUDE_CODE_OAUTH_TOKEN",
                "DEEPSEEK_API_KEY",
                "CODEX_API_KEY",
                "OPENAI_API_KEY",
                "GLM_API_KEY",
                "ZHIPUAI_API_KEY",
                "ARK_API_KEY",
                "VOLCENGINE_API_KEY",
                "DASHSCOPE_API_KEY",
                "AZURE_OPENAI_API_KEY",
                "GOOGLE_API_KEY",
            )
            if (value := os.environ.get(name))
        )
        encoded_canaries = tuple(dict.fromkeys(value for value in encoded_canaries if value))
        if any(
            canary in value.encode("utf-8")
            for canary in encoded_canaries
            for value in child.values()
        ):
            raise SystemExit(2)
        scan_paths = (*paths, *((attestation_output,) if attestation_output else ()))
        for path in scan_paths:
            if any(canary in os.fsencode(path) for canary in encoded_canaries):
                raise SystemExit(2)
            scan_regular_artifact_tree_for_canaries(path, canaries=encoded_canaries)
            path = revalidate_regular_file(control, path)
            if byte_scan_only:
                continue
            relative = path.relative_to(control).as_posix()
            # Reviewer packet/decision/raw-envelope files have their own strict
            # validator. In particular, the raw envelope intentionally contains
            # one bounded `stdout` decision string, which the generic answer-free
            # key gate must not reinterpret as hidden model output.
            if "/payload/reviews/" in f"/{relative}":
                continue
            completed = subprocess.run(
                [
                    sys.executable,
                    "scripts/p6_pilot_protocol.py",
                    "validate-answer-free",
                    "--input",
                    str(path),
                ],
                cwd=control,
                env=child,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
                check=False,
            )
            if completed.returncode != 0:
                raise SystemExit(2)
        PY
        then
          echo "::error::stage=${P6_SANITIZED_ARTIFACT_STAGE}; class=artifact_integrity_failure:1; count=1"
          exit 2
        fi
