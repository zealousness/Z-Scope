[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zscope"
dynamic = ["version"]
description = "Z-SCOPE: AI-powered defect detection for C/C++ and Java projects"
readme = "README.md"
# Python compatibility and the linked SQLite runtime are independent on Linux.
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Z-SCOPE Team"}
]
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser-test = ["playwright>=1.49.0"]
java = [
    "cpgqls-client>=0.0.5",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black==25.11.0",
    "mypy==1.19.1",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.scripts]
zscope = "zscope.cli.cli:main"
zscope-init = "zscope.cli.init:main"
zscope-doctor = "zscope.cli.doctor:main"
zscope-index-audit = "zscope.cli.index_audit:main"
zscope-config = "zscope.cli.config_cli:main"
zscope-rules = "zscope.cli.rules:main"
zscope-maven-cache = "zscope.cli.maven_cache:main"
zscope-wiki = "zscope.cli.wiki:main"
zscope-benchmark = "zscope.cli.benchmark:main"

# sqlite3 is part of Python's standard library and therefore is not a pip
# dependency. This constrains the SQLite library reported by
# ``sqlite3.sqlite_version``. Persistent stores intentionally use SQL syntax
# available in the oldest supported SQLite runtime.
[tool.zscope.runtime-requirements]
sqlite = ">=3.8.10.2"

[tool.setuptools.packages.find]
include = ["zscope*"]

[tool.setuptools.package-data]
zscope = [
    "retrieval/compiler_argument_policy.json",
    "benchmarking/*.json",
    "config/*.yaml",
    "rules/*.yaml",
    "rules/qualification_evidence/*.json",
    "agents/*/AGENT.md",
    "skills/*/SKILL.md",
    "skills/*/references/*.md",
    "semantics/*.yaml",
    "workflows/*.yaml",
    "wiki/schemas/*.json",
    "web/static/*.html",
    "web/static/*.js",
    "web/static/*.css",
    "web/static/vendor/*",
]

[tool.setuptools.dynamic]
version = {attr = "zscope._version.__version__"}

[tool.black]
line-length = 100
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["click", "click.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
