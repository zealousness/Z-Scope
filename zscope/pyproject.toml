[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zscope"
version = "0.1.0"
description = "Z-SCOPE: AI-powered defect detection for C projects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Z-SCOPE Team"}
]
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "libclang>=16.0.0; platform_system != 'Windows'",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
zscope = "zscope.cli:main"

[tool.setuptools.packages.find]
include = ["zscope*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
