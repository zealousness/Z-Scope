  models:
    - Qwen/Qwen3-Coder-480B-A35B-Instruct
    - Qwen/Qwen3-Coder-30B-A3B-Instruct
  api_key: sk-bsmfjfhzehkxvollbeazfgswoxytcvitdsqnivbyjnnipnbg
  temperature: 0.1
  max_tokens: 4096

project:
  root: ./test/test_c_project_multi
  entry_function: main
  agents:
    - name: semantic_modeler
