<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Z-SCOPE · 交互原型</title><link rel="stylesheet" href="showcase.css"><body>
<div class="demo">交互原型 · 全部数据为合成演示 · 不连接服务器或执行扫描 <a href="index.html">查看新旧对照 ↗</a></div>
<div class="demo">本轮新增：工程选择、创建向导与扫描时间计划；问题工作台保留待决。<a href="followup.html#coverage">打开本轮交互原型 ↗</a></div>
<div class="app"><aside><a class="brand" href="#overview">◈ Z-SCOPE</a><p class="caption">代码质量工作空间</p><nav id="navigation"></nav><div class="aside-bottom">DEMO / Linux C++<br>订单处理示例工程</div></aside><main><header><div><p class="eyebrow">演示工程 / order-service</p><h1 id="title"></h1></div><label>场景 <select id="state"><option value="initial">首次使用</option><option value="blocked">准备受阻</option><option value="running">运行中</option><option value="partial">部分完成</option><option value="review" selected>结果复核</option><option value="disconnected">连接失败</option></select></label></header><div id="content"></div></main></div>
<script>
const pages={overview:'项目概览',scans:'扫描任务',issues:'问题工作台',coverage:'覆盖与诊断',settings:'项目设置'},state=document.querySelector('#state'),content=document.querySelector('#content');let selected=0;
const issues=[['高','释放后继续访问订单对象','src/order.c:84','已确认'],['中','错误分支未释放缓冲区','src/parser.c:126','待验证'],['中','业务前提需要确认','src/cache.c:59','条件性']];
function go(page){location.hash=page}function card(t,v,d){return `<article class="card"><p class="caption">${t}</p><strong class="number">${v}</strong><p>${d}</p></article>`}function render(){let page=location.hash.slice(1)||'overview';if(!pages[page])page='overview';document.querySelector('#title').textContent=pages[page];document.querySelector('#navigation').innerHTML=Object.entries(pages).map(([k,v],i)=>`<a href="#${k}" ${k===page?'aria-current="page"':''}><span>0${i+1}</span>${v}</a>`).join('');const s=state.value;let notice=s==='disconnected'?'<div class="notice danger">连接已中断 · 本原型保留当前内容。演示状态切换不会执行网络请求。</div>':s==='blocked'?'<div class="notice">暂时无法启动 · 编译数据库尚未提供。请在项目设置中检查路径。</div>':s==='partial'?'<div class="notice">扫描部分完成 · 2 个编译实例尚未测量。当前结果不代表完整覆盖。</div>':'';
if(page==='overview')content.innerHTML=notice+`<section class="hero"><p class="eyebrow">下一步</p><h2>${s==='running'?'扫描正在进行':s==='initial'?'让第一次扫描顺利开始':s==='blocked'?'完善工程配置':s==='disconnected'?'恢复连接后继续工作':'从证据开始，处理值得关注的问题'}</h2><p>${s==='initial'?'检查工程路径与模型设置，确认准备状态后开始扫描。':'最近结果来自 demo-run-001 · 2026-10-23 09:42 · 合成数据'}</p><button onclick="go('${s==='initial'||s==='blocked'?'settings':s==='running'?'scans':'issues'}')">${s==='initial'||s==='blocked'?'完成项目配置':s==='running'?'查看运行':'处理问题 →'}</button></section><div class="metrics">${card('待处理问题',s==='initial'?'—':'3','系统结论与人工复核分开记录')}${card('最近任务',s==='running'?'运行中':s==='initial'?'尚未开始':'部分完成','演示任务 / demo-run-001')}${card('覆盖状态','未完整测量','2 个实例尚未测量')}</div><section class="card"><h2>项目动态</h2><p>09:42　报告已生成，等待人工复核</p><p>09:40　入口分析完成 8 / 10</p><a href="#coverage">查看覆盖与诊断 →</a></section>`;
if(page==='scans')content.innerHTML=notice+`<div class="split"><section class="card"><p class="eyebrow">新建扫描</p><h2>检查工程，确认本轮参数</h2><label>扫描模式<select><option>快速检查</option><option>夜间扫描</option></select></label><label>本轮停止时间（可选）<input type="datetime-local"></label><p class="caption">时区：Asia/Taipei。本轮停止时间适用于所选模式。</p><div class="notice">${s==='blocked'?'准备检查未通过：缺少 compile_commands.json':'演示检查：工程与配置已识别。工具执行和模型连接仍需真实服务验证。'}</div><button ${s==='blocked'?'disabled':''} onclick="document.querySelector('#scan-note').textContent='演示操作已完成；没有创建真实扫描。'">开始扫描</button><p id="scan-note" role="status"></p></section><section class="card"><p class="eyebrow">最近任务</p><h2>订单服务扫描</h2><span class="pill">${s==='running'?'运行中':'部分完成'}</span><p>入口完成 8 / 10 · 剩余工作未测量</p><progress value="8" max="10"></progress><p>当前阶段：证据验证</p><a href="#issues">查看已有结果 →</a><hr><h3>活动记录</h3><p>09:42　已验证入口 process_order</p><p>09:40　开始分析第 8 个入口</p></section></div>`;
if(page==='issues')content.innerHTML=notice+`<div class="toolbar"><input aria-label="搜索问题" placeholder="搜索问题、文件或函数" oninput="document.querySelectorAll('.issue-button').forEach(x=>x.hidden=!x.textContent.includes(this.value))"><select aria-label="结论筛选"><option>所有未排除问题</option><option>已确认</option><option>待验证</option></select><span class="caption">当前报告 demo-report-001</span></div><div class="issue-layout"><section class="card queue">${issues.map((x,i)=>`<button class="issue-button ${i===selected?'chosen':''}" onclick="selected=${i};render()"><span class="pill ${i===0?'red':''}">${x[0]}</span><b>${x[1]}</b><small>${x[2]} · ${x[3]}</small></button>`).join('')}</section><section class="card detail"><p class="eyebrow">问题 ${selected+1} / 3 · 合成演示</p><h2>${issues[selected][1]}</h2><p><span class="pill red">${issues[selected][3]}</span>　${issues[selected][2]}</p><h3>发生了什么</h3><p>对象在释放后仍由当前路径访问，可能导致不可靠的读取结果。请结合实际编译变体与业务前提复核。</p><h3>关键证据</h3><pre><code>81  order_t *order = create_order();\n82  release_order(order);\n83  // 错误路径继续访问原对象\n84  return order->status;</code></pre><h3>修复建议</h3><p>调整对象拥有权，在最后一次使用后释放，并检查失败分支。</p><details><summary>构建与报告身份</summary><p>demo-build-debug · demo-run-001 · demo-report-001</p></details><h3>人工复核</h3><label>复核意见<textarea placeholder="记录你的判断与依据"></textarea></label><button onclick="document.querySelector('#review-status').textContent='演示复核已记录在当前页面；未写入产品。'">保存复核</button><span id="review-status" role="status"></span><details><summary>业务回答与处理处置</summary><p>实际产品中分别保存，避免混淆保存范围。</p></details></section></div>`;
if(page==='coverage')content.innerHTML=notice+`<div class="metrics">${card('分析入口','8 / 10','2 个入口尚未完成')}${card('覆盖状态','不完整','不能据此判断工程安全')}${card('已记录缺口','2','缺口数量与测量状态分别展示')}</div><section class="card"><h2>需要关注的范围</h2><table><thead><tr><th>编译实例</th><th>状态</th><th>原因</th></tr></thead><tbody><tr><td>order.c / debug</td><td>已测量</td><td>当前输入已核对</td></tr><tr><td>parser.c / release</td><td>未测量</td><td>工具执行未完成</td></tr><tr><td>cache.c / release</td><td>待重建</td><td>输入已变化</td></tr></tbody></table><details><summary>工具与运行诊断</summary><p>演示环境：Linux C/C++，具体工具可用性需由服务端检查。</p></details></section>`;
if(page==='settings')content.innerHTML=notice+`<section class="card narrow"><p class="eyebrow">工程设置</p><h2>配置清楚，执行可预期</h2><label>工程名称<input value="order-service"></label><label>工程根目录<input value="/demo/order-service"></label><label>语言<select><option>C / C++</option><option>Java</option></select></label><label>编译数据库<input placeholder="compile_commands.json" value="compile_commands.json"></label><label>模型配置<input value="default（示例）"></label><details><summary>高级设置</summary><p>focus、reproduction、max_workers、platform：仅保存，当前执行不使用。实际约束以服务端能力为准。</p></details><button onclick="document.querySelector('#setting-status').textContent='演示配置已检查；没有保存到工程。'">保存并检查配置</button><p id="setting-status" role="status"></p></section>`;
}state.onchange=render;window.onhashchange=render;render();
</script></body></html>
