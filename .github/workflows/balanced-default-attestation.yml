name: Balanced Default Attestation

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Frozen scanner commit covered by the independent evidence
        required: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the frozen attestation verifier
        run: |
          python3 -m pip install --require-hashes -r requirements/constraints/py313.txt
          python3 -m pip install --no-deps -e .
      - name: Export independently held sealed, public-external, and shadow evidence
        env:
          Z_SCOPE_BALANCED_DEFAULT_ATTESTATION: ${{ vars.Z_SCOPE_BALANCED_DEFAULT_ATTESTATION }}
        run: |
          test -n "$Z_SCOPE_BALANCED_DEFAULT_ATTESTATION"
          python3 scripts/verify_balanced_default_attestation.py \
            --attestation "$Z_SCOPE_BALANCED_DEFAULT_ATTESTATION" \
            --release-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --reject-under "$GITHUB_WORKSPACE" \
            --output release-evidence/balanced-default-attestation.json
      - uses: actions/upload-artifact@v7
        with:
          name: balanced-default-${{ inputs.git_sha }}
          path: release-evidence/balanced-default-attestation.json
          if-no-files-found: error
          retention-days: 90
