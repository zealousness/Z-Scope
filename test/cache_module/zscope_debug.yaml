# Debug Config - Using local Ollama LLM
llm:
  provider: openai
  base_url: http://localhost:11434/v1
  models:
    - alibayram/Qwen3-30B-A3B-Instruct-2507:latest
  temperature: 0.1
  max_tokens: 16384

project:
  root: .
  entry_functions_list: batch_scan_debug.json
  agents:
    - name: vulnerability_analyzer
      task: "分析 C 语言代码中的内存安全、逻辑漏洞、资源泄露和并发安全性。"
      enabled: true

indexing:
  backend: regex

analysis:
  max_recursion_depth: 3
  max_function_lines: 600
  max_tool_iterations: 50
  snapshot_dir: .zscope_snapshots_debug
  enable_snapshot_cache: false
  parallel_workers: 1
