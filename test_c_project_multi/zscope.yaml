# ZScope Configuration for Multi-file Test Project

llm:
  provider: ollama
  base_url: http://localhost:11434/v1
  model: alibayram/Qwen3-30B-A3B-Instruct-2507:latest
  api_key: ""
  temperature: 0.1
  max_tokens: 4096

project:
  root: ./test_c_project_multi
  entry_function: main
  task: "Analyze for memory leaks, buffer overflows, and resource management issues across multiple files"
  compile_commands: compile_commands.json

indexing:
  backend: libclang
  ccls_config: .ccls
  ccls_path: ccls

analysis:
  max_recursion_depth: 5  # Higher for cross-file analysis
  max_function_lines: 500
  max_tool_iterations: 100  # More iterations for complex projects
  snapshot_dir: .zscope_snapshots
  enable_snapshot_cache: true
