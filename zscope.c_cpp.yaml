# Z-SCOPE C/C++ 配置 v3。复制为目标项目的 zscope.yaml 后修改。
# 本 YAML 所在目录就是唯一工程根，不允许 project.root/source_root。
# 所有项目相对路径基于该目录，从任意工作目录加载都指向同一工程。
# 所有字符串支持 ${VAR} 环境变量展开；字段合法性以 zscope-config validate 为准。
config_version: 3

llms:
  # profile 表：default 必需，可再定义命名 profile；v3 按原样保留全部 profile。
  default:
    base_urls: ["${Z_SCOPE_LLM_BASE_URL}"] # OpenAI 兼容 endpoint；多个时最闲优先分流，故障端点自动冷却
    models: ["${Z_SCOPE_LLM_MODEL}"] # 候选模型，按序回退
    api_key: "${Z_SCOPE_API_KEY}" # 环境变量缺失时加载即报错
    max_tokens: 8192 # 单次响应长度上限；不是 scan-wide token 预算。
    base_url_max_concurrent_requests: 4 # 单个 endpoint 并发在途请求上限

project:
  language: c_cpp # 只能是 c_cpp 或 java
  platform: linux_user # 当前仅接受 linux_user；平台专属行为尚未接线
  semantics_file: zscope.semantics.yaml # 唯一人工维护的项目原语/接口语义；扫描前须完成 discovery 与复核
  targets:
    # 每个构建目标保留自身身份；当前执行链一次只消费一个目标：
    # 多目标文档可以保存、校验和准备，但启动扫描会被明确拒绝。
    - id: main
      compile_commands: build/compile_commands.json # 相对本 YAML 所在目录；C/C++ 必填

scan:
  preset: fast # 默认 fast； fast=快速；balanced=均衡；deep=深度，不启用实验。
  # focus: [memory, resources, async_lifecycle] # 已校验保留；尚未驱动 Skill 领域选择
  # reproduction: auto # 声明复现意图；不启用内部动态复现实验

execution:
  # 以下字段声明后仅解析与展示，不伪装启用：时窗只解析为本轮一次绝对停止边界，
  # 不创建周期任务；S08 作业调度与并发预算的消费尚未接线。
  # timezone: Asia/Taipei # stop_at 必须与 timezone 同时声明
  # stop_at: "08:00" # 本地 HH:MM；夏令时歧义/不存在的时间会被拒绝
  # max_workers: 4 # 声明并发预算；当前使用既有默认并发
