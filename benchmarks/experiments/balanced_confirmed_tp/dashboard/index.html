<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">

<style>
:root{--bg:#0f1420;--card:#171e2e;--ink:#e8edf7;--mut:#93a0b8;--acc:#5aa2ff;--ok:#3ddc97;--warn:#ffcc66;--bad:#ff6b81;--line:#26314a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI",system-ui,sans-serif}
header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px}
header h1{font-size:19px;margin:0}header .sub{color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;padding:10px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
nav button.on{color:var(--ink);border-color:var(--acc);background:#1b2345}
main{padding:20px 26px;max-width:1280px}
section{display:none}section.on{display:block}
h2{font-size:15px;margin:22px 0 10px;color:var(--acc)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .k{color:var(--mut);font-size:12px}.card .v{font-size:24px;font-weight:600;margin-top:2px}
.card .d{font-size:12px;color:var(--mut);margin-top:2px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;background:#1b2338}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px}
.ok{background:#123b2e;color:var(--ok)}.warn{background:#3b3212;color:var(--warn)}.bad{background:#3b1620;color:var(--bad)}.info{background:#12283b;color:var(--acc)}
.bar{height:8px;border-radius:6px;background:#22304d;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
.small{color:var(--mut);font-size:12px}
code{background:#111827;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
</style></head><body>

function tbl(head,rows,cls=""){return `<table class="${cls}"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>`+
  rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")+"</table>";}
function pill(v){const cls=v.includes("完成")||v.startsWith("0")||v.includes("无损")?"ok":(v.includes("进行")||v.includes("部分")?"warn":"info");return `<span class="pill ${cls}">${v}</span>`;}

function vScore(){

   for(const sc of ["v2","v1"]){for(const vw of ["default","with_needs_review"]){const m=r[sc][vw];
