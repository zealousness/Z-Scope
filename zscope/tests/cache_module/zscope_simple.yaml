# Simplified ZScope Configuration - Focus on ONE defect at a time

llm:
  provider: ollama  
  base_url: http://host.docker.internal:11434/v1
  model: alibayram/Qwen3-30B-A3B-Instruct-2507:latest
  api_key: ""
  temperature: 0.1 
  max_tokens: 8192  

project:
  root: .
  entry_function: cache_get 
  task: |
    MISSION: Find the BUFFER OVERFLOW defect in cache_get() function.
    
    Analyze the cache_get() function line by line.
    
    **SPECIFIC DEFECT TO FIND:**
    The function copies data using memcpy(value_out, node->value, node->value_size)
    BUT it does NOT check if buffer_size >= node->value_size first!
    
    This means if the caller provides a small buffer (e.g. 10 bytes) but the cached value 
    is large (e.g. 100 bytes), memcpy will write 100 bytes into a 10-byte buffer,
    causing HEAP CORRUPTION.
    
    **REQUIRED OUTPUT:**
    You MUST output a JSON final_report with at least ONE issue describing this buffer overflow.
    
    Example:
    ```json
    {
      "type": "final_report",
      "entry_function": "cache_get",
      "overall_verdict": "issues_found",
      "issues": [
        {
          "id": "DEFECT_1",
          "function": "cache_get",
          "location": "src/cache_core.c:165",
          "category": "reliability",
          "subcategory": "buffer_overflow",
          "description": "memcpy copies node->value_size bytes without checking if buffer_size is large enough",
          "root_cause": "Missing bounds check before memcpy",
          "suggested_fix": "Add check: if (buffer_size < node->value_size) return -1; OR use min(buffer_size, node->value_size)",
          "confidence": 0.95,
          "impact_level": "critical"
        }
      ]
    }
    ```
  
  compile_commands: compile_commands.json

indexing:
  backend: libclang  

analysis:
  max_recursion_depth: 2  # Minimal - just analyze cache_get itself
  max_function_lines: 500 
  max_tool_iterations: 50  # Fewer iterations for focused analysis
  snapshot_dir: .zscope_snapshots_simple
  enable_snapshot_cache: false
