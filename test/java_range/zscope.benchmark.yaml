# Canonical Java Range benchmark configuration. Runtime entries contain no
# expected rule, CWE, truth ID, or audit-hint metadata.
config_version: 3

llms:
  default:
    base_urls: ["${Z_SCOPE_LLM_BASE_URL}"]
    models: ["${Z_SCOPE_LLM_MODEL}"]
    api_key: ${Z_SCOPE_API_KEY}
    base_url_max_concurrent_requests: 4
    max_tokens: 8192
    max_retries: 4
    retry_until_available: true
    timeout: 120

project:
  language: java
  targets:
    - id: main
  entry_functions_list: benchmark/entries.json
  entry_discovery:
    enabled: false
    search_root: .
    interface_files: ["src/**/*.java"]
    max_entries: 200
    max_functions: 10000

scan:
  preset: fast
  # Empty activates every Java-applicable Skill; non-empty text narrows focus.
  task: ""

indexing:
  backend: java_unified
  java:
    structure_frontend: auto
    signals: [joern]

concurrency:
  entry_workers: 4
  validator_workers: 2
  investigator_workers: 1
  evidence_completion_workers: 2
  index_workers: 4
  llm_max_inflight: 4
