  qualification_seal:
    name: conservation and qualification seal
    needs: [provider_probe, toolchain_oci, offline_qualification, cold_fast, cold_balanced, cold_deep]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore exact same-run artifacts with metadata digest and safe-ZIP validation
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER_ID: ${{ needs.provider_probe.outputs.artifact_id }}
          PROVIDER_DIGEST: ${{ needs.provider_probe.outputs.artifact_digest }}
          TOOLCHAIN_ID: ${{ needs.toolchain_oci.outputs.artifact_id }}
          TOOLCHAIN_DIGEST: ${{ needs.toolchain_oci.outputs.artifact_digest }}
          OFFLINE_ID: ${{ needs.offline_qualification.outputs.artifact_id }}
          OFFLINE_DIGEST: ${{ needs.offline_qualification.outputs.artifact_digest }}
          FAST_ID: ${{ needs.cold_fast.outputs.artifact_id }}
          FAST_DIGEST: ${{ needs.cold_fast.outputs.artifact_digest }}
          BALANCED_ID: ${{ needs.cold_balanced.outputs.artifact_id }}
          BALANCED_DIGEST: ${{ needs.cold_balanced.outputs.artifact_digest }}
          DEEP_ID: ${{ needs.cold_deep.outputs.artifact_id }}
          DEEP_DIGEST: ${{ needs.cold_deep.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          for value in "$PROVIDER_ID" "$TOOLCHAIN_ID" "$OFFLINE_ID" "$FAST_ID" "$BALANCED_ID" "$DEEP_ID"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done
          for value in "$PROVIDER_DIGEST" "$TOOLCHAIN_DIGEST" "$OFFLINE_DIGEST" "$FAST_DIGEST" "$BALANCED_DIGEST" "$DEEP_DIGEST"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'source-free deepseek-v4-flash provider probe' --artifact-id "$PROVIDER_ID" \
            --artifact-name "p6-provider-probe-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$PROVIDER_DIGEST" --required-member provider-probe.json \
            --output-dir restored/provider
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'toolchain OCI and cold-cache preflight' --artifact-id "$TOOLCHAIN_ID" \
            --artifact-name "p6-toolchain-oci-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$TOOLCHAIN_DIGEST" --required-member toolchain-evidence.json \
            --output-dir restored/toolchain
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'seal P6 offline evidence' \
            --artifact-id "$OFFLINE_ID" --artifact-name "p6-offline-evidence-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$OFFLINE_DIGEST" --required-member offline-evidence.json \
            --output-dir restored/offline
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'one isolated cold fast pilot' --artifact-id "$FAST_ID" \
            --artifact-name "p6-cold-fast-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$FAST_DIGEST" --required-member p6-fast-projection.json \
            --output-dir restored/fast
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'one isolated cold balanced pilot' --artifact-id "$BALANCED_ID" \
            --artifact-name "p6-cold-balanced-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$BALANCED_DIGEST" --required-member p6-balanced-projection.json \
            --output-dir restored/balanced
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'one isolated cold deep pilot' --artifact-id "$DEEP_ID" \
            --artifact-name "p6-cold-deep-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$DEEP_DIGEST" --required-member p6-deep-projection.json \
            --output-dir restored/deep
      - name: Revalidate conservation and select one producer per depth
        run: |
          set -euo pipefail
          candidate_sha="$(printf %s "$P6_CANDIDATE_COMMIT" | sha256sum | awk '{print $1}')"
          policy_sha="$(sha256sum zscope/benchmarking/benchmark_policy.v2.json | awk '{print $1}')"
          provider_probe_sha="$(sha256sum restored/provider/provider-probe.json | awk '{print $1}')"
          offline_sha="$(sha256sum restored/offline/offline-evidence.json | awk '{print $1}')"
          toolchain_sha="$(sha256sum restored/toolchain/toolchain-evidence.json | awk '{print $1}')"
          fast_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:fast" | sha256sum | awk '{print $1}')"
          balanced_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:balanced" | sha256sum | awk '{print $1}')"
          deep_cache="$(printf %s "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:deep" | sha256sum | awk '{print $1}')"
          python3 scripts/p6_pilot_protocol.py seal-qualification \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --fast restored/fast/p6-fast-projection.json \
            --balanced restored/balanced/p6-balanced-projection.json \
            --deep restored/deep/p6-deep-projection.json \
            --fast-cache-sha256 "$fast_cache" \
            --balanced-cache-sha256 "$balanced_cache" \
            --deep-cache-sha256 "$deep_cache" \
            --candidate-sha256 "$candidate_sha" \
            --policy-sha256 "$policy_sha" \
            --provider-probe restored/provider/provider-probe.json \
            --provider-probe-sha256 "$provider_probe_sha" \
            --offline-evidence restored/offline/offline-evidence.json \
            --offline-evidence-sha256 "$offline_sha" \
            --toolchain-evidence restored/toolchain/toolchain-evidence.json \
            --toolchain-evidence-sha256 "$toolchain_sha" \
            --attempt-id "$P6_ATTEMPT_ID" \
            --output qualification.json
      - uses: ./control/.github/actions/validate-p6-artifact
        with:
          paths: qualification.json
          stage: artifact_seal
      - uses: ./control/.github/actions/upload-artifact-retry
        id: upload
        with:
          name: p6-qualification-${{ env.P6_CONTROL_PLANE_COMMIT }}-${{ env.P6_CANDIDATE_COMMIT }}-${{ github.run_attempt }}
          path: control/qualification.json
      - uses: ./control/.github/actions/classify-p6-job-failure
        id: classify
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          execution-stage: qualification_seal
          default-class: accounting_conservation_failure

  product_architecture_review:
    name: independent product architecture review
    needs: [qualification_seal, entry]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 720
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      failure_class: ${{ steps.classify.outputs.failure-class }}
      failure_count: ${{ steps.classify.outputs.failure-count }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CONTROL_PLANE_COMMIT }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as untrusted read-only input
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P6_CANDIDATE_COMMIT }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: ./control/.github/actions/setup-p6-python
        with:
          checkout-path: control
      - name: Restore the exact qualification artifact
        env:
          Z_SCOPE_P6_ENVIRONMENT: sealed-benchmark
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.qualification_seal.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.qualification_seal.outputs.artifact_digest }}
          ENTRY_ID: ${{ needs.entry.outputs.artifact_id }}
          ENTRY_DIGEST: ${{ needs.entry.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ENTRY_ID" =~ ^[0-9]+$ ]]
          [[ "$ENTRY_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'conservation and qualification seal' --artifact-id "$ARTIFACT_ID" \
            --artifact-name "p6-qualification-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$ARTIFACT_DIGEST" --required-member qualification.json \
            --output-dir packet/evidence
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" \
            --candidate-commit "$P6_CANDIDATE_COMMIT" \
            --producer-job 'P6 entry and provider identity' --artifact-id "$ENTRY_ID" \
            --artifact-name "p6-entry-evidence-${P6_CONTROL_PLANE_COMMIT}-${P6_CANDIDATE_COMMIT}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-digest "sha256:$ENTRY_DIGEST" --required-member entry-evidence.json \
            --output-dir packet/entry
      - name: Build the product-architecture packet without reviewer credentials
        run: |
          set -euo pipefail
