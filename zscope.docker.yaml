# ZScope Docker Configuration
# Optimized for running ZScope in Docker containers

llm:
  provider: ollama
  
  # Use host.docker.internal to access host machine's Ollama
  # On Linux with --network host, use localhost:11434
  base_url: http://host.docker.internal:11434/v1
  
  model: alibayram/Qwen3-30B-A3B-Instruct-2507:latest
  api_key: ""
  temperature: 0.1
  max_tokens: 4096
  timeout: 120
  max_retries: 3

project:
  root: /app/test_c_project
  entry_function: process_data_packet
  task: "Analyze for memory leaks, buffer overflows, and resource leaks"
  compile_commands: compile_commands.json

indexing:
  backend: ccls  # CCLS is installed in Docker
  ccls_config: .ccls
  ccls_path: ccls

analysis:
  max_recursion_depth: 3
  max_function_lines: 500
  max_tool_iterations: 50
  snapshot_dir: /app/output/.zscope_snapshots
  enable_snapshot_cache: true
