name: Z-SCOPE 2.0 Design Evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zscope-2-design-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-design-evidence:
    name: Validate design and acceptance evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check hashes, Git bindings, phase gates, and review state
        run: python scripts/check_zscope_2_design_evidence.py
