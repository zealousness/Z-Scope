# Z-SCOPE Configuration for Cache Module Verification

llm:
  provider: openai
  base_url: http://localhost:11434/v1
  models:
    - alibayram/Qwen3-30B-A3B-Instruct-2507:latest
  api_key: ollama
  temperature: 0.1
  max_tokens: 16384

# project:
#   root: .
#   entry_function: cache_create
#   entry_functions_list: batch_scan.json
project:
  root: .
  source_root: .
  # entry_function: cache_create  # Now optional in batch mode
  entry_functions_list: batch_scan.json
  agents:
    - name: semantic_modeler
      enabled: true
    - name: vulnerability_analyzer
      task: "分析 C 语言代码中的内存安全、逻辑漏洞、资源泄露和并发安全性。"
      enabled: true
    - name: validator_agent
      enabled: true  # Set to false to skip validation step

indexing:
  backend: clangd
  auto_prime: true
  only_prime_priority: true
  max_prime_files: 50
  clangd_path: "C:\\Program Files\\LLVM\\bin\\clangd.exe"

analysis:
  max_recursion_depth: 3
  max_function_lines: 600
  max_tool_iterations: 100
  snapshot_dir: .zscope_snapshots_test
  enable_snapshot_cache: true
  parallel_workers: 1
