name: Formal Benchmark

on:
  workflow_dispatch:
    inputs:
      language:
        type: choice
        options: [cpp, java]
        required: true
      git_sha:
        description: Protected commit SHA to evaluate
        required: true

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, zscope-benchmark]
    environment: formal-benchmark
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_sha }}
      - name: Resolve canonical benchmark SHA
        id: benchmark-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run five isolated cold starts
        env:
          Z_SCOPE_API_KEY: ${{ secrets.Z_SCOPE_BENCHMARK_API_KEY }}
          Z_SCOPE_CPP_HEALTH_COMMAND: ${{ vars.Z_SCOPE_CPP_HEALTH_COMMAND }}
          Z_SCOPE_CPP_SCAN_COMMAND: ${{ vars.Z_SCOPE_CPP_SCAN_COMMAND }}
          Z_SCOPE_CPP_SCORE_COMMAND: ${{ vars.Z_SCOPE_CPP_SCORE_COMMAND }}
          Z_SCOPE_JAVA_HEALTH_COMMAND: ${{ vars.Z_SCOPE_JAVA_HEALTH_COMMAND }}
          Z_SCOPE_JAVA_SCAN_COMMAND: ${{ vars.Z_SCOPE_JAVA_SCAN_COMMAND }}
          Z_SCOPE_JAVA_SCORE_COMMAND: ${{ vars.Z_SCOPE_JAVA_SCORE_COMMAND }}
        run: >-
          python3 scripts/run_formal_benchmark.py
          --language '${{ inputs.language }}'
          --runs 5
          --output benchmark-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formal-${{ inputs.language }}-${{ steps.benchmark-source.outputs.sha }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 90
