resource_families:
  file:
    acquire: [fopen, fdopen, freopen]
    release: [fclose]
  directory:
    acquire: [opendir]
    release: [closedir]
  malloc:
    acquire: [malloc, calloc, realloc, strdup, strndup]
    release: [free]
  new_scalar:
    acquire: [new]
    release: [delete]
  new_array:
    acquire: [new_array]
    release: [delete_array]
  descriptor:
    acquire: [open, creat, socket, accept]
    release: [close]
  mutex:
    acquire: [pthread_mutex_lock, pthread_mutex_trylock]
    release: [pthread_mutex_unlock]
  rwlock:
    acquire: [pthread_rwlock_rdlock, pthread_rwlock_wrlock]
    release: [pthread_rwlock_unlock]
  spinlock:
    acquire: [spin_lock]
    release: [spin_unlock]
  c11_mutex:
    acquire: [mtx_lock]
    release: [mtx_unlock]
api_roles:
  allocators:
    - malloc
  calloc_allocators:
    - calloc
  reallocators:
    - realloc
  deallocators:
    - free
  copy_sinks:
    - memcpy
    - memmove
    - read
    - recv
    - fread
    - send
    - write
  lock_apis:
    - pthread_mutex_lock
    - pthread_mutex_trylock
    - pthread_rwlock_rdlock
    - pthread_rwlock_wrlock
    - spin_lock
    - mtx_lock
  unlock_apis:
    - pthread_mutex_unlock
    - pthread_rwlock_unlock
    - spin_unlock
    - mtx_unlock
  io_acquirers:
    - open
    - fopen
    - creat
    - socket
    - accept
  io_releasers:
    - close
    - fclose
    - closesocket
    - munmap
  send_sinks:
    - send
    - write
    - sendto
    - sendmsg
  recv_sources:
    - recv
    - read
    - recvfrom
  format_sinks:
    - printf
    - fprintf
    - syslog
    - vprintf
    - vfprintf
  callback_registrars: []

type_aliases:
  size_t: size_t
  uint8_t: uint8_t
  uint16_t: uint16_t
  uint32_t: uint32_t
  uint64_t: uint64_t
  int16_t: int16_t
  int32_t: int32_t
  int64_t: int64_t
  unsigned_int: unsigned int
  unsigned_long: unsigned long

checker_roles:
  extended_allocators:
    - strdup
    - strndup
  string_copy_sinks:
    - bcopy
    - strcat
    - strncat
    - strcpy
    - strncpy
  extended_lock_apis:
    - pthread_rwlock_rdlock
    - pthread_rwlock_wrlock
    - spin_lock
    - mtx_lock
  extended_unlock_apis:
    - spin_unlock
    - mtx_unlock
  graph_release_apis:
    - free
    - delete
  extended_send_sinks: []
  extended_recv_sources: []
  extended_format_sinks: []
  extended_io_acquirers: []
  extended_io_releasers: []
  extended_callback_registrars: []
