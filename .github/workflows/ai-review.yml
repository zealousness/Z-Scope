name: Advisory AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AI_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate advisory review from PR diff only
        env:
          Z_SCOPE_AI_REVIEW_ENDPOINT: ${{ secrets.Z_SCOPE_AI_REVIEW_ENDPOINT }}
          Z_SCOPE_AI_REVIEW_API_KEY: ${{ secrets.Z_SCOPE_AI_REVIEW_API_KEY }}
          Z_SCOPE_AI_REVIEW_MODEL: ${{ vars.Z_SCOPE_AI_REVIEW_MODEL }}
          Z_SCOPE_AI_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          Z_SCOPE_AI_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ai_review.py --output ai-review.md
      - name: Publish advisory comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ai-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
