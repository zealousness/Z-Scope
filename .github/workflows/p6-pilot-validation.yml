            --artifact-digest "sha256:$HIDDEN_DIGEST" --required-member offline-hidden-holdout.json --output-dir restored/hidden
          python3 scripts/download_p6_run_artifact.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-plane-commit "$P6_CONTROL_PLANE_COMMIT" --candidate-commit "$P6_CANDIDATE_COMMIT" \
