name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.9", lock: "py39"}
          - {python: "3.10", lock: "py310"}
          - {python: "3.11", lock: "py311"}
          - {python: "3.12", lock: "py312"}
          - {python: "3.13", lock: "py313"}
          - {python: "3.14", lock: "py314"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/constraints/${{ matrix.lock }}.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/constraints/${{ matrix.lock }}.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Full tests and CLI smoke
        run: |
          python -m pytest -q
          zscope --version
          zscope-init --help
          zscope-doctor --help
          zscope-rules --help
          zscope-maven-cache --help
      - name: Build and install wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/zscope-*.whl
          python -m pip check

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r requirements/constraints/py313.txt
          python -m pip install --no-deps -e .
      - name: Python 3.9 syntax, typing, formatting, docs, and rule schema
        run: |
          python -m compileall -f -q \
            zscope scripts tests tools test/range/benchmark test/java_range/benchmark
          python scripts/check_mypy_baseline.py
          python scripts/check_black_baseline.py
          python -m pytest -q tests/test_agent_docs.py tests/test_rule_extensions.py tests/test_benchmark_protocol.py

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r requirements/constraints/py313.txt
          python -m pip install --no-deps -e .
      - name: Build and test Java sidecars
        run: |
          for pom in tools/java-*/pom.xml; do mvn -B -f "$pom" test package; done
          python -m pytest -q tests/test_java_*.py

  offline-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: bash scripts/smoke_offline_install.sh

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python scripts/scan_git_history_secrets.py
          python scripts/scan_git_history_secrets.py --current-only

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: true
