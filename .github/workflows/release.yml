name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v{package_version} tag
        required: true
      benchmark_run_id:
        description: Successful Formal Benchmark workflow run ID for the release SHA
        required: true
      balanced_attestation_run_id:
        description: Successful protected Balanced Default Attestation run ID
        required: true

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  release:
    runs-on: [self-hosted, linux, x64, zscope-release]
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify protected tag and package version
        id: release-source
        run: |
          python3 scripts/verify_release_version.py --tag '${{ inputs.tag }}'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Verify formal benchmark workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_RUN_ID: ${{ inputs.benchmark_run_id }}
          ATTESTATION_RUN_ID: ${{ inputs.balanced_attestation_run_id }}
          RELEASE_SHA: ${{ steps.release-source.outputs.sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BENCHMARK_RUN_ID}" --jq .head_sha)" = "$RELEASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BENCHMARK_RUN_ID}" --jq .event)" = "workflow_dispatch"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BENCHMARK_RUN_ID}" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BENCHMARK_RUN_ID}" --jq .path)" = ".github/workflows/formal-benchmark.yml"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ATTESTATION_RUN_ID}" --jq .head_sha)" = "$RELEASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ATTESTATION_RUN_ID}" --jq .event)" = "workflow_dispatch"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ATTESTATION_RUN_ID}" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ATTESTATION_RUN_ID}" --jq .path)" = ".github/workflows/balanced-default-attestation.yml"
      - name: Download immutable C formal benchmark evidence
        uses: actions/download-artifact@v8
        with:
          name: formal-cpp-${{ steps.release-source.outputs.sha }}
          path: release-evidence/formal-cpp
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.benchmark_run_id }}
          digest-mismatch: error
      - name: Download independent balanced-default attestation
        uses: actions/download-artifact@v8
        with:
          name: balanced-default-${{ steps.release-source.outputs.sha }}
          path: release-evidence/balanced-default
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.balanced_attestation_run_id }}
          digest-mismatch: error
      - name: Build four portable assets from locked inputs
        run: |
          python3 scripts/portable_release.py bootstrap
          python3 scripts/portable_release.py fetch
          python3 scripts/portable_release.py build --formal --output dist/release --arm-compiler-helper
          python3 scripts/portable_release.py verify --run-smoke --output dist/release
      - name: Sign verified portable assets
        env:
          Z_SCOPE_RELEASE_PRIVATE_KEY: ${{ secrets.Z_SCOPE_RELEASE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$Z_SCOPE_RELEASE_PRIVATE_KEY" > "$key_file"
          python3 scripts/portable_release.py sign --output dist/release --private-key "$key_file"
      - name: Verify release assets and release-candidate evidence
        run: |
          python3 scripts/portable_release.py verify --formal --output dist/release
          python3 scripts/verify_release_assets.py --asset-dir dist/release
          python3 scripts/evaluate_release_candidate.py \
            --release-sha "$(git rev-parse HEAD)" \
            --tag '${{ inputs.tag }}' \
            --formal-artifact "cpp=$GITHUB_WORKSPACE/release-evidence/formal-cpp" \
            --balanced-default-attestation "$GITHUB_WORKSPACE/release-evidence/balanced-default/balanced-default-attestation.json" \
            --balanced-attestation-workflow-run-id '${{ inputs.balanced_attestation_run_id }}' \
            --asset-dir dist/release \
            --offline-smoke-evidence release-evidence/portable-offline-smoke.json \
            --output dist/release-candidate-audit.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ inputs.tag }}' dist/release/* --draft --verify-tag --generate-notes
