name: Range v16 Independent Review

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit containing the frozen 136 minimal review packets
        required: true
      fable_checkpoint_run_id:
        description: Optional protected run containing a verified Claude primary checkpoint (legacy fable slot)
        required: false
        default: ""
      fable_checkpoint_artifact_id:
        description: Immutable artifact ID for the optional Claude checkpoint
        required: false
        default: ""
      fable_checkpoint_source_sha:
        description: Source SHA bound by the optional Claude checkpoint (defaults to source_sha)
        required: false
        default: ""
      deepseek_checkpoint_run_id:
        description: Optional protected run containing a verified DeepSeek checkpoint
        required: false
        default: ""
      deepseek_checkpoint_artifact_id:
        description: Immutable artifact ID for the optional DeepSeek checkpoint
        required: false
        default: ""
      deepseek_checkpoint_source_sha:
        description: Source SHA bound by the optional DeepSeek checkpoint (defaults to source_sha)
        required: false
        default: ""
      fable_primary_run_id:
        description: Optional protected run containing a complete Claude primary artifact (legacy fable slot)
        required: false
        default: ""
      fable_primary_source_sha:
        description: Source SHA naming the complete Claude primary artifact (defaults to source_sha)
        required: false
        default: ""
      deepseek_primary_run_id:
        description: Optional protected run containing a complete DeepSeek primary artifact
        required: false
        default: ""
      deepseek_primary_source_sha:
        description: Source SHA naming the complete DeepSeek primary artifact (defaults to source_sha)
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  codex_readiness:
    name: codex answer-free readiness
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify frozen Codex runtime
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          codex_version="$(codex --version)"
          printf 'Codex readiness runtime: %s\n' "$codex_version"
          test "$codex_version" = "codex-cli 0.144.4"
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
      - name: Verify Codex auth, reachability, and model access
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          umask 077
          python3 scripts/run_e0_reviewers.py codex-preflight
  primary:
    name: primary (${{ matrix.display_name }})
    needs: codex_readiness
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the fable machine slot/artifact name for protected-protocol compatibility.
          - reviewer: fable
            display_name: claude-glm-5.3
          - reviewer: deepseek
            display_name: deepseek-v4-pro
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify frozen review harnesses
        env:
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          python3 - <<'PY'
          import os, subprocess
          base = os.environ["GITHUB_SHA"]
          source = os.environ["PACKET_SOURCE_SHA"]
          rows = subprocess.run(
              ["git", "diff", "--name-status", base, source],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed_catalog = "test/range/benchmark/v16/review-packet-catalog.json"
          allowed_prefix = "test/range/benchmark/v16/review-packets/"
          invalid = []
          for row in rows:
              status, path = row.split("\t", 1)
              if status not in {"A", "M"} or not (
                  path == allowed_catalog
                  or (path.startswith(allowed_prefix) and path.endswith(".json"))
              ):
                  invalid.append(row)
          if invalid:
              raise SystemExit("untrusted review source changes: " + ", ".join(invalid))
          PY
          claude_version="$(claude --version | awk '{print $1}')"
          codex_version="$(codex --version)"
          dsh_version="$(dsh --version)"
          printf 'reviewer harness versions: claude=%s codex=%s dsh=%s\n' \
            "$claude_version" "$codex_version" "$dsh_version"
          test "$claude_version" = "2.1.233"
          test "$codex_version" = "codex-cli 0.144.4"
          test "$dsh_version" = "0.1.0-rc.6"
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
      - name: Validate primary recovery inputs
        env:
          FABLE_CHECKPOINT_RUN_ID: ${{ inputs.fable_checkpoint_run_id }}
          FABLE_CHECKPOINT_ARTIFACT_ID: ${{ inputs.fable_checkpoint_artifact_id }}
          FABLE_CHECKPOINT_SOURCE_SHA: ${{ inputs.fable_checkpoint_source_sha }}
          DEEPSEEK_CHECKPOINT_RUN_ID: ${{ inputs.deepseek_checkpoint_run_id }}
          DEEPSEEK_CHECKPOINT_ARTIFACT_ID: ${{ inputs.deepseek_checkpoint_artifact_id }}
          DEEPSEEK_CHECKPOINT_SOURCE_SHA: ${{ inputs.deepseek_checkpoint_source_sha }}
          FABLE_PRIMARY_RUN_ID: ${{ inputs.fable_primary_run_id }}
          FABLE_PRIMARY_SOURCE_SHA: ${{ inputs.fable_primary_source_sha }}
          DEEPSEEK_PRIMARY_RUN_ID: ${{ inputs.deepseek_primary_run_id }}
          DEEPSEEK_PRIMARY_SOURCE_SHA: ${{ inputs.deepseek_primary_source_sha }}
        run: |
          set -euo pipefail
          if [[ '${{ matrix.reviewer }}' = fable ]]; then
            checkpoint_run_id="$FABLE_CHECKPOINT_RUN_ID"
            checkpoint_artifact_id="$FABLE_CHECKPOINT_ARTIFACT_ID"
            checkpoint_source_sha="$FABLE_CHECKPOINT_SOURCE_SHA"
            primary_run_id="$FABLE_PRIMARY_RUN_ID"
            primary_source_sha="$FABLE_PRIMARY_SOURCE_SHA"
          else
            checkpoint_run_id="$DEEPSEEK_CHECKPOINT_RUN_ID"
            checkpoint_artifact_id="$DEEPSEEK_CHECKPOINT_ARTIFACT_ID"
            checkpoint_source_sha="$DEEPSEEK_CHECKPOINT_SOURCE_SHA"
            primary_run_id="$DEEPSEEK_PRIMARY_RUN_ID"
            primary_source_sha="$DEEPSEEK_PRIMARY_SOURCE_SHA"
          fi
          if [[ -n "$checkpoint_run_id" && -n "$primary_run_id" ]]; then
            echo "checkpoint and complete primary recovery are mutually exclusive" >&2
            exit 2
          fi
          if [[ -n "$checkpoint_source_sha" && -z "$checkpoint_run_id" ]]; then
            echo "checkpoint source SHA requires a checkpoint run ID" >&2
            exit 2
          fi
          if [[ -n "$checkpoint_run_id" && -z "$checkpoint_artifact_id" ]] || \
             [[ -z "$checkpoint_run_id" && -n "$checkpoint_artifact_id" ]]; then
            echo "checkpoint run ID and immutable artifact ID must be provided together" >&2
            exit 2
          fi
          if [[ -n "$checkpoint_artifact_id" && ! "$checkpoint_artifact_id" =~ ^[0-9]+$ ]]; then
            echo "checkpoint artifact ID must be numeric" >&2
            exit 2
          fi
          if [[ -n "$primary_source_sha" && -z "$primary_run_id" ]]; then
            echo "complete primary source SHA requires a complete primary run ID" >&2
            exit 2
          fi
      - name: Restore verified Fable checkpoint
        if: matrix.reviewer == 'fable' && inputs.fable_checkpoint_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          python3 scripts/download_e0_checkpoint_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id '${{ inputs.fable_checkpoint_artifact_id }}' \
            --expected-run-id '${{ inputs.fable_checkpoint_run_id }}' \
            --expected-source-sha '${{ inputs.fable_checkpoint_source_sha || inputs.source_sha }}' \
            --expected-name 'range-v16-primary-checkpoint-fable-${{ inputs.fable_checkpoint_source_sha || inputs.source_sha }}' \
            --output-dir review-evidence/fable
      - name: Restore verified DeepSeek checkpoint
        if: matrix.reviewer == 'deepseek' && inputs.deepseek_checkpoint_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          python3 scripts/download_e0_checkpoint_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id '${{ inputs.deepseek_checkpoint_artifact_id }}' \
            --expected-run-id '${{ inputs.deepseek_checkpoint_run_id }}' \
            --expected-source-sha '${{ inputs.deepseek_checkpoint_source_sha || inputs.source_sha }}' \
            --expected-name 'range-v16-primary-checkpoint-deepseek-${{ inputs.deepseek_checkpoint_source_sha || inputs.source_sha }}' \
            --output-dir review-evidence/deepseek
      - name: Restore exact complete primary artifact
        if: ${{ (matrix.reviewer == 'fable' && inputs.fable_primary_run_id != '') || (matrix.reviewer == 'deepseek' && inputs.deepseek_primary_run_id != '') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
          FABLE_PRIMARY_RUN_ID: ${{ inputs.fable_primary_run_id }}
          FABLE_PRIMARY_SOURCE_SHA: ${{ inputs.fable_primary_source_sha }}
          DEEPSEEK_PRIMARY_RUN_ID: ${{ inputs.deepseek_primary_run_id }}
          DEEPSEEK_PRIMARY_SOURCE_SHA: ${{ inputs.deepseek_primary_source_sha }}
        run: |
          set -euo pipefail
          umask 077
          reviewer='${{ matrix.reviewer }}'
          if [[ "$reviewer" = fable ]]; then
            primary_run_id="$FABLE_PRIMARY_RUN_ID"
            primary_source_sha="${FABLE_PRIMARY_SOURCE_SHA:-$PACKET_SOURCE_SHA}"
          else
            primary_run_id="$DEEPSEEK_PRIMARY_RUN_ID"
            primary_source_sha="${DEEPSEEK_PRIMARY_SOURCE_SHA:-$PACKET_SOURCE_SHA}"
          fi
          artifact_name="range-v16-primary-$reviewer-$primary_source_sha"
          python3 scripts/download_e0_run_artifacts.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$primary_run_id" \
            --expected-head-sha "$primary_source_sha" \
            --artifact "$artifact_name=retained-primary/$reviewer"
      - name: Revalidate complete primary artifact as a zero-call checkpoint
        if: ${{ (matrix.reviewer == 'fable' && inputs.fable_primary_run_id != '') || (matrix.reviewer == 'deepseek' && inputs.deepseek_primary_run_id != '') }}
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
          FABLE_PRIMARY_RUN_ID: ${{ inputs.fable_primary_run_id }}
          FABLE_PRIMARY_SOURCE_SHA: ${{ inputs.fable_primary_source_sha }}
          DEEPSEEK_PRIMARY_RUN_ID: ${{ inputs.deepseek_primary_run_id }}
          DEEPSEEK_PRIMARY_SOURCE_SHA: ${{ inputs.deepseek_primary_source_sha }}
        run: |
          set -euo pipefail
          umask 077
          if [[ '${{ matrix.reviewer }}' = fable ]]; then
            primary_run_id="$FABLE_PRIMARY_RUN_ID"
            primary_source_sha="${FABLE_PRIMARY_SOURCE_SHA:-$PACKET_SOURCE_SHA}"
          else
            primary_run_id="$DEEPSEEK_PRIMARY_RUN_ID"
            primary_source_sha="${DEEPSEEK_PRIMARY_SOURCE_SHA:-$PACKET_SOURCE_SHA}"
          fi
          python3 scripts/run_e0_reviewers.py checkpoint \
            --reviewer '${{ matrix.reviewer }}' \
            --packet-dir test/range/benchmark/v16/review-packets \
            --retained-dir 'retained-primary/${{ matrix.reviewer }}' \
            --output-dir 'review-evidence/${{ matrix.reviewer }}' \
            --packet-source-sha "$PACKET_SOURCE_SHA" \
            --retained-source-sha "$primary_source_sha" \
            --workflow-run-id "$primary_run_id" \
            --workers 4 \
            --require-complete
      - id: primary_review
        name: Run independent primary reviewer
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          FABLE_CHECKPOINT_RUN_ID: ${{ inputs.fable_checkpoint_run_id }}
          FABLE_CHECKPOINT_SOURCE_SHA: ${{ inputs.fable_checkpoint_source_sha }}
          DEEPSEEK_CHECKPOINT_RUN_ID: ${{ inputs.deepseek_checkpoint_run_id }}
          DEEPSEEK_CHECKPOINT_SOURCE_SHA: ${{ inputs.deepseek_checkpoint_source_sha }}
          FABLE_PRIMARY_RUN_ID: ${{ inputs.fable_primary_run_id }}
          DEEPSEEK_PRIMARY_RUN_ID: ${{ inputs.deepseek_primary_run_id }}
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          umask 077
          checkpoint_args=()
          if [[ '${{ matrix.reviewer }}' = fable && -n "$FABLE_CHECKPOINT_RUN_ID" ]]; then
            checkpoint_args=(--resume --checkpoint-source-sha "${FABLE_CHECKPOINT_SOURCE_SHA:-$PACKET_SOURCE_SHA}" --checkpoint-workflow-run-id "$FABLE_CHECKPOINT_RUN_ID")
          elif [[ '${{ matrix.reviewer }}' = fable && -n "$FABLE_PRIMARY_RUN_ID" ]]; then
            checkpoint_args=(--resume --checkpoint-source-sha "$PACKET_SOURCE_SHA" --checkpoint-workflow-run-id "$FABLE_PRIMARY_RUN_ID")
          elif [[ '${{ matrix.reviewer }}' = deepseek && -n "$DEEPSEEK_CHECKPOINT_RUN_ID" ]]; then
            checkpoint_args=(--resume --checkpoint-source-sha "${DEEPSEEK_CHECKPOINT_SOURCE_SHA:-$PACKET_SOURCE_SHA}" --checkpoint-workflow-run-id "$DEEPSEEK_CHECKPOINT_RUN_ID")
          elif [[ '${{ matrix.reviewer }}' = deepseek && -n "$DEEPSEEK_PRIMARY_RUN_ID" ]]; then
            checkpoint_args=(--resume --checkpoint-source-sha "$PACKET_SOURCE_SHA" --checkpoint-workflow-run-id "$DEEPSEEK_PRIMARY_RUN_ID")
          fi
          python3 scripts/run_e0_reviewers.py primary \
            --reviewer '${{ matrix.reviewer }}' \
            --packet-dir test/range/benchmark/v16/review-packets \
            --output-dir 'review-evidence/${{ matrix.reviewer }}' \
            --workers 4 \
            "${checkpoint_args[@]}"
      - name: Build verified failure checkpoint
        if: ${{ failure() && steps.primary_review.outcome == 'failure' }}
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          umask 077
          python3 scripts/run_e0_reviewers.py checkpoint \
            --reviewer '${{ matrix.reviewer }}' \
            --packet-dir test/range/benchmark/v16/review-packets \
            --retained-dir 'review-evidence/${{ matrix.reviewer }}' \
            --output-dir 'review-checkpoint/${{ matrix.reviewer }}' \
            --packet-source-sha '${{ inputs.source_sha }}' \
            --retained-source-sha '${{ inputs.source_sha }}' \
            --workflow-run-id '${{ github.run_id }}' \
            --workers 4
      - name: Upload verified failure checkpoint
        if: ${{ failure() && steps.primary_review.outcome == 'failure' }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-primary-checkpoint-${{ matrix.reviewer }}-${{ inputs.source_sha }}
          path: review-checkpoint/${{ matrix.reviewer }}
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-primary-${{ matrix.reviewer }}-${{ inputs.source_sha }}
          path: review-evidence/${{ matrix.reviewer }}
          if-no-files-found: error
          retention-days: 90
  arbitrate:
    name: codex arbitration (shard ${{ matrix.shard }})
    needs: primary
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify packet-only source commit
        env:
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          python3 - <<'PY'
          import os, subprocess
          base = os.environ["GITHUB_SHA"]
          source = os.environ["PACKET_SOURCE_SHA"]
          rows = subprocess.run(
              ["git", "diff", "--name-status", base, source],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed_catalog = "test/range/benchmark/v16/review-packet-catalog.json"
          allowed_prefix = "test/range/benchmark/v16/review-packets/"
          invalid = []
          for row in rows:
              status, path = row.split("\t", 1)
              if status not in {"A", "M"} or not (
                  path == allowed_catalog
                  or (path.startswith(allowed_prefix) and path.endswith(".json"))
              ):
                  invalid.append(row)
          if invalid:
              raise SystemExit("untrusted review source changes: " + ", ".join(invalid))
          PY
          claude_version="$(claude --version | awk '{print $1}')"
          codex_version="$(codex --version)"
          dsh_version="$(dsh --version)"
          printf 'reviewer harness versions: claude=%s codex=%s dsh=%s\n' \
            "$claude_version" "$codex_version" "$dsh_version"
          test "$claude_version" = "2.1.233"
          test "$codex_version" = "codex-cli 0.144.4"
          test "$dsh_version" = "0.1.0-rc.6"
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
      - name: Restore exact current-run arbitration inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          set -euo pipefail
          umask 077
          artifact_args=(
            --artifact 'range-v16-primary-fable-${{ inputs.source_sha }}=review-evidence/fable'
            --artifact 'range-v16-primary-deepseek-${{ inputs.source_sha }}=review-evidence/deepseek'
          )
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            artifact_args+=(
              --optional-artifact 'range-v16-arbitration-checkpoint-${{ matrix.shard }}-${{ inputs.source_sha }}=restored-checkpoint/codex-shard'
            )
          fi
          python3 scripts/download_e0_run_artifacts.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA" \
            "${artifact_args[@]}"
      - id: arbitration_paths
        name: Prepare content-bound arbitration shard resume
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          umask 077
          current_dir="$RUNNER_TEMP/range-v16-arbitration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SHARD_INDEX"
          test ! -e "$current_dir"
          resume=false
          if [[ -f restored-checkpoint/codex-shard/checkpoint-manifest.json ]]; then
            mkdir -p "$current_dir"
            cp -a restored-checkpoint/codex-shard/. "$current_dir/"
            resume=true
          elif (( GITHUB_RUN_ATTEMPT > 1 )); then
            prior_attempt=$((GITHUB_RUN_ATTEMPT - 1))
            prior_dir="$RUNNER_TEMP/range-v16-arbitration-$GITHUB_RUN_ID-$prior_attempt-$SHARD_INDEX"
            if [[ -d "$prior_dir/decisions" && -d "$prior_dir/raw" ]]; then
              python3 scripts/run_e0_reviewers.py arbitration-checkpoint \
                --packet-dir test/range/benchmark/v16/review-packets \
                --fable-dir review-evidence/fable \
                --deepseek-dir review-evidence/deepseek \
                --retained-dir "$prior_dir" \
                --output-dir "$current_dir" \
                --packet-source-sha "$PACKET_SOURCE_SHA" \
                --retained-source-sha "$PACKET_SOURCE_SHA" \
                --workflow-run-id "$GITHUB_RUN_ID" \
                --shard-index "$SHARD_INDEX" \
                --shard-count 4 \
                --workers 1
              resume=true
            fi
          fi
          echo "output_dir=$current_dir" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
      - id: arbitration_review
        name: Run deterministic Codex mandatory and disagreement arbitration shard
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
          CODEX_OUTPUT: ${{ steps.arbitration_paths.outputs.output_dir }}
          RESUME: ${{ steps.arbitration_paths.outputs.resume }}
        run: |
          umask 077
          python3 scripts/run_e0_reviewers.py codex-preflight --doctor-only
          checkpoint_args=()
          if [[ "$RESUME" = true ]]; then
            checkpoint_args=(--resume --checkpoint-source-sha "$PACKET_SOURCE_SHA")
          fi
          python3 scripts/run_e0_reviewers.py arbitrate \
            --packet-dir test/range/benchmark/v16/review-packets \
            --fable-dir review-evidence/fable \
            --deepseek-dir review-evidence/deepseek \
            --output-dir "$CODEX_OUTPUT" \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 4 \
            --workers 1 \
            "${checkpoint_args[@]}"
      - name: Build verified arbitration shard failure checkpoint
        if: ${{ failure() && steps.arbitration_review.outcome == 'failure' }}
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          umask 077
          python3 scripts/run_e0_reviewers.py arbitration-checkpoint \
            --packet-dir test/range/benchmark/v16/review-packets \
            --fable-dir review-evidence/fable \
            --deepseek-dir review-evidence/deepseek \
            --retained-dir '${{ steps.arbitration_paths.outputs.output_dir }}' \
            --output-dir review-checkpoint/codex-shard \
            --packet-source-sha '${{ inputs.source_sha }}' \
            --retained-source-sha '${{ inputs.source_sha }}' \
            --workflow-run-id '${{ github.run_id }}' \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 4 \
            --workers 1
      - name: Upload verified arbitration shard failure checkpoint
        if: ${{ failure() && steps.arbitration_review.outcome == 'failure' }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-arbitration-checkpoint-${{ matrix.shard }}-${{ inputs.source_sha }}
          path: review-checkpoint/codex-shard
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload completed arbitration shard
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-arbitration-shard-${{ matrix.shard }}-${{ inputs.source_sha }}
          path: ${{ steps.arbitration_paths.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 90
  finalize:
    name: codex arbitration finalize and safe-pair author
    needs: [primary, arbitrate]
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify packet-only source commit
        env:
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          python3 - <<'PY'
          import os, subprocess
          base = os.environ["GITHUB_SHA"]
          source = os.environ["PACKET_SOURCE_SHA"]
          rows = subprocess.run(
              ["git", "diff", "--name-status", base, source],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          allowed_catalog = "test/range/benchmark/v16/review-packet-catalog.json"
          allowed_prefix = "test/range/benchmark/v16/review-packets/"
          invalid = []
          for row in rows:
              status, path = row.split("\t", 1)
              if status not in {"A", "M"} or not (
                  path == allowed_catalog
                  or (path.startswith(allowed_prefix) and path.endswith(".json"))
              ):
                  invalid.append(row)
          if invalid:
              raise SystemExit("untrusted review source changes: " + ", ".join(invalid))
          PY
          claude_version="$(claude --version | awk '{print $1}')"
          codex_version="$(codex --version)"
          dsh_version="$(dsh --version)"
          printf 'reviewer harness versions: claude=%s codex=%s dsh=%s\n' \
            "$claude_version" "$codex_version" "$dsh_version"
          test "$claude_version" = "2.1.233"
          test "$codex_version" = "codex-cli 0.144.4"
          test "$dsh_version" = "0.1.0-rc.6"
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
      - name: Restore exact current-run review artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          umask 077
          python3 scripts/download_e0_run_artifacts.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA" \
            --artifact 'range-v16-primary-fable-${{ inputs.source_sha }}=review-evidence/fable' \
            --artifact 'range-v16-primary-deepseek-${{ inputs.source_sha }}=review-evidence/deepseek' \
            --artifact 'range-v16-arbitration-shard-0-${{ inputs.source_sha }}=arbitration-shards/0' \
            --artifact 'range-v16-arbitration-shard-1-${{ inputs.source_sha }}=arbitration-shards/1' \
            --artifact 'range-v16-arbitration-shard-2-${{ inputs.source_sha }}=arbitration-shards/2' \
            --artifact 'range-v16-arbitration-shard-3-${{ inputs.source_sha }}=arbitration-shards/3'
      - name: Merge and revalidate arbitration shards
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          umask 077
          python3 scripts/run_e0_reviewers.py merge-arbitration \
            --packet-dir test/range/benchmark/v16/review-packets \
            --fable-dir review-evidence/fable \
            --deepseek-dir review-evidence/deepseek \
            --shard-dir arbitration-shards/0 \
            --shard-dir arbitration-shards/1 \
            --shard-dir arbitration-shards/2 \
            --shard-dir arbitration-shards/3 \
            --shard-count 4 \
            --output-dir review-evidence/opus
          python3 scripts/build_e0_review_manifest.py \
            --review-root review-evidence \
            --output review-evidence/review-bundle-manifest.json
      - id: upload-reviewed
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-reviewed-${{ inputs.source_sha }}
          path: review-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Bind protected review provenance
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          python3 scripts/build_e0_review_provenance.py \
            --packet-catalog test/range/benchmark/v16/review-packet-catalog.json \
            --review-bundle-manifest review-evidence/review-bundle-manifest.json \
            --artifact-name 'range-v16-reviewed-${{ inputs.source_sha }}' \
            --artifact-digest 'sha256:${{ steps.upload-reviewed.outputs.artifact-digest }}' \
            --workflow-head-sha "$GITHUB_SHA" \
            --packet-source-sha '${{ inputs.source_sha }}' \
            --output review-provenance/review-provenance.json
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-review-provenance-${{ inputs.source_sha }}
          path: review-provenance/review-provenance.json
          if-no-files-found: error
          retention-days: 90
      - id: pair_author_paths
        name: Normalize adjudication and prepare safe-pair resume
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          current_root="$RUNNER_TEMP/range-v16-pair-author-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$current_root"
          mkdir -p "$current_root"
          python3 scripts/generate_range_v16_truth.py normalize \
            --packet-dir test/range/benchmark/v16/review-packets \
            --packet-catalog test/range/benchmark/v16/review-packet-catalog.json \
            --review-root review-evidence \
            --review-bundle-manifest review-evidence/review-bundle-manifest.json \
            --review-provenance review-provenance/review-provenance.json \
            --output "$current_root/normalized-decisions.json"
          resume=false
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            prior_attempt=$((GITHUB_RUN_ATTEMPT - 1))
            prior_root="$RUNNER_TEMP/range-v16-pair-author-$GITHUB_RUN_ID-$prior_attempt"
            if [[ -d "$prior_root/author/authors" && -d "$prior_root/author/raw" ]]; then
              python3 scripts/generate_range_v16_safe_pairs.py checkpoint \
                --packet-dir test/range/benchmark/v16/review-packets \
                --normalized-decisions "$current_root/normalized-decisions.json" \
                --retained-dir "$prior_root/author" \
                --output-dir "$current_root/author" \
                --packet-source-sha "$PACKET_SOURCE_SHA" \
                --retained-source-sha "$PACKET_SOURCE_SHA" \
                --workflow-run-id "$GITHUB_RUN_ID"
              resume=true
            fi
          fi
          echo "root_dir=$current_root" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
      - id: pair_author
        name: Author normalized safe pairs
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
          PAIR_ROOT: ${{ steps.pair_author_paths.outputs.root_dir }}
          RESUME: ${{ steps.pair_author_paths.outputs.resume }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/run_e0_reviewers.py codex-preflight --doctor-only
          checkpoint_args=()
          if [[ "$RESUME" = true ]]; then
            checkpoint_args=(
              --resume
              --checkpoint-source-sha "$PACKET_SOURCE_SHA"
              --checkpoint-workflow-run-id "$GITHUB_RUN_ID"
            )
          fi
          python3 scripts/generate_range_v16_safe_pairs.py author \
            --packet-dir test/range/benchmark/v16/review-packets \
            --normalized-decisions "$PAIR_ROOT/normalized-decisions.json" \
            --output-dir "$PAIR_ROOT/author" \
            --workers 4 \
            "${checkpoint_args[@]}"
      - id: pair_author_checkpoint
        name: Build verified safe-pair failure checkpoint
        if: ${{ failure() && steps.pair_author.outcome == 'failure' }}
        env:
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          PACKET_SOURCE_SHA: ${{ inputs.source_sha }}
          PAIR_ROOT: ${{ steps.pair_author_paths.outputs.root_dir }}
        run: |
          set -euo pipefail
          umask 077
          created=false
          if [[ -d "$PAIR_ROOT/author/authors" && -d "$PAIR_ROOT/author/raw" ]]; then
            python3 scripts/generate_range_v16_safe_pairs.py checkpoint \
              --packet-dir test/range/benchmark/v16/review-packets \
              --normalized-decisions "$PAIR_ROOT/normalized-decisions.json" \
              --retained-dir "$PAIR_ROOT/author" \
              --output-dir review-checkpoint/safe-pair \
              --packet-source-sha "$PACKET_SOURCE_SHA" \
              --retained-source-sha "$PACKET_SOURCE_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID"
            created=true
          fi
          echo "created=$created" >> "$GITHUB_OUTPUT"
      - name: Upload verified safe-pair failure checkpoint
        if: ${{ failure() && steps.pair_author_checkpoint.outputs.created == 'true' }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-pair-author-checkpoint-${{ inputs.source_sha }}
          path: review-checkpoint/safe-pair
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-pair-author-${{ inputs.source_sha }}
          path: ${{ steps.pair_author_paths.outputs.root_dir }}
          if-no-files-found: error
          retention-days: 90
