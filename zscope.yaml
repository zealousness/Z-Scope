# Z-SCOPE configuration
#
# All fields map to dataclasses in zscope/config/config.py.
# String values support environment variable expansion, for example ${Z_SCOPE_API_KEY}.

# ── LLM profiles ────────────────────────────────────────────────────
# Agents reference these profiles through project.agents[].llm_ref.
# The first available profile is also registered as "default" internally.
llms:
  default:
    provider: openai
    base_url: https://api.siliconflow.cn/v1
    models:
      - Qwen/Qwen3-Coder-30B-A3B-Instruct
      - Qwen/Qwen3-Coder-480B-A35B-Instruct
    api_key: ${Z_SCOPE_API_KEY}
    temperature: 0.1
    max_tokens: 4096
    max_retries: 2
    timeout: 120

  smart_model:
    provider: openai
    base_url: https://api.siliconflow.cn/v1
    models:
      - Qwen/Qwen3-Coder-480B-A35B-Instruct
      - Qwen/Qwen3-Coder-30B-A3B-Instruct
    api_key: ${Z_SCOPE_API_KEY}
    temperature: 0.1
    max_tokens: 4096
    max_retries: 2
    timeout: 180

# ── Project ─────────────────────────────────────────────────────────
project:
  root: .                         # Project root, resolved from current working directory
  source_root: .                  # Source root, resolved from project.root when relative

  # Single-entry mode:
  entry_function: main

  # Batch mode:
  # entry_functions_list: functions.json

  # Entry discovery is used by CLI --discover-entries, and can also provide
  # candidates when no explicit batch list is supplied.
  entry_discovery:
    enabled: false
    max_candidates: 200
    max_functions: 10000
    # header_files:
    #   - include/public_api.h

  # compile_commands_path is auto-discovered from project.root/source_root when omitted.
  # compile_commands_path: build/compile_commands.json

  # Limit the source tree scanned by CodeIndex. Paths are relative to source_root.
  include_paths: []
  exclude_paths:
    - .git
    - .venv
    - build
    - dependency
    - tmp

  agents:
    - name: semantic_modeler
      enabled: true
      llm_ref: default

    - name: vulnerability_analyzer
      enabled: true
      llm_ref: smart_model
      can_spawn_subagents: true
      # task is now used as a vulnerability-skill selector.
      # Only the matched skills are injected into vulnerability_analyzer and
      # focused Deep Worker tickets; unrecognized/empty tasks keep all skills.
      #
      # Examples:
      #   "只查找资源泄漏和空指针问题。"
      #     -> resource_lifecycle, null_and_failure
      #   "只关注并发风险，不关心内存安全。"
      #     -> concurrency_lock_order, shared_state_race, stack_escape
      task: "查找逻辑漏洞、内存安全问题和并发风险。"

      # Optional explicit extra skills. Built-in vulnerability skills come from
      # zscope/agents/vulnerability_analyzer/AGENT.md and zscope/skills/*.
      # skills:
      #   - resource_lifecycle

    - name: validator_agent
      enabled: true
      llm_ref: smart_model

    - name: issue_reconciler_agent
      enabled: true
      llm_ref: default

# ── Indexing ────────────────────────────────────────────────────────
indexing:
  backend: unified                # joern | clang | unified | regex

  # Joern backend
  joern_path: dependency/joern/joern
  joern_server_host: 127.0.0.1
  joern_server_port: 8080
  joern_heap_size: 8g

  # Clang backend
  clangd_path: clangd
  knowledge_db_path: .zscope_knowledge/code_knowledge.db
  batch_size: 50
  max_clangd_threads: 8

  # SVF settings used by the unified backend
  # svf_bin_dir: /root/sdk/svf/bin
  gclang_path: gclang
  get_bc_path: get-bc
  llvm_link_path: llvm-link
  svf_heap_limit_mb: 32768
  svf_timeout: 1800

# ── Analysis ────────────────────────────────────────────────────────
analysis:
  max_recursion_depth: 3
  max_function_lines: 500
  max_tool_iterations: 50

  snapshot_dir: .zscope_snapshots
  enable_snapshot_cache: true
  user_config_db: ""             # Empty means {snapshot_dir}/user_config.db

  parallel_workers: 5
  workflow_name: default         # default | maintain | resume; CLI --maintain/--resume override this

  # Recursive pre-modeling of reachable callees before vulnerability mining.
  max_premodel_depth: 3
  max_premodel_callees: 20
  trivial_function_max_lines: 5

  # Focused Deep Worker support.
  enable_subagent_workers: true
  max_subagent_tickets: 4
