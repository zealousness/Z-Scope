<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-SCOPE | AI 代码审计看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.css" rel="stylesheet" type="text/css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
        .glass {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen" x-data="zscopeApp()">

    <nav class="glass sticky top-0 z-50 px-6 py-4 flex flex-wrap gap-4 justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center font-bold text-white">Z</div>
            <h1 class="text-xl font-bold tracking-tight">Z-SCOPE <span class="text-xs font-normal opacity-50">v0.2.0</span></h1>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
            <div class="tabs tabs-boxed bg-neutral-900">
                <a class="tab tab-sm" :class="activeTab==='findings' && 'tab-active'" @click="activeTab='findings'">审计发现</a>
                <a class="tab tab-sm" :class="activeTab==='config' && 'tab-active'" @click="activeTab='config';loadAllConfigs()">用户配置</a>
                <a class="tab tab-sm" :class="activeTab==='warnings' && 'tab-active'" @click="activeTab='warnings';loadWarnings()">告警</a>
            </div>
            <div class="badge badge-outline gap-2" :class="cpgStatusClass">
                <span class="w-2 h-2 rounded-full" :class="cpgDotClass"></span>
                CPG: <span x-text="cpgStatus">unknown</span>
            </div>
            <div class="badge badge-outline gap-2" :class="statusClass">
                <span class="w-2 h-2 rounded-full" :class="statusDotClass"></span>
                <span x-text="statusText">正在加载...</span>
            </div>
            <button @click="refreshData()" class="btn btn-ghost btn-sm">刷新</button>
            <button @click="exportOfflinePage()" class="btn btn-ghost btn-sm">离线导出</button>
            <button @click="triggerOfflineImport()" class="btn btn-ghost btn-sm">导入</button>
            <button @click="saveFindings()" class="btn btn-primary btn-sm">回写验证结果</button>
            <input type="file" x-ref="offlineImportInput" @change="importOfflinePage($event)" class="hidden" accept=".html,text/html">
        </div>
    </nav>

    <main class="p-6 h-[calc(100vh-96px)]">

    <!-- ── Findings Tab ── -->
    <div x-show="activeTab==='findings'" class="grid grid-cols-12 gap-6 h-full">
        <div class="col-span-4 xl:col-span-3 flex flex-col gap-4 overflow-hidden">
            <div class="glass rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold uppercase tracking-wider opacity-60">配置 zscope.yaml</h2>
                    <button @click="loadConfig()" class="btn btn-ghost btn-xs">重新载入</button>
                </div>
                <textarea
                    class="textarea textarea-bordered w-full min-h-[140px] text-xs code-font"
                    placeholder="在此编辑 zscope.yaml 内容"
                    x-model="configContent"></textarea>
                <div class="flex items-center justify-between">
                    <span class="text-xs opacity-60" x-text="configStatus"></span>
                    <button @click="saveConfig()" class="btn btn-secondary btn-xs">保存配置</button>
                </div>
            </div>

            <div class="glass rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold uppercase tracking-wider opacity-60">审计发现</h2>
                    <span class="text-xs opacity-60"><span x-text="filteredFindings().length"></span> / <span x-text="findings.length"></span></span>
                </div>
                <div class="flex flex-col gap-2">
                    <input
                        type="text"
                        class="input input-bordered input-sm"
                        placeholder="模糊匹配筛选"
                        x-model="filterQuery">
                    <select class="select select-bordered select-sm" x-model="filterField">
                        <option value="all">全部字段</option>
                        <option value="function">函数名</option>
                        <option value="location">位置</option>
                        <option value="category">类别</option>
                        <option value="subcategory">子类</option>
                        <option value="description">描述</option>
                        <option value="impact_level">影响等级</option>
                        <option value="validation_status">验证状态</option>
                    </select>
                </div>
                <div class="flex-1 overflow-y-auto pr-2 space-y-2 max-h-[45vh]">
                    <template x-for="finding in filteredFindings()" :key="finding.uid">
                        <div
                            @click="selectFinding(finding)"
                            class="p-4 rounded-xl cursor-pointer transition-all border border-transparent hover:glass"
                            :class="selectedFinding?.uid === finding.uid ? 'glass border-primary/50' : 'bg-neutral-900'">
                            <div class="flex justify-between items-start mb-2">
                                <span class="badge badge-xs" :class="getSeverityClass(finding.impact_level)" x-text="finding.impact_level"></span>
                                <span class="badge badge-xs" :class="getValidationClass(finding.validation_status)" x-text="finding.validation_status || 'pending'"></span>
                            </div>
                            <h3 class="font-semibold text-sm truncate" x-text="finding.function"></h3>
                            <p class="text-xs opacity-60 line-clamp-2 mt-1" x-text="finding.description"></p>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div class="col-span-8 xl:col-span-9 flex flex-col gap-6 overflow-hidden">
            <template x-if="selectedFinding">
                <div class="contents">
                    <div class="flex-1 glass rounded-2xl overflow-hidden flex flex-col">
                        <div class="p-4 border-b border-white/10 flex flex-wrap gap-3 justify-between items-center bg-white/5">
                            <div class="flex items-center gap-2">
                                <span class="text-sm code-font opacity-80" x-text="selectedFinding.location || selectedFinding.function"></span>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <div class="badge badge-outline" x-text="selectedFinding.category"></div>
                                <div class="badge badge-outline" x-text="selectedFinding.subcategory"></div>
                                <div class="badge" :class="getSeverityClass(selectedFinding.impact_level)" x-text="selectedFinding.impact_level"></div>
                            </div>
                        </div>
                        <div class="flex-1 overflow-auto bg-[#1e1e1e] relative">
                            <pre class="m-0 p-6 text-sm"><code class="language-c" x-text="selectedFinding.code_snippet"></code></pre>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6 h-1/3">
                        <div class="glass rounded-2xl p-6 overflow-y-auto">
                            <h3 class="text-sm font-bold mb-3 flex items-center gap-2 text-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                AI 推理链 (Reasoning)
                            </h3>
                            <div class="text-sm leading-relaxed opacity-80 whitespace-pre-wrap" x-text="selectedFinding.reasoning || selectedFinding.reasoning_process || '暂无推理过程'"></div>
                        </div>
                        <div class="glass rounded-2xl p-6 overflow-y-auto border-l-4" :class="getBorderClass(selectedFinding.impact_level)">
                            <h3 class="text-sm font-bold mb-3 text-white">漏洞详情</h3>
                            <div class="space-y-4">
                                <div>
                                    <h4 class="text-[10px] uppercase opacity-40 font-bold">根本原因</h4>
                                    <p class="text-sm mt-1" x-text="selectedFinding.root_cause"></p>
                                </div>
                                <div>
                                    <h4 class="text-[10px] uppercase opacity-40 font-bold">修复建议</h4>
                                    <p class="text-sm mt-1 text-success" x-text="selectedFinding.suggested_fix"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="glass rounded-2xl p-6 space-y-4">
                        <div class="flex flex-wrap items-center gap-4">
                            <h3 class="text-sm font-bold">验证结果</h3>
                            <select class="select select-bordered select-sm" x-model="selectedFinding.validation_status">
                                <option value="validated">validated</option>
                                <option value="pending">pending</option>
                                <option value="rejected">rejected</option>
                            </select>
                            <span class="text-xs opacity-60">仅允许 validated / pending / rejected</span>
                        </div>
                        <textarea
                            class="textarea textarea-bordered w-full min-h-[140px]"
                            placeholder="填写 validation_reasoning（支持多行文本）"
                            x-model="selectedFinding.validation_reasoning"></textarea>
                        <div class="flex items-center gap-2 mt-2">
                            <input class="input input-bordered input-sm flex-1" placeholder="误报原因" x-model="fpReason">
                            <button class="btn btn-warning btn-sm" @click="markFalsePositive(selectedFinding)">标记为误报</button>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="!selectedFinding">
                <div class="flex-1 glass rounded-3xl flex flex-center items-center justify-center opacity-30 flex-col gap-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <p class="text-lg">请从左侧选择一条审计发现进行分析</p>
                </div>
            </template>
        </div>
    </div><!-- end findings tab -->

    <!-- ── Config Tab ── -->
    <div x-show="activeTab==='config'" class="h-full overflow-auto">
        <div class="glass rounded-2xl p-6 space-y-4">
            <div class="tabs tabs-bordered">
                <a class="tab" :class="configSubTab==='external' && 'tab-active'" @click="configSubTab='external'">外部函数</a>
                <a class="tab" :class="configSubTab==='paired' && 'tab-active'" @click="configSubTab='paired'">配对函数</a>
                <a class="tab" :class="configSubTab==='pointers' && 'tab-active'" @click="configSubTab='pointers'">函数指针</a>
                <a class="tab" :class="configSubTab==='intents' && 'tab-active'" @click="configSubTab='intents'">函数意图</a>
                <a class="tab" :class="configSubTab==='cpg' && 'tab-active'" @click="configSubTab='cpg'">CPG 管理</a>
            </div>

            <!-- External Functions -->
            <div x-show="configSubTab==='external'" class="space-y-3">
                <div class="flex gap-2 flex-wrap">
                    <input class="input input-bordered input-sm" placeholder="函数名" x-model="extForm.func_name">
                    <input class="input input-bordered input-sm" placeholder="库名" x-model="extForm.library">
                    <input class="input input-bordered input-sm flex-1" placeholder="描述" x-model="extForm.description">
                    <input class="input input-bordered input-sm" placeholder="返回语义" x-model="extForm.return_semantics">
                    <button class="btn btn-primary btn-sm" @click="saveExtFunc()">保存</button>
                </div>
                <table class="table table-sm">
                    <thead><tr><th>函数名</th><th>库</th><th>描述</th><th>操作</th></tr></thead>
                    <tbody>
                        <template x-for="item in configData.external_functions" :key="item.func_name">
                            <tr>
                                <td x-text="item.func_name"></td>
                                <td x-text="item.library"></td>
                                <td class="max-w-xs truncate" x-text="item.description"></td>
                                <td><button class="btn btn-error btn-xs" @click="deleteConfig('external_functions',{func_name:item.func_name})">删除</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Paired Functions -->
            <div x-show="configSubTab==='paired'" class="space-y-3">
                <div class="flex gap-2 flex-wrap">
                    <select class="select select-bordered select-sm" x-model="pairedForm.category">
                        <option value="memory">memory</option><option value="lock">lock</option>
                        <option value="refcount">refcount</option><option value="fd">fd</option>
                    </select>
                    <input class="input input-bordered input-sm" placeholder="获取函数" x-model="pairedForm.acquire_func">
                    <input class="input input-bordered input-sm" placeholder="释放函数" x-model="pairedForm.release_func">
                    <input class="input input-bordered input-sm flex-1" placeholder="描述" x-model="pairedForm.description">
                    <button class="btn btn-primary btn-sm" @click="savePairedFunc()">保存</button>
                </div>
                <table class="table table-sm">
                    <thead><tr><th>类别</th><th>获取</th><th>释放</th><th>描述</th><th>操作</th></tr></thead>
                    <tbody>
                        <template x-for="item in configData.paired_functions" :key="item.id">
                            <tr>
                                <td x-text="item.category"></td>
                                <td x-text="item.acquire_func"></td>
                                <td x-text="item.release_func"></td>
                                <td x-text="item.description"></td>
                                <td><button class="btn btn-error btn-xs" @click="deleteConfig('paired_functions',{id:item.id})">删除</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Pointer Targets -->
            <div x-show="configSubTab==='pointers'" class="space-y-3">
                <div class="flex gap-2 flex-wrap">
                    <input class="input input-bordered input-sm" placeholder="指针位置" x-model="ptrForm.pointer_location">
                    <select class="select select-bordered select-sm" x-model="ptrForm.scope">
                        <option value="local">local</option><option value="global">global</option><option value="ignore">ignore</option>
                    </select>
                    <input class="input input-bordered input-sm flex-1" placeholder="目标函数(逗号分隔)" x-model="ptrForm.targets_str">
                    <button class="btn btn-primary btn-sm" @click="savePtrTarget()">保存</button>
                </div>
                <table class="table table-sm">
                    <thead><tr><th>位置</th><th>范围</th><th>目标</th><th>操作</th></tr></thead>
                    <tbody>
                        <template x-for="item in configData.pointer_targets" :key="item.id">
                            <tr>
                                <td x-text="item.pointer_location"></td>
                                <td x-text="item.scope"></td>
                                <td x-text="item.target_functions"></td>
                                <td><button class="btn btn-error btn-xs" @click="deleteConfig('pointer_targets',{id:item.id})">删除</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Function Intents -->
            <div x-show="configSubTab==='intents'" class="space-y-3">
                <div class="flex gap-2 flex-wrap">
                    <input class="input input-bordered input-sm" placeholder="函数名" x-model="intentForm.func_name">
                    <input class="input input-bordered input-sm" placeholder="并发组" x-model="intentForm.concurrency_group">
                    <input class="input input-bordered input-sm" placeholder="并发对象(逗号分隔)" x-model="intentForm.concurrent_str">
                    <input class="input input-bordered input-sm flex-1" placeholder="备注" x-model="intentForm.notes">
                    <button class="btn btn-primary btn-sm" @click="saveIntent()">保存</button>
                </div>
                <table class="table table-sm">
                    <thead><tr><th>函数</th><th>并发组</th><th>备注</th><th>操作</th></tr></thead>
                    <tbody>
                        <template x-for="item in configData.function_intents" :key="item.func_name">
                            <tr>
                                <td x-text="item.func_name"></td>
                                <td x-text="item.concurrency_group"></td>
                                <td class="max-w-xs truncate" x-text="item.notes"></td>
                                <td><button class="btn btn-error btn-xs" @click="deleteConfig('function_intents',{func_name:item.func_name,file_path:item.file_path||''})">删除</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- CPG Management -->
            <div x-show="configSubTab==='cpg'" class="space-y-3">
                <div class="flex items-center gap-4">
                    <span class="badge badge-lg" :class="cpgStatusClass" x-text="'CPG: '+cpgStatus"></span>
                    <span class="text-sm text-error" x-show="cpgError" x-text="cpgError"></span>
                    <input class="input input-bordered input-sm flex-1" placeholder="源码路径" x-model="cpgSourcePath">
                    <button class="btn btn-primary btn-sm" @click="buildCpg()" :disabled="cpgStatus==='building'">构建 CPG</button>
                    <button class="btn btn-ghost btn-sm" @click="pollCpgStatus()">刷新状态</button>
                </div>
            </div>
        </div>
    </div><!-- end config tab -->

    <!-- ── Warnings Tab ── -->
    <div x-show="activeTab==='warnings'" class="h-full overflow-auto">
        <div class="glass rounded-2xl p-6 space-y-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider opacity-60">缺失配置告警</h2>
            <template x-if="warnings.length===0">
                <p class="opacity-40">暂无告警</p>
            </template>
            <table class="table table-sm" x-show="warnings.length>0">
                <thead><tr><th>类型</th><th>上下文</th><th>消息</th></tr></thead>
                <tbody>
                    <template x-for="w in warnings" :key="w.id">
                        <tr>
                            <td><span class="badge badge-warning badge-sm" x-text="w.warning_type"></span></td>
                            <td x-text="w.context"></td>
                            <td x-text="w.message"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div><!-- end warnings tab -->

    </main>

    <script>
        function zscopeApp() {
            return {
                findings: [],
                selectedFinding: null,
                reportSummary: null,
                statusText: '就绪',
                statusClass: 'badge-ghost',
                statusDotClass: 'bg-ghost',
                filterQuery: '',
                filterField: 'all',
                configContent: '',
                configStatus: '',
                offlineTemplateCache: null,
                activeTab: 'findings',
                configSubTab: 'external',
                cpgStatus: 'unknown',
                cpgError: '',
                cpgStatusClass: 'badge-ghost',
                cpgDotClass: 'bg-ghost',
                cpgSourcePath: '',
                warnings: [],
                fpReason: '',
                configData: { external_functions:[], paired_functions:[], pointer_targets:[], function_intents:[] },
                extForm: { func_name:'', library:'', description:'', return_semantics:'' },
                pairedForm: { category:'memory', acquire_func:'', release_func:'', description:'' },
                ptrForm: { pointer_location:'', scope:'local', targets_str:'' },
                intentForm: { func_name:'', concurrency_group:'', concurrent_str:'', notes:'' },

                init() {
                    this.refreshData();
                    this.loadConfig();
                    this.pollCpgStatus();
                },

                refreshData() {
                    this.statusText = '同步中...';
                    fetch('/api/findings')
                        .then(res => res.json())
                        .then(data => {
                            this.reportSummary = data.report?.summary || null;
                            const issues = data.findings || [];
                            this.findings = issues.map((issue, index) => ({
                                ...issue,
                                validation_status: issue.validation_status || 'pending',
                                validation_reasoning: issue.validation_reasoning || '',
                                uid: `${issue.id || 'issue'}-${issue.function || 'fn'}-${issue.location || 'loc'}-${index}`
                            }));
                            if (this.findings.length > 0) {
                                const current = this.selectedFinding
                                    ? this.findings.find(item => item.uid === this.selectedFinding.uid)
                                    : null;
                                this.selectFinding(current || this.findings[0]);
                            } else {
                                this.selectedFinding = null;
                            }
                            this.statusText = '在线';
                            this.statusClass = 'badge-success/20 text-success';
                            this.statusDotClass = 'bg-success';
                        })
                        .catch(() => {
                            this.statusText = '离线';
                            this.statusClass = 'badge-error/20 text-error';
                            this.statusDotClass = 'bg-error';
                        });
                },

                loadConfig() {
                    this.configStatus = '加载中...';
                    fetch('/api/config')
                        .then(res => res.json())
                        .then(data => {
                            this.configContent = data.content || '';
                            this.configStatus = data.content ? '配置已载入' : '未找到配置文件';
                        })
                        .catch(() => {
                            this.configStatus = '配置加载失败';
                        });
                },


                decodeBase64Utf8(base64Text) {
                    const binary = atob(base64Text);
                    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
                    return new TextDecoder('utf-8').decode(bytes);
                },

                encodeBase64Utf8(plainText) {
                    const bytes = new TextEncoder().encode(plainText);
                    let binary = '';
                    bytes.forEach(b => {
                        binary += String.fromCharCode(b);
                    });
                    return btoa(binary);
                },

                parseOfflineState(rawText) {
                    const trimmed = String(rawText || '').trim();
                    if (!trimmed) {
                        return {};
                    }
                    if (trimmed.startsWith('base64:')) {
                        const decoded = this.decodeBase64Utf8(trimmed.slice('base64:'.length));
                        return JSON.parse(decoded);
                    }
                    return JSON.parse(trimmed);
                },


                triggerOfflineImport() {
                    this.$refs.offlineImportInput.value = '';
                    this.$refs.offlineImportInput.click();
                },

                importOfflinePage(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) {
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = () => {
                        try {
                            const html = String(reader.result || '');
                            const match = html.match(/<script id="zscope-offline-state" type="application\/json">([\s\S]*?)<\/script>/i);
                            if (!match) {
                                throw new Error('未检测到离线状态数据');
                            }
                            const offlineState = this.parseOfflineState(match[1]);
                            const importedFindings = Array.isArray(offlineState.findings) ? offlineState.findings : [];
                            if (!importedFindings.length) {
                                throw new Error('离线页面中没有可导入的问题数据');
                            }
                            this.findings = importedFindings.map((issue, index) => ({
                                ...issue,
                                validation_status: issue.validation_status || 'pending',
                                validation_reasoning: issue.validation_reasoning || '',
                                uid: `${issue.id || 'issue'}-${issue.function || 'fn'}-${issue.location || 'loc'}-${index}`
                            }));
                            this.reportSummary = offlineState.reportSummary || this.reportSummary;
                            this.selectFinding(this.findings[0]);
                            this.saveFindings();
                        } catch (error) {
                            alert(`导入失败：${error.message || error}`);
                        }
                    };
                    reader.readAsText(file, 'utf-8');
                },

                async loadOfflineTemplate() {
                    if (this.offlineTemplateCache) {
                        return this.offlineTemplateCache;
                    }
                    const response = await fetch('/offline_template.html', { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`离线模板加载失败（HTTP ${response.status}）`);
                    }
                    const template = await response.text();
                    if (!template.includes('__ZCOPE_OFFLINE_STATE__')) {
                        throw new Error('离线模板缺少状态占位符');
                    }
                    this.offlineTemplateCache = template;
                    return template;
                },

                async createOfflineHtml(payload) {
                    const safeJson = JSON.stringify(payload).replace(/<\/script>/gi, '<\\/script>');
                    const template = await this.loadOfflineTemplate();
                    return template.replace('__ZCOPE_OFFLINE_STATE__', safeJson);
                },

                async exportOfflinePage() {
                    const payload = {
                        reportSummary: this.reportSummary,
                        findings: this.findings.map(({ uid, ...rest }) => ({ ...rest })),
                        exportedAt: new Date().toISOString()
                    };
                    try {
                        const offlineHtml = await this.createOfflineHtml(payload);
                        const blob = new Blob([offlineHtml], { type: 'text/html;charset=utf-8' });
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'zscope-offline-dashboard.html';
                        link.click();
                        URL.revokeObjectURL(link.href);
                    } catch (error) {
                        alert(`导出离线页面失败：${error.message || error}`);
                    }
                },
                saveConfig() {
                    this.configStatus = '保存中...';
                    fetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: this.configContent })
                    })
                        .then(res => res.json())
                        .then(data => {
                            this.configStatus = data.success ? '配置已保存' : (data.error || '保存失败');
                        })
                        .catch(() => {
                            this.configStatus = '保存失败';
                        });
                },

                saveFindings() {
                    fetch('/api/save_findings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ issues: this.findings })
                    })
                        .then(res => res.json())
                        .then(data => {
                            alert(data.success ? '已回写验证结果' : (data.error || '回写失败'));
                        })
                        .catch(() => {
                            alert('回写失败');
                        });
                },

                filteredFindings() {
                    const query = this.filterQuery.trim().toLowerCase();
                    if (!query) {
                        return this.findings;
                    }
                    const fields = {
                        all: ['function', 'location', 'category', 'subcategory', 'description', 'impact_level', 'validation_status'],
                        function: ['function'],
                        location: ['location'],
                        category: ['category'],
                        subcategory: ['subcategory'],
                        description: ['description'],
                        impact_level: ['impact_level'],
                        validation_status: ['validation_status']
                    };
                    const keys = fields[this.filterField] || fields.all;
                    return this.findings.filter(finding =>
                        keys.some(key => (finding[key] || '').toString().toLowerCase().includes(query))
                    );
                },

                selectFinding(finding) {
                    this.selectedFinding = finding;
                    this.$nextTick(() => {
                        Prism.highlightAll();
                    });
                },

                getSeverityClass(level) {
                    const classes = {
                        critical: 'badge-error',
                        high: 'badge-warning',
                        medium: 'badge-info',
                        low: 'badge-ghost'
                    };
                    return classes[level?.toLowerCase()] || 'badge-ghost';
                },

                getValidationClass(status) {
                    const classes = {
                        validated: 'badge-success',
                        pending: 'badge-warning',
                        rejected: 'badge-error'
                    };
                    return classes[status?.toLowerCase()] || 'badge-ghost';
                },

                getBorderClass(level) {
                    const classes = {
                        critical: 'border-error',
                        high: 'border-warning',
                        medium: 'border-info',
                        low: 'border-neutral'
                    };
                    return classes[level?.toLowerCase()] || 'border-neutral';
                },

                // ── CPG ──
                pollCpgStatus() {
                    fetch('/api/cpg_status').then(r=>r.json()).then(d=>{
                        this.cpgStatus = d.status || 'unknown';
                        this.cpgError = d.error || '';
                        const m = {ready:'badge-success',building:'badge-warning',error:'badge-error'};
                        this.cpgStatusClass = m[this.cpgStatus] || 'badge-ghost';
                        this.cpgDotClass = m[this.cpgStatus] ? m[this.cpgStatus].replace('badge','bg') : 'bg-ghost';
                    }).catch(()=>{});
                },
                buildCpg() {
                    if(!this.cpgSourcePath) { alert('请输入源码路径'); return; }
                    fetch('/api/build_cpg',{method:'POST',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({source_path:this.cpgSourcePath})
                    }).then(r=>r.json()).then(()=>{
                        this.cpgStatus='building';
                        const iv=setInterval(()=>{
                            this.pollCpgStatus();
                            if(this.cpgStatus!=='building') clearInterval(iv);
                        },3000);
                    });
                },

                // ── Warnings ──
                loadWarnings() {
                    fetch('/api/user_config/warnings').then(r=>r.json()).then(d=>{
                        this.warnings = d.items || [];
                    }).catch(()=>{});
                },

                // ── False Positive ──
                markFalsePositive(finding) {
                    fetch('/api/mark_false_positive',{method:'POST',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({function:finding.function,location:finding.location,
                            subcategory:finding.subcategory,reason:this.fpReason,issue_id:finding.id||''})
                    }).then(r=>r.json()).then(d=>{
                        if(d.success) { alert('已标记为误报'); this.fpReason=''; }
                    });
                },

                // ── Config CRUD ──
                loadAllConfigs() {
                    ['external_functions','paired_functions','pointer_targets','function_intents'].forEach(r=>{
                        fetch('/api/user_config/'+r).then(res=>res.json()).then(d=>{
                            this.configData[r] = d.items || [];
                        }).catch(()=>{});
                    });
                },
                deleteConfig(resource, payload) {
                    fetch('/api/user_config/'+resource,{method:'DELETE',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(payload)
                    }).then(r=>r.json()).then(()=>this.loadAllConfigs());
                },
                saveExtFunc() {
                    fetch('/api/user_config/external_functions',{method:'POST',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(this.extForm)
                    }).then(r=>r.json()).then(()=>{this.extForm={func_name:'',library:'',description:'',return_semantics:''};this.loadAllConfigs();});
                },
                savePairedFunc() {
                    fetch('/api/user_config/paired_functions',{method:'POST',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(this.pairedForm)
                    }).then(r=>r.json()).then(()=>{this.pairedForm={category:'memory',acquire_func:'',release_func:'',description:''};this.loadAllConfigs();});
                },
                savePtrTarget() {
                    const p = {...this.ptrForm, target_functions: this.ptrForm.targets_str.split(',').map(s=>s.trim()).filter(Boolean)};
                    delete p.targets_str;
                    fetch('/api/user_config/pointer_targets',{method:'POST',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(p)
                    }).then(r=>r.json()).then(()=>{this.ptrForm={pointer_location:'',scope:'local',targets_str:''};this.loadAllConfigs();});
                },
                saveIntent() {
                    const p = {...this.intentForm, concurrent_with: this.intentForm.concurrent_str.split(',').map(s=>s.trim()).filter(Boolean)};
                    delete p.concurrent_str;
                    fetch('/api/user_config/function_intents',{method:'POST',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(p)
                    }).then(r=>r.json()).then(()=>{this.intentForm={func_name:'',concurrency_group:'',concurrent_str:'',notes:''};this.loadAllConfigs();});
                }
            }
        }
    </script>
</body>
</html>
