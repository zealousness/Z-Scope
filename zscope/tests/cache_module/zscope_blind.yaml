# ZScope Blind Scan Configuration - NO HINTS PROVIDED

llm:
  provider: ollama  
  base_url: http://host.docker.internal:11434/v1
  model: alibayram/Qwen3-30B-A3B-Instruct-2507:latest
  api_key: ""
  temperature: 0.15
  max_tokens: 12288

project:
  root: .
  entry_function: PLACEHOLDER  # Will be replaced for each scan
  task: |
    Perform deep static code analysis to find REAL defects in this C code.
    
    Focus on critical memory safety and resource management issues:
    - Buffer overflows and out-of-bounds access
    - Memory leaks (unfreed allocations, lost pointers)
    - Resource leaks (file descriptors, locks, sockets)
    - Use-after-free and double-free
    - Null pointer dereferences
    - Integer overflows leading to memory corruption
    - Race conditions and threading issues
    
    Analysis requirements:
    - Trace function calls deeply (examine called functions)
    - Check ALL error paths for proper cleanup
    - Verify bounds checks before array/buffer access
    - Track resource allocation and deallocation
    - Look for asymmetric operations (open without close, malloc without free)
    
    Output a final_report JSON with ALL issues found, even if minor.
    If no issues found, report "no_issue_found".
  
  compile_commands: compile_commands.json

indexing:
  backend: libclang

analysis:
  max_recursion_depth: 10
  max_function_lines: 800
  max_tool_iterations: 100
  snapshot_dir: .zscope_snapshots_blind
  enable_snapshot_cache: false
