name: Range v16 Safe-Pair Author Diagnostic

on:
  workflow_dispatch:
    inputs:
      review_run_id:
        description: Protected Range v16 review workflow run ID
        required: true
      review_source_sha:
        description: Source SHA bound to the protected review run
        required: true
      checkpoint_artifact_id:
        description: Exact immutable safe-pair checkpoint artifact ID
        required: true
      checkpoint_artifact_digest:
        description: Exact sha256-prefixed checkpoint artifact digest
        required: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: answer-free safe-pair checkpoint diagnostic
    runs-on: [self-hosted, linux, x64, zscope-sealed]
    environment: sealed-benchmark
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify protected diagnostic identity
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/range-v16-pair-author-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ '${{ inputs.review_run_id }}' =~ ^[0-9]+$ ]]
          [[ '${{ inputs.review_source_sha }}' =~ ^[0-9a-f]{40}$ ]]
          [[ '${{ inputs.checkpoint_artifact_id }}' =~ ^[0-9]+$ ]]
          [[ '${{ inputs.checkpoint_artifact_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]
          test ! -e "$DIAGNOSTIC_ROOT"
          mkdir -p "$DIAGNOSTIC_ROOT"
      - name: Restore exact immutable safe-pair checkpoint
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/range-v16-pair-author-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/download_e0_checkpoint_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id '${{ inputs.checkpoint_artifact_id }}' \
            --expected-run-id '${{ inputs.review_run_id }}' \
            --expected-source-sha '${{ inputs.review_source_sha }}' \
            --expected-name 'range-v16-pair-author-checkpoint-${{ inputs.review_source_sha }}' \
            --expected-digest '${{ inputs.checkpoint_artifact_digest }}' \
            --output-dir "$DIAGNOSTIC_ROOT/checkpoint"
      - id: diagnostic
        name: Emit fixed answer-free failure classification
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/range-v16-pair-author-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          Z_SCOPE_E0_REVIEW_ENVIRONMENT: sealed-benchmark
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/generate_range_v16_safe_pairs.py diagnose-checkpoint \
            --checkpoint-dir "$DIAGNOSTIC_ROOT/checkpoint" \
            --expected-source-sha "$REVIEW_SOURCE_SHA" \
            --expected-workflow-run-id "$REVIEW_RUN_ID" \
            --output "$DIAGNOSTIC_ROOT/answer-free-diagnostic.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["DIAGNOSTIC_ROOT"])
          value = json.loads((root / "answer-free-diagnostic.json").read_text(encoding="utf-8"))
          classes = ",".join(
              f"{row['failure_code']}:{row['count']}" for row in value["failure_classes"]
          ) or "none"
          message = (
              f"failure_classes={classes}; "
              f"invalid_records={value['invalid_record_count']}; "
              f"incomplete_records={value['incomplete_record_count']}"
          )
          print(f"::notice title=Range v16 safe-pair author diagnostic::{message}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"classification={message}\n")
          PY
      - id: upload_diagnostic
        name: Upload answer-free diagnostic
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: range-v16-pair-author-diagnostic-${{ inputs.review_source_sha }}
          path: ${{ runner.temp }}/range-v16-pair-author-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/answer-free-diagnostic.json
          if-no-files-found: error
          retention-days: 30
      - name: Clean protected diagnostic workspace
        if: ${{ always() }}
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/range-v16-pair-author-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$DIAGNOSTIC_ROOT" in
            "$RUNNER_TEMP"/range-v16-pair-author-diagnostic-*)
              rm -rf -- "$DIAGNOSTIC_ROOT"
              ;;
            *)
              echo "::error::invalid protected diagnostic cleanup path"
              exit 2
              ;;
          esac
