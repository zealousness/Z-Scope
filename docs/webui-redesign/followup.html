<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z-SCOPE · 项目与时间计划原型</title>
<link rel="stylesheet" href="showcase.css"><link rel="stylesheet" href="followup.css">
<body>
<div class="demo">本轮交互原型 · 全部工程和任务均为合成演示 · 不写配置、不连接模型、不执行扫描 <a href="index.html#current-implementation">查看本轮实际实现与历史对照 ↗</a></div>
<div class="app">
<aside><a class="brand" href="#projects">◈ Z-SCOPE</a><p class="caption">代码质量工作空间</p><button id="switch-project" class="project-switch">当前工程 <b id="current-project">尚未选择</b><span>选择或创建工程　⌄</span></button><nav id="navigation"></nav><div class="aside-bottom">工程配置所在目录即扫描根目录<br>计划由后台持久保存<br>本页仅模拟交互</div></aside>
<main><header><div><p class="eyebrow">DESIGN FOLLOW-UP / 本轮意图演示</p><h1 id="title"></h1></div><a href="prototype.html#issues" class="muted">原问题工作台 · 待决 ↗</a></header><div id="content"></div></main>
</div>
<dialog id="wizard"><form id="wizard-form"><div class="wizard-head"><div><p class="eyebrow">创建工程</p><h2 id="wizard-title">先选择工程目录</h2></div><button class="quiet" type="button" id="close-wizard" aria-label="关闭向导">✕</button></div><div id="wizard-progress" class="steps"></div><div id="wizard-content"></div><p id="wizard-error" class="form-error" role="alert"></p><div class="wizard-footer"><button type="button" id="previous-step" class="quiet">上一步</button><button type="button" id="next-step">下一步 →</button></div></form></dialog>
<script>
'use strict';
const $=selector=>document.querySelector(selector),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let projects=[{id:'demo-order',name:'order-service',directory:'/demo/order-service',language:'c_cpp',mode:'balanced',model:'demo-model',endpoint:'https://example.invalid/v1'},{id:'demo-java',name:'billing-java',directory:'/demo/billing-java',language:'java',mode:'fast',model:'demo-model',endpoint:'https://example.invalid/v1'}],selected='demo-order',plans=[],draft={};
try{const saved=JSON.parse(localStorage.getItem('zscope.followup.demo.v1')||'null');if(saved&&Array.isArray(saved.projects)&&saved.projects.length){projects=saved.projects;selected=saved.selected;plans=Array.isArray(saved.plans)?saved.plans:[]}}catch{}
const modes={fast:['快速','先看确定性风险','适合首次检查与较快反馈。Java 当前仅支持快速。'],balanced:['均衡','证据与投入之间取得平衡','在确定性检查上补充已接入的语义与验证。'],deep:['深度','为复杂问题投入更多分析','深入分析受支持范围；结果仍以实际覆盖为准。']};
const pages={projects:'工程选择',overview:'项目概览',scans:'扫描任务',issues:'问题工作台',coverage:'覆盖与诊断',settings:'项目设置'};
function persist(){try{localStorage.setItem('zscope.followup.demo.v1',JSON.stringify({projects,selected,plans}))}catch{}}
function project(){return projects.find(item=>item.id===selected)||projects[0]}function go(page){location.hash=page;render()}
function modeCards(value,java=false){return `<div class="mode-options">${Object.entries(modes).map(([id,[name,subtitle,description]])=>`<label class="mode-option ${id===value?'selected':''} ${java&&id!=='fast'?'disabled':''}"><input type="radio" name="mode" value="${id}" ${id===value?'checked':''} ${java&&id!=='fast'?'disabled':''}><span><b>${name}</b><small>${subtitle}</small><em>${description}</em></span></label>`).join('')}</div>`}
function planSummary(p){return `${p.startMode==='now'?'准备就绪后开始':p.startAt.replace('T',' ')} · ${p.endMode==='complete'?'直到完成':`截止 ${p.stopAt.replace('T',' ')}`} ${p.daily?` · 每天 ${p.dailyStart}–${p.dailyEnd}（${p.timezone}）`:''}`}
function render(){const p=project(),page=pages[location.hash.slice(1)]?location.hash.slice(1):'projects';$('#title').textContent=pages[page];$('#current-project').textContent=p.name;$('#navigation').innerHTML=Object.entries(pages).filter(([key])=>key!=='projects').map(([key,title],i)=>`<a href="#${key}" ${page===key?'aria-current="page"':''}><span>0${i+1}</span>${title}</a>`).join('');const content=$('#content');
if(page==='projects'){content.innerHTML=`<section class="hero"><p class="eyebrow">从一个工程开始</p><h2>选好工程，再安排扫描。</h2><p>配置随工程保存在目录中的 zscope.yaml。扫描范围直接取它所在的目录，无需重复填写根路径。</p><button id="create-project">＋ 创建工程</button></section><div class="project-grid">${projects.map(item=>`<article class="card project-card"><div class="project-icon">${item.language==='java'?'J':'C'}</div><h2>${esc(item.name)}</h2><p class="mono">${esc(item.directory)}</p><p><span class="pill">${item.language==='java'?'Java':'C / C++'}</span> <span class="muted">${modes[item.mode][0]} · 合成工程</span></p><button class="open-project" data-id="${esc(item.id)}">${item.id===selected?'继续当前工程 →':'打开工程 →'}</button></article>`).join('')}</div><div class="notice">演示中“创建”只保存本浏览器样例；产品中的本地目录、工具与模型可用性需要实际检查。</div>`;$('#create-project').onclick=openWizard;document.querySelectorAll('.open-project').forEach(button=>button.onclick=()=>{selected=button.dataset.id;persist();go('overview')});}
if(page==='overview'){const own=plans.filter(item=>item.projectId===p.id);content.innerHTML=`<section class="hero"><p class="eyebrow">当前工程</p><h2>${esc(p.name)}</h2><p>${esc(p.directory)}/zscope.yaml</p><button id="schedule-next">安排一次扫描 →</button></section><div class="metrics"><article class="card"><p class="caption">扫描模式</p><strong class="number">${modes[p.mode][0]}</strong><p>仅快速、均衡、深度三个模式</p></article><article class="card"><p class="caption">时间计划</p><strong class="number">${own.length}</strong><p>演示记录 · 刷新后可恢复</p></article><article class="card"><p class="caption">工程根目录</p><strong>由配置位置确定</strong><p class="mono">${esc(p.directory)}</p></article></div><section class="card"><h2>本轮评审范围</h2><p>新增工程选择与创建向导、简化扫描模式、单次开始与截止时间、每日扫描窗口。问题工作台保持上一轮原型，等待进一步取舍。</p><a href="#scans">查看扫描安排 →</a></section>`;$('#schedule-next').onclick=()=>go('scans');}
if(page==='scans'){content.innerHTML=`<div class="scan-columns"><form class="card" id="schedule-form"><p class="eyebrow">新建时间计划</p><h2>什么时候开始，什么时候收尾。</h2><p class="muted">当前工程：${esc(p.name)}。模式与时间只影响本轮计划。</p><h3>扫描模式</h3>${modeCards(p.mode,p.language==='java')}<h3>开始时间</h3><div class="choice-row"><label><input type="radio" name="startMode" value="now" checked>立即开始</label><label><input type="radio" name="startMode" value="later">指定开始时间</label></div><label id="start-field" hidden>开始日期与时间<input type="datetime-local" name="startAt" aria-label="计划开始时间"></label><h3>结束条件</h3><div class="choice-row"><label><input type="radio" name="endMode" value="complete" checked>直到扫描完成</label><label><input type="radio" name="endMode" value="deadline">设置截止时间</label></div><label id="stop-field" hidden>总截止日期与时间<input type="datetime-local" name="stopAt" aria-label="计划截止时间"></label><p class="muted">直到完成会忽略配置中旧的停止时间；新的截止时间属于本轮安排。</p><hr><label class="toggle-line"><input type="checkbox" name="daily" id="daily">只在每天指定时段运行</label><div id="daily-fields" hidden><div class="time-pair"><label>每天开始<input type="time" name="dailyStart" value="23:00" aria-label="每天开始"></label><label>每天结束<input type="time" name="dailyEnd" value="08:00" aria-label="每天结束"></label></div><label>每日时段时区<select name="timezone" aria-label="每日时区"><option>Asia/Taipei</option><option>UTC</option><option>Asia/Shanghai</option></select></label><p class="notice">窗口外等待；窗口结束停止新增工作并有界收尾，下一窗口复用经核对的可恢复状态。不能保证只执行剩余项。主机休眠时无法运行；时段是否优惠由你向提供方确认。</p></div><div id="schedule-summary" class="schedule-summary" aria-live="polite"></div><p id="schedule-error" class="form-error" role="alert"></p><button type="submit">保存演示计划</button><p class="muted">日期时间按浏览器时区；此页只演示，不会创建真实后台任务。</p></form><section><article class="card"><p class="eyebrow">计划与真实作业分别记录</p><h2>当前工程的计划</h2><div id="plan-list"></div></article><article class="card"><h3>恢复与保护</h3><p>真实产品计划由 Linux 后台与 SQLite 保存，关闭网页仍可继续。此原型仅用浏览器本地存储模拟重开。</p><p>配置、源码或构建变化会阻止计划自动续作，等待重新检查；不会跨输入复用旧结果。</p><p class="muted">问题工作台本轮待决，保留旧原型入口。</p></article></section></div>`;setupSchedule(p);}
if(page==='issues')content.innerHTML=`<section class="hero"><p class="eyebrow">待决 / 本轮未调整</p><h2>问题工作台保留上一轮设计。</h2><p>本轮只演示工程与扫描安排。问题列表、证据、复核与处置的交互仍等待你的选择，本页不将它标为已改造完成。</p><a class="button" href="prototype.html#issues">打开上一轮问题工作台 ↗</a></section>`;
if(page==='coverage')content.innerHTML=`<div class="notice">覆盖与诊断沿用上一轮信息分层；以下为合成数据，不能作为实际扫描结论。</div><div class="metrics"><article class="card"><p class="caption">分析入口</p><strong class="number">8 / 10</strong><p>2 个入口尚未完成</p></article><article class="card"><p class="caption">覆盖状态</p><strong class="number">不完整</strong><p>未知或未完成不计为安全</p></article><article class="card"><p class="caption">已记录缺口</p><strong class="number">2</strong><p>数量与测量状态分别记录</p></article></div><section class="card"><h2>计划暂停与分析缺口分别呈现</h2><table><tr><th>范围</th><th>当前状态</th><th>下一步</th></tr><tr><td>parser.c / release</td><td>未测量</td><td>下一窗口核对后续作</td></tr><tr><td>cache.c / release</td><td>输入变化</td><td>检查并重新创建计划</td></tr></table><p class="muted">计划的“截止已到”与真实作业“部分完成”可以同时存在。计划完成并不扩大报告已经验证的覆盖范围。</p><a href="#scans">查看时间计划 →</a></section>`;
if(page==='settings')content.innerHTML=`<section class="card narrow"><p class="eyebrow">配置随工程保存</p><h2>${esc(p.name)}</h2><dl class="settings-list"><div><dt>配置文件</dt><dd class="mono">${esc(p.directory)}/zscope.yaml</dd></div><div><dt>扫描根目录</dt><dd class="mono">${esc(p.directory)}</dd></div><div><dt>语言</dt><dd>${p.language==='java'?'Java':'C / C++'}</dd></div><div><dt>默认扫描模式</dt><dd>${modes[p.mode][0]}</dd></div><div><dt>模型</dt><dd>${esc(p.model)} · 合成配置</dd></div></dl><div class="notice">根目录从 YAML 文件所在位置确定，不再提供 project.root 或 source_root 编辑框。业务模型、规则与完整模型设置沿用产品功能，本原型没有复制完整编辑器。</div><button id="change-project-settings" class="quiet">选择其他工程</button></section>`,$('#change-project-settings').onclick=()=>go('projects');
}
function setupSchedule(p){const form=$('#schedule-form');function values(){const data=new FormData(form);return {projectId:p.id,mode:data.get('mode'),startMode:data.get('startMode'),startAt:data.get('startAt'),endMode:data.get('endMode'),stopAt:data.get('stopAt'),daily:data.has('daily'),dailyStart:data.get('dailyStart'),dailyEnd:data.get('dailyEnd'),timezone:data.get('timezone')}}function update(){const v=values();$('#start-field').hidden=v.startMode!=='later';$('#stop-field').hidden=v.endMode!=='deadline';$('#daily-fields').hidden=!v.daily;document.querySelectorAll('.mode-option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));$('#schedule-summary').textContent=`${modes[v.mode][0]} · ${planSummary(v)}`;}form.onchange=update;form.oninput=update;form.onsubmit=event=>{event.preventDefault();const v=values(),error=$('#schedule-error');error.textContent='';if(v.startMode==='later'&&(!v.startAt||new Date(v.startAt)<=new Date())){error.textContent='请选择未来的开始日期与时间。';return}if(v.endMode==='deadline'&&(!v.stopAt||new Date(v.stopAt)<=new Date(v.startMode==='later'?v.startAt:Date.now()))){error.textContent='截止时间需要晚于开始时间和当前时间。';return}if(v.daily&&(!v.dailyStart||!v.dailyEnd||v.dailyStart===v.dailyEnd)){error.textContent='每日开始与结束需为不同时间；跨午夜时段可以直接填写。';return}plans.unshift({...v,id:'demo-plan-'+Date.now(),status:'waiting'});persist();renderPlans(p);error.textContent='演示计划已记录；没有调用服务器或启动扫描。';};function renderPlans(p){const own=plans.filter(item=>item.projectId===p.id);$('#plan-list').innerHTML=own.length?own.map(item=>`<article class="plan"><div><span class="pill">${item.status==='cancelled'?'已取消 · 演示':'等待开始 · 演示'}</span><b>${modes[item.mode][0]}扫描</b></div><p>${esc(planSummary(item))}</p><p class="muted">真实作业：未创建</p>${item.status!=='cancelled'?`<button type="button" class="quiet cancel-plan" data-id="${esc(item.id)}">取消未来计划</button>`:''}</article>`).join(''):'<p class="empty">还没有计划。先选择模式与时间，安排一轮扫描。</p>';document.querySelectorAll('.cancel-plan').forEach(button=>button.onclick=()=>{plans.find(item=>item.id===button.dataset.id).status='cancelled';persist();renderPlans(p)});}renderPlans(p);update();}
let step=0;function openWizard(){step=0;draft={name:'',directory:'',language:'c_cpp',endpoint:'https://example.invalid/v1',model:'demo-model',mode:'balanced'};renderWizard();$('#wizard').showModal()}
function collect(){if(step===0){draft.name=$('#project-name').value.trim();draft.directory=$('#project-directory').value.trim().replace(/\/$/,'');draft.language=$('#project-language').value;if(draft.language==='java')draft.mode='fast'}if(step===1){draft.endpoint=$('#model-endpoint').value.trim();draft.model=$('#model-name').value.trim()}if(step===2)draft.mode=document.querySelector('#wizard-content input[name="mode"]:checked').value}
function renderWizard(){$('#wizard-error').textContent='';$('#wizard-title').textContent=['先选择工程目录','接入你的模型','选择默认扫描模式','检查并创建'][step];$('#wizard-progress').innerHTML=['工程','模型','模式','检查'].map((text,i)=>`<span class="${i<=step?'done':''}">${i+1} ${text}</span>`).join('');$('#previous-step').disabled=step===0;$('#next-step').textContent=step===3?'创建演示工程':'下一步 →';const body=$('#wizard-content');if(step===0){body.innerHTML=`<label>工程名称<input id="project-name" aria-label="工程名称" value="${esc(draft.name)}" placeholder="例如 payment-service"></label><label>工程目录<input id="project-directory" aria-label="工程目录" value="${esc(draft.directory)}" placeholder="/demo/payment-service"></label><button id="pick-demo-directory" type="button" class="quiet">选择演示目录</button><p class="muted">此原型不读取你的文件；产品通过本地目录选择器选取工程。</p><label>项目语言<select id="project-language" aria-label="项目语言"><option value="c_cpp">C / C++</option><option value="java">Java</option></select></label><div class="notice">将在该目录保存 zscope.yaml；它所在的目录就是扫描根，无需再填写 root / source_root。</div>`;$('#project-language').value=draft.language;$('#pick-demo-directory').onclick=()=>{$('#project-name').value='payment-service';$('#project-directory').value='/demo/payment-service';};}if(step===1)body.innerHTML=`<label>模型服务地址<input id="model-endpoint" aria-label="模型服务地址" value="${esc(draft.endpoint)}"></label><label>模型名称<input id="model-name" aria-label="模型名称" value="${esc(draft.model)}"></label><label>API Key<input type="password" aria-label="演示 API Key" placeholder="演示中不填写真实密钥" autocomplete="off" disabled></label><p class="notice">这是明确标注的演示配置；本页不会发出模型连接或计费请求。真实密钥不保存到原型。</p>`;if(step===2){body.innerHTML=modeCards(draft.mode,draft.language==='java')+`<p class="muted">${draft.language==='java'?'Java 当前仅支持快速。':'三种模式都在当前支持的能力范围内工作；不以档位名称承诺完整覆盖。'}</p>`;body.onchange=()=>body.querySelectorAll('.mode-option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));}if(step===3)body.innerHTML=`<dl class="settings-list"><div><dt>工程</dt><dd>${esc(draft.name)}</dd></div><div><dt>配置将保存在</dt><dd class="mono">${esc(draft.directory)}/zscope.yaml</dd></div><div><dt>扫描根目录</dt><dd class="mono">${esc(draft.directory)}</dd></div><div><dt>语言与模式</dt><dd>${draft.language==='java'?'Java':'C / C++'} · ${modes[draft.mode][0]}</dd></div><div><dt>模型名称</dt><dd>${esc(draft.model)}</dd></div></dl><div class="notice">示例参数格式已检查。真实工程、工具运行和模型连接尚未验证。本次仅创建浏览器内演示记录，不写磁盘 YAML。</div>`;}
$('#next-step').onclick=()=>{collect();if(step===0&&(!draft.name||!draft.directory||!draft.directory.startsWith('/'))){$('#wizard-error').textContent='填写工程名称与绝对演示目录，例如 /demo/payment-service。';return}if(step===1){try{const url=new URL(draft.endpoint);if(!['http:','https:'].includes(url.protocol)||!draft.model)throw Error()}catch{$('#wizard-error').textContent='请填写有效模型服务地址与模型名称。';return}}if(step<3){step++;renderWizard()}else{const id='demo-project-'+Date.now();projects.push({...draft,id});selected=id;persist();$('#wizard').close();go('overview')}};$('#previous-step').onclick=()=>{collect();step=Math.max(0,step-1);renderWizard()};$('#close-wizard').onclick=()=>$('#wizard').close();$('#wizard-form').onsubmit=event=>event.preventDefault();$('#switch-project').onclick=()=>go('projects');window.onhashchange=render;render();
</script></body></html>
