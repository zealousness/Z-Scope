# Z-SCOPE Global Configuration

llm:
  provider: openai
  base_url: https://api.siliconflow.cn/v1
  models:
    - Qwen/Qwen3-Coder-480B-A35B-Instruct
    - Qwen/Qwen3-Coder-30B-A3B-Instruct
  api_key: REDACTED_REVOKED_CREDENTIAL
  temperature: 0.1
  max_tokens: 4096

project:
  root: .
  entry_function: main  # Used in single-function mode
  # entry_functions_list: example_functions.json  # Uncomment to activate batch mode
  agents:
    - name: semantic_modeler
      enabled: true
    - name: vulnerability_analyzer
      task: "查找逻辑漏洞、内存安全问题和并发风险。"
      enabled: true
    - name: issue_reconciler_agent
      enabled: true
      llm_ref: default
      mode: both

indexing:
  backend: joern  # joern | clang | unified | regex

  # ── Joern 后端 ──
  joern_path: dependency/joern/joern
  joern_server_host: 127.0.0.1
  joern_server_port: 8080
  joern_heap_size: 8g

  # ── Clang 后端（需要 compile_commands.json）──
  # clang_db_path: .zscope_clang/knowledge.db
  # compile_commands_path: build/compile_commands.json

  # ── SVF 配置（unified 模式使用）──
  # svf_bin_dir: dependency/svf/bin
  # gclang_path: gclang
  # get_bc_path: get-bc
  # llvm_link_path: llvm-link
  # svf_heap_limit_mb: 32768
  # svf_timeout: 1800

analysis:
  max_recursion_depth: 3
  max_function_lines: 500
  max_tool_iterations: 50
  snapshot_dir: .zscope_snapshots
  enable_snapshot_cache: true
  parallel_workers: 5  # Number of concurrent workers for batch analysis
