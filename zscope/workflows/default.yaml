name: default
mode: default
description: Full fresh scan from configured or discovered entry functions.
steps:
  - id: discover_entries
    scope: session
    handler: discover_entries
    action: classify API, communication, thread, and other user-input entries when requested
  - id: collect_candidates
    scope: entry
    agent: hypothesis_hunter
    action: register deterministic and bounded hypothesis candidates in the Candidate Ledger
  - id: validate_candidates
    scope: entry
    agent: proof_engine
    action: replay proof actions and close registered candidates through TerminalAuthority
  - id: persist_report
    scope: entry
    action: write final JSON/Markdown report and snapshot final_report_file
