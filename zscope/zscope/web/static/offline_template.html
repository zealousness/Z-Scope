<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Z-SCOPE 离线审计页面</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #111827; color: #f3f4f6; }
header { padding: 12px 16px; background: #1f2937; position: sticky; top: 0; }
main { display: grid; grid-template-columns: 360px 1fr; gap: 12px; padding: 12px; height: calc(100vh - 56px); box-sizing: border-box; }
.panel { background: #1f2937; border-radius: 10px; padding: 12px; overflow: auto; }
.issue { border: 1px solid #374151; border-radius: 8px; padding: 8px; margin-bottom: 8px; cursor: pointer; }
.issue.active { border-color: #60a5fa; background: #111827; }
label { display: block; font-size: 12px; color: #9ca3af; margin: 10px 0 4px; }
input, select, textarea { width: 100%; box-sizing: border-box; background: #111827; color: #f3f4f6; border: 1px solid #374151; border-radius: 6px; padding: 8px; }
textarea { min-height: 100px; }
button { background: #2563eb; border: 0; border-radius: 6px; color: white; padding: 8px 10px; cursor: pointer; margin-right: 8px; }
small { color: #9ca3af; }
pre { white-space: pre-wrap; background: #111827; border: 1px solid #374151; border-radius: 6px; padding: 8px; }
</style>
</head>
<body>
<script id="zscope-offline-state" type="application/json">__ZCOPE_OFFLINE_STATE__</script>
<header>
  <button id="savePageBtn">保存当前离线页面</button>
  <small>该页面可离线编辑 validation_status / validation_reasoning，保存后可导入在线 WebUI。</small>
</header>
<main>
  <section class="panel">
    <h3>审计发现</h3>
    <div id="issueList"></div>
  </section>
  <section class="panel">
    <h3 id="title">请选择问题</h3>
    <label>函数</label><input id="fn" readonly>
    <label>位置</label><input id="loc" readonly>
    <label>验证状态</label>
    <select id="status"><option value="validated">validated</option><option value="pending">pending</option><option value="rejected">rejected</option></select>
    <label>验证说明</label><textarea id="reason"></textarea>
    <label>漏洞描述</label><pre id="desc"></pre>
  </section>
</main>
<script>
(() => {
  const state = JSON.parse(document.getElementById('zscope-offline-state').textContent || '{}');
  state.findings = Array.isArray(state.findings) ? state.findings : [];
  let current = -1;
  const listEl = document.getElementById('issueList');
  const fnEl = document.getElementById('fn');
  const locEl = document.getElementById('loc');
  const statusEl = document.getElementById('status');
  const reasonEl = document.getElementById('reason');
  const descEl = document.getElementById('desc');
  const titleEl = document.getElementById('title');

  function renderList() {
    listEl.innerHTML = '';
    state.findings.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'issue' + (i === current ? ' active' : '');
      div.innerHTML = '<b>' + (f.function || 'unknown') + '</b><br><small>' + (f.location || '-') + '</small><br><small>' + (f.validation_status || 'pending') + '</small>';
      div.onclick = () => select(i);
      listEl.appendChild(div);
    });
  }

  function select(i) {
    current = i;
    const f = state.findings[i];
    if (!f) return;
    titleEl.textContent = (f.id || 'issue') + ' - ' + (f.subcategory || '');
    fnEl.value = f.function || '';
    locEl.value = f.location || '';
    statusEl.value = f.validation_status || 'pending';
    reasonEl.value = f.validation_reasoning || '';
    descEl.textContent = f.description || '';
    renderList();
  }

  statusEl.addEventListener('change', () => {
    if (current < 0) return;
    state.findings[current].validation_status = statusEl.value;
    renderList();
  });

  reasonEl.addEventListener('input', () => {
    if (current < 0) return;
    state.findings[current].validation_reasoning = reasonEl.value;
  });

  document.getElementById('savePageBtn').addEventListener('click', () => {
    const json = JSON.stringify(state).replace(/<\/script>/gi, '<\\/script>');
    const html = document.documentElement.outerHTML.replace(/<script id="zscope-offline-state" type="application\/json">[\s\S]*?<\/script>/i, '<script id="zscope-offline-state" type="application/json">' + json + '<\/script>');
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zscope-offline-dashboard.html';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  renderList();
  if (state.findings.length > 0) select(0);
})();
</script>
</body>
</html>
