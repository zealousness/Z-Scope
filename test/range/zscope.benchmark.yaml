# Canonical C/C++ Range benchmark configuration. The runner copies the fixture
# into an isolated directory and rewrites only project.root/state locations.
config_version: 2

llms:
  default:
    base_urls: ["https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1"]
    models: ["deepseek-v4-flash"]
    response_model_map:
      deepseek-v4-flash: deepseek-v4-flash-ga-260731
    api_key: ${Z_SCOPE_API_KEY}
    base_url_max_concurrent_requests: 8
    max_tokens: 8192
    max_retries: 2
    retry_until_available: false
    # The gateway accepts response_format/json_schema but does not reliably
    # honor the full Validator object contract.  Use the verified forced
    # function-tool schema path instead.
    supports_structured_output: false
    require_exact_response_model: true
    timeout: 120

project:
  root: test/range
  source_root: .
  language: c_cpp
  compile_commands_path: build/compile_commands.json
  include_paths: [include, internal, src]
  exclude_paths: [build]
  entry_discovery:
    enabled: true
    search_root: .
    interface_files: ["**/*.h"]
    max_entries: 200
    max_functions: 1000

scan:
  # Empty activates every C/C++-applicable Skill; non-empty text narrows focus.
  task: ""

indexing:
  backend: unified
  svf:
    scope: auto
    entry_depth: 4
    max_selected_tus: 200
    fallback: full
    groups_file: ""
    always_include: []
    exclusive_pools: []
    shared_pools: []
    heap_limit_mb: 8192
    timeout_seconds: 600
  tools:
    clangd: clangd
    gclang: gclang
    get_bc: get-bc
    llvm_link: llvm-link

concurrency:
  entry_workers: 8
  validator_workers: 8
  investigator_workers: 1
  evidence_completion_workers: 2
  index_workers: 4
  svf_workers: 2
  llm_max_inflight: 8
