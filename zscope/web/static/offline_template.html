<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Z-SCOPE · 离线 Markdown 复核</title>
<style>__ASSET_prism.css__</style><style>__ASSET_report_view.css__</style>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;color:#0f172a;background:#f5f7fb;height:100vh;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:6px;padding:7px 12px;background:white;color:#334155}button:hover{border-color:#6366f1}button:disabled{opacity:.5;cursor:wait}
.offline-header{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:white;border-bottom:1px solid #e2e8f0}.offline-header strong{font-size:20px;margin-right:auto}
.offline-message{padding:8px 20px;min-height:38px;color:#475569;background:#eef2ff}main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;flex:1;min-height:0;padding:16px}
.offline-queue,.offline-detail{background:white;border:1px solid #e2e8f0;border-radius:10px;min-height:0;overflow:hidden;display:flex;flex-direction:column}.offline-filters{padding:16px;display:grid;gap:10px;border-bottom:1px solid #e2e8f0}.offline-filters input,.offline-filters select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px}
#issue-list{padding:10px;overflow:auto;min-height:0}#issue-list button{display:block;width:100%;text-align:left;margin-bottom:8px;overflow-wrap:anywhere}#issue-list button.active{background:#eef2ff;border-color:#6366f1}#issue-list small{display:block;color:#64748b}.review-editor{border-top:1px solid #e2e8f0;padding:12px 18px;flex-shrink:0;background:#fafbfe}.review-editor header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.review-editor textarea{width:100%;height:78px;min-height:60px;max-height:28vh;resize:vertical;border:1px solid #cbd5e1;border-radius:6px;padding:10px}.review-editor select{padding:6px;border:1px solid #cbd5e1;border-radius:6px}#review-preview{max-height:24vh;overflow:auto;padding:8px;font-size:14px}.offline-help{padding:30px;line-height:1.9;color:#475569}.primary{background:#4f46e5;color:white;border-color:#4f46e5}.primary:hover{background:#4338ca}
@media(max-width:800px){main{grid-template-columns:220px minmax(0,1fr);padding:8px;gap:8px}.offline-header{padding:10px}.offline-filters{padding:10px}}
@media(max-width:560px){main{display:flex;flex-direction:column}.offline-queue{max-height:25vh}.offline-detail{flex:1}.offline-header strong{font-size:16px}}
</style></head><body>
<script id="zscope-manifest" type="application/json">__ZSCOPE_MANIFEST__</script>
<script id="zscope-licenses" type="application/json">__ZSCOPE_LICENSES__</script>
<header class="offline-header"><strong>Z-SCOPE <small>离线复核</small></strong><button id="open-directory" class="primary">打开报告目录</button><button id="open-files">选择 Markdown / ZIP</button><button id="save-all">保存已修改文件</button><button id="download-changes">下载修改包</button></header>
<div id="message" class="offline-message" role="status">选择包含 index.html 与 issues/ 的报告目录，开始离线复核。</div>
<input id="files" type="file" multiple accept=".md,.zip" hidden><input id="directory-files" type="file" webkitdirectory multiple hidden>
<main><aside class="offline-queue"><div class="offline-filters"><input id="search" placeholder="搜索函数、位置或报告内容" aria-label="搜索 issue"><select id="view" aria-label="报告视图"><option value="default">默认发现</option><option value="with_needs_review">含待复核</option></select><select id="status-filter" aria-label="验证状态"><option value="">全部验证状态</option></select><span id="count"></span></div><div id="issue-list"></div></aside>
<section class="offline-detail"><nav id="toc" class="report-toc" aria-label="报告章节"></nav><div id="reading" class="report-scroll"><div id="report" class="markdown-report"><div class="offline-help">每条 issue 的证据、根因、修复建议和 Validator 原文都保存在独立 Markdown 文件中。<br>网页仅编辑验证状态和本次人工说明；历史说明保留为只读。<br><strong>本次说明留空的条目，导入线上时不会更新。</strong></div></div></div><section id="editor" class="review-editor" hidden><header><strong>本次人工反驳 / 复核说明</strong><select id="review-status" aria-label="本次验证状态"></select><button id="preview">预览说明</button><button id="save-current" class="primary">保存当前条</button><span id="dirty-label"></span></header><textarea id="review-note" placeholder="填写本次复核依据，支持 Markdown；留空时不会回写该 issue。" aria-label="本次人工说明"></textarea><div id="review-preview" class="markdown-report" hidden></div></section></section></main>
<script>__ASSET_markdown-it.js__</script><script>__ASSET_js-yaml.js__</script><script>__ASSET_fflate.js__</script><script>__ASSET_prism.js__</script><script>__ASSET_prism-c.js__</script><script>__ASSET_prism-cpp.js__</script><script>__ASSET_prism-java.js__</script><script>__ASSET_report_view.js__</script><script>__ASSET_offline_review.js__</script>
</body></html>
