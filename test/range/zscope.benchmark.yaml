# Canonical C/C++ Range benchmark configuration. The runner copies the fixture
# into an isolated directory and rewrites only the single target compile database.
config_version: 3

llms:
  default:
    base_urls: ["${Z_SCOPE_LLM_BASE_URL}"]
    models: ["${Z_SCOPE_LLM_MODEL}"]
    api_key: ${Z_SCOPE_API_KEY}
    base_url_max_concurrent_requests: 16
    max_tokens: 8192
    max_retries: 4
    retry_until_available: true
    timeout: 120

project:
  language: c_cpp
  platform: linux_user
  semantics_file: zscope.semantics.yaml
  targets:
    - id: range
      compile_commands: build/compile_commands.json

scan:
  preset: fast

execution:
  max_workers: 8

# Each parallel baseline trial owns one SVF worker.
concurrency:
  svf_workers: 1
