name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zscope-2-change-scope:
    name: Z-SCOPE 2.0 change-scope governance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install hash-locked governance dependencies
        run: |
          python -m pip install --require-hashes -r requirements/constraints/py313.txt
          python -m pip install --no-deps -e .
      - name: Reject mixed product, truth/fixture, and scorer changes
        env:
          Z_SCOPE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          Z_SCOPE_CHANGE_HEAD: ${{ github.sha }}
        run: |
          python scripts/check_zscope_2_change_scope.py \
            --base "$Z_SCOPE_CHANGE_BASE" \
            --head "$Z_SCOPE_CHANGE_HEAD"
          python -m pytest -q tests/test_zscope_2_change_scope.py

  successor-review-authoritative-provenance:
    name: Successor review authoritative artifact provenance
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore and compare newly integrated reviewed artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Z_SCOPE_P6_ENVIRONMENT: p6-successor-review-integration
          SUCCESSOR_CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          SUCCESSOR_CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status="$(python -c 'import json; print(json.load(open("candidate/zscope/orchestration/successor-runtime-review-status.v1.json", encoding="utf-8"))["status"])')"
          if [[ "$status" == "reviewed" ]]; then
            test -f control/scripts/project_successor_review_evidence.py
            python -m pip install --require-hashes -r control/requirements/constraints/py313.txt
            python -m pip install --no-deps -e control
            (cd candidate && python ../control/scripts/project_successor_review_evidence.py online-check \
              --repository-root . \
              --resource-root zscope/orchestration \
              --change-base "$SUCCESSOR_CHANGE_BASE" \
              --head "$SUCCESSOR_CHANGE_HEAD")
          elif [[ "$status" == "in_progress" ]]; then
            python -m pip install --require-hashes -r candidate/requirements/constraints/py313.txt
            python -m pip install --no-deps -e candidate
            (cd candidate && python scripts/project_successor_review_evidence.py online-check \
              --repository-root . \
              --resource-root zscope/orchestration \
              --change-base "$SUCCESSOR_CHANGE_BASE" \
              --head "$SUCCESSOR_CHANGE_HEAD")
          else
            exit 2
          fi

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.9", lock: "py39"}
          - {python: "3.10", lock: "py310"}
          - {python: "3.11", lock: "py311"}
          - {python: "3.12", lock: "py312"}
          - {python: "3.13", lock: "py313"}
          - {python: "3.14", lock: "py314"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/constraints/${{ matrix.lock }}.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/constraints/${{ matrix.lock }}.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Full tests and CLI smoke
        run: |
          python scripts/check_p2_proof_lifecycle.py
          python scripts/qualify_p6_proof_promotion.py --check
          python -m pytest -q
          zscope --version
          zscope-init --help
          zscope-doctor --help
          zscope-rules --help
          zscope-maven-cache --help
          zscope-benchmark --help
      - name: Build and install wheel
        env:
          SUCCESSOR_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/project_successor_review_evidence.py check \
            --repository-root . \
            --head HEAD \
            --change-base "$SUCCESSOR_CHANGE_BASE"
          SUCCESSOR_STATUS="$(python -c 'from zscope.orchestration.successor_runtime_review_status import SUCCESSOR_RUNTIME_REVIEW_STATUS; print(SUCCESSOR_RUNTIME_REVIEW_STATUS)')"
          python -m build --wheel
          python scripts/check_p2_proof_package.py dist/zscope-*.whl
          python scripts/check_p4_hypothesis_package.py dist/zscope-*.whl
          python scripts/check_p5_runtime_authority_package.py dist/zscope-*.whl
          python -m pip install --force-reinstall --no-deps dist/zscope-*.whl
          python -m pip check
          INSTALLED_CHECK_ROOT="$(mktemp -d)"
          (cd "$INSTALLED_CHECK_ROOT" && Z_SCOPE_EXPECTED_SUCCESSOR_STATUS="$SUCCESSOR_STATUS" python -c 'import os; from zscope.orchestration.successor_runtime_review_status import SUCCESSOR_RUNTIME_REVIEW_STATUS, current_successor_reviewed; expected = os.environ["Z_SCOPE_EXPECTED_SUCCESSOR_STATUS"]; assert SUCCESSOR_RUNTIME_REVIEW_STATUS == expected; assert current_successor_reviewed() is (expected == "reviewed")')

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r requirements/constraints/py313.txt
          python -m pip install --no-deps -e .
      - name: Python 3.9 syntax, typing, formatting, docs, and rule schema
        run: |
          python -m compileall -f -q \
            zscope scripts tests tools test/range/benchmark test/java_range/benchmark
          python scripts/check_mypy_baseline.py
          python scripts/check_black_baseline.py
          python scripts/check_p2_proof_lifecycle.py
          python scripts/qualify_p6_proof_promotion.py --check
          python -m pytest -q tests/test_agent_docs.py tests/test_rule_extensions.py tests/test_benchmark_protocol.py
          python -m pytest -q tests/test_proof_kernel.py tests/test_p2_proof_corpus.py tests/test_p2_proof_lifecycle.py tests/test_p2_proof_package.py
          python -m pytest -q tests/test_p4_hypothesis_package.py tests/test_p5_runtime_authority_package.py tests/test_p6_proof_promotion_qualification.py tests/test_audit_eligibility.py
          python -m pytest -q tests/test_p6_local_runtime.py tests/test_p6_balanced_orchestrator.py tests/test_p6_balanced_quality_gate.py tests/test_p6_workflow_protocol.py

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r requirements/constraints/py313.txt
          python -m pip install --no-deps -e .
      - name: Build and test Java sidecars
        run: |
          for pom in tools/java-*/pom.xml; do mvn -B -f "$pom" test package; done
          python -m pytest -q tests/test_java_*.py

  benchmark-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install and validate canonical benchmark assets
        run: |
          python -m pip install --require-hashes -r requirements/constraints/py313.txt
          python -m pip install --no-deps -e .
          python scripts/check_benchmark_hygiene.py
          zscope-benchmark run --language c_cpp --mode smoke --output benchmark-artifacts/cpp-smoke
          zscope-benchmark run --language java --mode smoke --output benchmark-artifacts/java-smoke
      - name: Verify smoke paths from a tracked-only archive
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$archive_dir"
          python -m zscope.cli.benchmark run --language c_cpp --mode smoke --output "$RUNNER_TEMP/archive-cpp-smoke"
          python -m zscope.cli.benchmark run --language java --mode smoke --output "$RUNNER_TEMP/archive-java-smoke"
      - name: Assert tracked fixture remains clean
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  offline-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: bash scripts/smoke_offline_install.sh

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          python scripts/scan_git_history_secrets.py --ref HEAD
          python scripts/scan_git_history_secrets.py --current-only

  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/release/py313.txt
      - name: Install hash-locked release dependencies
        run: |
          python -m pip install --require-hashes -r requirements/release/py313.txt
          python -m pip check
      - name: Audit known vulnerabilities
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements/release/py313.txt
          require-hashes: true
          no-deps: true
          disable-pip: true
      - name: Enforce approved dependency licenses
        run: |
          python scripts/check_dependency_licenses.py \
            --requirements requirements/release/py313.txt \
            --policy requirements/license-policy.json
