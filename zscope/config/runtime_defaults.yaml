runtime_spec_version: 1

agents:
  semantic_modeler:
    enabled: true
    llm_role: modeling
  vulnerability_analyzer:
    enabled: true
    llm_role: analysis
    can_spawn_subagents: true
  issue_reconciler_agent:
    enabled: true
    llm_role: modeling
  validator_agent:
    enabled: true
    llm_role: validation

analysis:
  max_recursion_depth: 3
  max_function_lines: 500
  max_tool_iterations: 50
  enable_snapshot_cache: true
  validation_cache_entries: 4096
  enable_global_model: false
  max_premodel_depth: 3
  max_premodel_callees: 20
  trivial_function_max_lines: 5
  enable_subagent_workers: false
  max_subagent_tickets: 4
  subagent_max_turns: 20
  request_deadline_seconds: 120
  validation_deadline_seconds: 240
  subagent_ticket_timeout: 300
  entry_deadline_seconds: 1800
  scan_deadline_seconds: null
  budget_exhaustion_policy: observe
  subagent_spawn_allowlist: [deep_worker]
  subagent_skill_llm_refs: {}
  subagent_skill_efforts: {}
  tool_audit_log: ""

reporting:
  semantic_dedup:
    enabled: true
    llm_enabled: false
    llm_confidence_threshold: 0.85
    max_cluster_size: 8

paths:
  knowledge_db: .zscope_knowledge/code_knowledge.db
  snapshots: .zscope_snapshots
  user_config_file: .zscope_snapshots/user_config.xlsx
