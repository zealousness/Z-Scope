  models:
    - Qwen/Qwen3-Coder-480B-A35B-Instruct
    - Qwen/Qwen3-Coder-30B-A3B-Instruct
  api_key: sk-bsmfjfhzehkxvollbeazfgswoxytcvitdsqnivbyjnnipnbg
  temperature: 0.1
  max_tokens: 4096

project:
  root: .
  entry_function: main  # Used in single-function mode
  # entry_functions_list: example_functions.json  # Uncomment to activate batch mode
  agents:
    - name: semantic_modeler
      enabled: true
    - name: vulnerability_analyzer
      task: "查找逻辑漏洞、内存安全问题和并发风险。"
