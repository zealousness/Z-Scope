config_version: 2

llms:
  default:
    base_urls: ["http://127.0.0.1:9/v1"]
    models: ["must-not-be-called"]
    api_key: "qualification-no-network"
    max_tokens: 1024
    max_retries: 0
    retry_until_available: false

project:
  language: c_cpp
  root: tests/fixtures/p5_cjson/source
  source_root: .
  entry_discovery:
    enabled: true
    search_root: .
    interface_files: ["*.h"]
    max_entries: 100

scan:
  depth: fast
  task: ""

indexing:
  backend: regex

concurrency:
  entry_workers: 1
  validator_workers: 1
  investigator_workers: 1
  evidence_completion_workers: 1
  index_workers: 1
  svf_workers: 1
  llm_max_inflight: 1
